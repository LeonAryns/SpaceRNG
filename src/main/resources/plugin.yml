name: SpaceRNG
version: '1.0.0'
main: com.spacerng.solrng.SolRNGPlugin
api-version: '1.21'
author: LaLaLeon
description: Rarity-roll RNG progression plugin for SpaceRNG
softdepend: [Vault, PlaceholderAPI]

commands:
  rngcore:
    description: Give yourself or another player a Roll item
    usage: /rngcore give <player> [amount]
    permission: solrng.admin
  skilltree:
    description: Open your skill tree
    usage: /skilltree
  convert:
    description: Open the item-to-points conversion menu
    usage: /convert
  tag:
    description: Manage your equipped rarity tag
    usage: /tag <equip|clear>
  index:
    description: View your collection log of every item you've rolled
    usage: /index
  prestige:
    description: View and spend your levels/prestige
    usage: /prestige
  armor:
    description: Buy armor sets for a Luck bonus while worn
    usage: /armor
  options:
    description: Toggle rolling sound and animation
    usage: /options
  starforge:
    description: Upgrade your Starforge for more base Luck
    usage: /starforge
  milestones:
    description: View your long-run milestone tracks
    usage: /milestones
    aliases: [milestone, ms]
  crops:
    description: Choose which crop the shared farm grows for you
    usage: /crops
  novacore:
    description: Climb the Nova Core tier ladder
    usage: /novacore
    aliases: [nova]
  farmtree:
    description: Open the farming skill tree
    usage: /farmtree
    aliases: [farmskills]
  guide:
    description: See the starting guide and what's next
    usage: /guide
    aliases: [quests, tutorial]
  daily:
    description: Claim your daily streak reward
    usage: /daily
    aliases: [streak, dailyreward]
  top:
    description: Leaderboards, including the daily farming payout
    usage: /top [farming|farming_total|rolls|prestige|index]
    aliases: [leaderboard, baltop]
  buy:
    description: Spend store Credits
    usage: /buy
    aliases: [store, shop]
  pass:
    description: Open the Battle Pass
    usage: /pass
    aliases: [battlepass, bp]
  stats:
    description: Every stat, and where it came from
    usage: /stats [player]
    aliases: [stat]
  leaderboards:
    description: Every standing in one place
    usage: /leaderboards
    aliases: [leaderboard, lb]
  shop:
    description: Every shop in one place
    usage: /shop
    aliases: [shops, menu]
  potion:
    description: Brew potions with rolled drops
    usage: /potion
    aliases: [potions, brew]
  boosts:
    description: See every boost currently running on you
    usage: /boosts
    aliases: [effects, potions]
  rngadmin:
    description: Admin tools for SpaceRNG
    usage: /rngadmin <reload|setspawn|starforge|reset|give|drops|bank|aura|roll|unlock|odds|farmblock|farmfill|crops|milestones|boost|nova|payout>
    permission: solrng.admin
    aliases: [solrngadmin]

permissions:
  solrng.admin:
    default: op
