name: SolRNG
version: '1.0.0'
main: com.spacerng.solrng.SolRNGPlugin
api-version: '1.21'
author: LaLaLeon
description: Rarity-roll RNG progression plugin for SpaceRNG
softdepend: [Vault, PlaceholderAPI]

commands:
  rngcore:
    description: Give yourself or another player a Roll item
    usage: /rngcore give <player> [amount]
    permission: solrng.admin
  skilltree:
    description: Open your skill tree
    usage: /skilltree
  convert:
    description: Open the item-to-points conversion menu
    usage: /convert
  tag:
    description: Manage your equipped rarity tag
    usage: /tag <equip|clear>
  index:
    description: View your collection log of every item you've rolled
    usage: /index
  prestige:
    description: View and spend your levels/prestige
    usage: /prestige
  armor:
    description: Buy armor sets for a Luck bonus while worn
    usage: /armor
  options:
    description: Toggle rolling sound and animation
    usage: /options
  starforge:
    description: Upgrade your Starforge for more base Luck
    usage: /starforge
  milestones:
    description: View your long-run milestone tracks
    usage: /milestones
    aliases: [milestone, ms]
  crops:
    description: Choose which crop the shared farm grows for you
    usage: /crops
  novacore:
    description: Climb the Nova Core tier ladder
    usage: /novacore
    aliases: [nova]
  farmtree:
    description: Open the farming skill tree
    usage: /farmtree
    aliases: [farmskills]
  guide:
    description: See the starting guide and what's next
    usage: /guide
    aliases: [quests, tutorial]
  buy:
    description: Spend store Credits
    usage: /buy
    aliases: [store, shop]
  rngadmin:
    description: Admin tools for SolRNG
    usage: /rngadmin <reload|setspawn|starforge|reset|give|drops|bank|aura|roll|unlock|odds|farmblock|farmfill|crops|milestones|boost|nova>
    permission: solrng.admin
    aliases: [solrngadmin]

permissions:
  solrng.admin:
    default: op
