name: SpaceRNG
version: '${project.version}'
main: com.spacerng.solrng.SolRNGPlugin
api-version: '1.21'
author: LaLaLeon
description: Rarity-roll RNG progression plugin for SpaceRNG
softdepend: [Vault, PlaceholderAPI, DiscordSRV, Multiverse-Core]

commands:
  rngcore:
    description: Give yourself or another player a Roll item
    usage: /rngcore give <player> [amount]
    permission: solrng.admin
  skilltree:
    description: Open your skill tree
    usage: /skilltree
  convert:
    description: Open the item-to-points conversion menu
    usage: /convert
  tag:
    description: Open your index to pick a tag, or manage the one you wear
    usage: /tag [equip|clear]
  cosmetics:
    description: Your auras, titles and name colour
    usage: /cosmetics
    aliases: [cosmetic]
  firsts:
    description: Who took the Server First spots, per rarity
    usage: /firsts
  index:
    description: View your collection log of every item you've rolled
    usage: /index
  prestige:
    description: View and spend your levels/prestige
    usage: /prestige
  armor:
    description: Buy armor sets for a Luck bonus while worn
    usage: /armor
  options:
    description: Toggle rolling sound and animation
    usage: /options
  starforge:
    description: Upgrade your Starforge for more base Luck
    usage: /starforge
  milestones:
    description: View your long-run milestone tracks
    usage: /milestones
    aliases: [milestone, ms]
  crops:
    description: Choose which crop the shared farm grows for you
    usage: /crops
  novacore:
    description: Climb the Nova Core tier ladder
    usage: /novacore
    aliases: [nova]
  farmtree:
    description: Open the farming skill tree
    usage: /farmtree
    aliases: [farmskills]
  guide:
    description: See the starting guide and what's next
    usage: /guide
    aliases: [quests, tutorial]
  daily:
    description: Claim your daily streak reward
    usage: /daily
    aliases: [streak, dailyreward]
  top:
    description: Leaderboards, including the daily farming payout
    usage: /top [farming|farming_total|rolls|prestige|index]
    aliases: [baltop]
  buy:
    description: Spend store Credits
    usage: /buy
    aliases: [store]
  pass:
    description: Open the Battle Pass
    usage: /pass
    aliases: [battlepass, bp]
  stats:
    description: Every stat, and where it came from
    usage: /stats [player]
    aliases: [stat]
  leaderboards:
    description: Every standing in one place
    usage: /leaderboards
    aliases: [leaderboard, lb]
  shop:
    description: Every shop in one place
    usage: /shop
    aliases: [shops, menu]
  potion:
    description: Brew potions with rolled drops
    usage: /potion
    aliases: [potions, brew]
  limitluck:
    description: Roll with less Luck than you have, to fill in the common end of your index
    usage: /limitluck <percent|off>
    aliases: [lucklimit, capluck]
  boosts:
    description: See every boost currently running on you
    usage: /boosts
    aliases: [effects]
  perks:
    description: Roll a perk with Perk Tickets
    usage: /perks [index]
    aliases: [perk, perkroll]
  linked:
    description: See your Discord link status and its bonuses
    usage: /linked
    aliases: [link, discordlink]
  stash:
    description: Collect items that didn't fit in your inventory
    usage: /stash
  aura:
    description: Pick which aura you wear
    usage: /aura
    aliases: [auras]
  pv:
    description: Open your private vault pages
    usage: /pv [page]
    aliases: [vault, pvault]
  ranks:
    description: See the rank ladder and buy a rank with Credits
    usage: /ranks
    aliases: [rank]
  keyall:
    description: Give every online player keys, once every cooldown
    usage: /keyall
  fly:
    description: Toggle flight, for the ranks that carry it
    usage: /fly
  nick:
    description: Set the name shown in tab and chat
    usage: /nick <name|off>
    aliases: [nickname]
  size:
    description: Change how big you are, for the top rank
    usage: /size <0.5 to 1.5|reset>
  boss:
    description: See the boss that is up and who is hurting it
    usage: /boss
  pets:
    description: Your pet slots and every pet
    usage: /pets
  rngadmin:
    description: Admin tools for SpaceRNG
    usage: /rngadmin <subcommand>, or /rngadmin alone for the full list
    permission: solrng.admin
    aliases: [solrngadmin]

permissions:
  solrng.admin:
    default: op
