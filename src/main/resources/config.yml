  # a stage worth reaching takes a pile of these rather than one lucky
  # crate, so nothing hands out more than a quarter at a time.
  luck_5:
    display: "Permanent Luck +5%"
    material: RABBIT_FOOT
    colors: ["#C8E6C9", "#66BB6A"]
    permanent-luck: 0.05
