# /index — every unique item a player has ever rolled gets logged here.
# Each item carries its own Luck MULTIPLIER, derived automatically from
# its odds within its rarity: the rarest item in a tier gets the top of
# that tier's band, the most common gets the bottom, everything else
# scales linearly between them.
#
# Discovering an item adds its (multiplier - 1) to your index bonus, so
# your total is 1 + the sum of everything you've found. Rare finds move
# the needle far more than common ones.
index:
  luck-multipliers:
    COMMON: [1.0, 1.1]
    UNCOMMON: [1.1, 1.25]
    RARE: [1.25, 1.5]
    EPIC: [1.5, 2.0]
    LEGENDARY: [2.0, 3.0]
    MYTHICAL: [3.0, 5.0]

# How many points ("Credits") a single item of each rarity is worth
# when converted via /convert.
# Legacy: /convert now banks a stored drop of the item's own rarity
# instead of paying Credits, so nothing reads these any more. Kept so the
# values aren't lost if a Credit payout ever comes back.
conversion:
  points-per-rarity:
    COMMON: 1
    UNCOMMON: 5
    RARE: 25
    EPIC: 150
    LEGENDARY: 1000
    MYTHICAL: 10000

# Every roll also pays out real Money (Vault), on top of the item itself —
# money = item's odds x this multiplier, so a 1-in-30 item pays 300 Money
# at the default 10x. Requires Vault + an economy plugin to be installed.
economy:
  money-per-odds-multiplier: 10.0

# Skill tree nodes. "requires" is the id of the node that must be
# unlocked first (blank = no requirement). "effect" tells the plugin
# what the node does; "value" is its magnitude.
skilltree:
  # Nodes are paid for with Money (cost-money, Vault). Rolled drops are
  # the currency for /armor, potions and farming-hoe upgrades instead.
  # "cost-growth" multiplies the price after each level of a leveled node
  # (1.2 = each level costs 20% more than the last); omit it for flat.
  # Slot comments are (column, row), both 1-indexed, in the 6x9 grid.
  nodes:
    auto_roll_root:            # (5,6) - the root
      display: "Auto Roll"
      slot: "5,6"
      icon: CLOCK
      cost-money: 1000
      requires: ""
      effect: AUTO_ROLL
      value: 0

    luck_skill:                # (5,5) - directly above the root
      display: "Luck"
      slot: "5,5"
      icon: RABBIT_FOOT
      cost-money: 1000
      cost-growth: 1.2
      requires: "auto_roll_root"
      effect: LUCK
      value: 0.05
      max-level: 10

    # ROLL_SPEED value 0.02 = +2 Speed per level (100 Speed = baseline).
    speed_skill:               # (4,5)
      display: "Speed"
      slot: "4,5"
      icon: SUGAR
      cost-money: 2000
      requires: "luck_skill"
      effect: ROLL_SPEED
      value: 0.02
      max-level: 10

    auto_convert:              # (6,5)
      display: "Auto Convert"
      slot: "6,5"
      icon: HOPPER
      cost-money: 5000
      requires: "luck_skill"
      effect: UNLOCK_AUTO_CONVERT
      value: 0

    # Turns on the equipped tag's index Luck multiplier. Until this is
    # bought the multiplier reads 1.00x no matter what's equipped, so the
    # whole index chase has a gate in front of it.
    index_luck:                # (7,5)
      display: "Index Luck"
      slot: "7,5"
      icon: KNOWLEDGE_BOOK
      cost-money: 15000
      requires: "auto_convert"
      effect: UNLOCK_INDEX_LUCK
      value: 0

    # Sits at the far end of the right-hand branch, so Luck alone doesn't
    # expose it — the whole right branch has to be bought first.
    shiny_unlock:              # (8,5)
      display: "Shiny Unlocked"
      slot: "8,5"
      icon: AMETHYST_SHARD
      cost-money: 25000
      requires: "index_luck"
      effect: UNLOCK_SHINY
      value: 0

    farming_unlock:            # (5,4)
      display: "Farming Unlocked"
      slot: "5,4"
      icon: WHEAT
      cost-money: 10000
      requires: "luck_skill"
      effect: UNLOCK_FARMING
      value: 0

    # Armor and Potion have no requested position yet - parked in the
    # middle column above Farming until you pick their slots.
    armor_unlock:              # (5,3)
      display: "Armor Unlocked"
      slot: "5,3"
      icon: IRON_CHESTPLATE
      cost-money: 25000
      requires: "farming_unlock"
      effect: UNLOCK_ARMOR
      value: 0
    potion_unlock:             # (5,2)
      display: "Potion Unlocked"
      slot: "5,2"
      icon: BREWING_STAND
      cost-money: 100000
      requires: "armor_unlock"
      effect: UNLOCK_POTION
      value: 0

