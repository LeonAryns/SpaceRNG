# Commands the console runs when a gate skill is bought. Left blank the
# skill still unlocks, it just doesn't hand out a permission - which is
# what you want while the matching plugin isn't installed yet.
#
# {player} is replaced with the player's name. The Private Vault skill
# expects a /pv-style plugin to be present; PlayerVaults X (with LuckPerms
# for the permission) is the usual pairing on Paper 1.21.
unlock-commands:
  private-vault:
    - "lp user {player} permission set playervaults.amount.1 true"
    - "lp user {player} permission set playervaults.use true"

shiny:
  # Base 1 in 2,500. Shiny Boost nodes in /skilltree multiply this.
  chance: 0.0004
  node: "shiny_unlock"
  marker: "&b&l✦"
  broadcast: true

# DiscordSRV integration. When a player links their Minecraft account
# to Discord (typically via /discord link, provided by DiscordSRV), a
# passive bonus turns on until they unlink again. The first ever link
# also hands out a one-time gift, and cannot be farmed by unlinking
# and relinking - the "claimed" flag stays set forever.
#
# Every field below is optional. Delete anything you don't want.
linked-account:

  # The banner the whole server sees when somebody links. Fires once per
  # player ever, off the same flag as the first-link gift, so nobody can
  # put it in chat on a loop by unlinking and relinking. {player} is the
  # name of whoever linked.
  broadcast:
    enabled: true
    title: "DISCORD"
    subtitle: "COMMUNITY"
    lines:
      - "&f{player} &7linked their account"
      - "&7and picked up the Linked rank and a gift!"
  enabled: true
  bonus:
    money-percent: 0.10
    coins-percent: 0.10
    luck-percent: 0.10
    shiny-percent: 0.10
  first-link-gift:
    credits: 100
    coins: 25000
    money: 0
  link-message: "&5&lLinked to Discord! &7Bonuses are active while your account stays linked."
  unlink-message: "&cUnlinked from Discord. &7Bonuses removed."

# Discord announcements through a webhook. In Discord: Edit Channel,
# Integrations, Webhooks, New Webhook, Copy Webhook URL, then paste it
# below and run /rngadmin reload. Empty turns announcements off. No bot or
# DiscordSRV is needed for this part; DiscordSRV still does chat relay and
# /discord link.
discord:
  webhook-url: ""
  username: "SpaceRNG"
  announce:
    # Drops of these rarities are posted. Shinies are posted at any rarity
    # while shiny is true.
    drop-rarities: [MYTHICAL, DIVINE]
    shiny: true
    first-ten: true
    farming-payout: true
  # The cards, posted with /rngadmin discord card <id>. Everything here
  # is text, so the wording, the IPs and the vote links change without a
  # new jar. A field's value can be one line or a list of lines.
  cards:
    server:
      title: "SpaceRNG"
      color: "#C77DFF"
      description:
        - "**SpaceRNG** is a persistent RNG game: roll drops, farm the field,"
        - "climb the trees and keep everything you find. Nothing ever resets."
      fields:
        - name: "What you do"
          value:
            - "**Roll** for drops from Common to Divine, and hunt shinies"
            - "**Farm** the shared field with a hoe you upgrade yourself"
            - "**Bosses** every couple of hours, everyone fights their own"
          inline: false
        - name: "Java IP"
          value: "`spacerng.minehut.gg`"
          inline: true
        - name: "Bedrock"
          value: "`spacerng.minehut.gg` port `19132`"
          inline: true
        - name: "Link your account"
          value: "Type `/discord link` in game and follow the code."
          inline: false
    link:
      title: "How to Link"
      color: "#43A047"
      description:
        - "Connect your Minecraft account to Discord to unlock your link"
        - "rewards and the rest of the server."
      fields:
        - name: "1. Join the server"
          value: "Hop on `spacerng.minehut.gg` in Minecraft."
          inline: false
        - name: "2. Run /discord link in chat"
          value: "The server hands you a code."
          inline: false
        - name: "3. Send the code here"
          value: "Post **only the code** in the link channel. Typing the command in Discord does not work."
          inline: false
        - name: "What you get"
          value:
            - "A one-time gift of Credits and Coins"
            - "A passive bonus on Luck, Money, Coins and Shiny"
            - "The Linked rank, which opens auras and `/pv 1`"
          inline: false

  # The bot. It is not a bot of its own: DiscordSRV already runs one, so
  # the slash commands appear under that bot and the roles are handed out
  # by it. Without DiscordSRV installed none of this exists.
  #
  # Role ids are the long numbers you get by right clicking a role with
  # Developer Mode on. Leave one empty to not sync it.
  bot:
    enabled: true
    # Where slash commands may be used. Empty means anywhere.
    command-channel: ""
    # Given to everybody whose account is linked.
    linked-role: ""
    # One role per rank, by the rank's id in the ranks section.
    rank-roles:
      linked: ""
      comet: ""
      nova: ""
      supernova: ""
    # Take back the role of a rank somebody no longer has.
    remove-old-roles: true

# Perks are a second progression layer bought with drops, not Money.
# A roll trades a fixed number of drops of one tier for one random perk
# whose stats are drawn from that tier's chance table. Higher tiers roll
# stronger perks more often. Every perk has a random level I-V that
# scales its value linearly.
#
# Types decide WHICH stats a perk gives. Lower tiers boost one stat,
# higher tiers boost several: this is the "how many stats" table below.
# The exact stats a type can roll are hardcoded per PerkType in code -
# tune the pools by editing PerkType.java.
#
# Balance follows a shared formula:
#   effective = base * tierMult * levelMult
# So a Divine V perk is 100% of the top figure and a Common I perk is
# 1% of it. Both tier and level curves can be retuned here.
perks:
  # One perk at a time. A roll costs one Perk Ticket, lands on a perk by
  # its chance and a level from I to V, and replaces the perk you had,
  # unless that perk and level has confirmation switched on in
  # /perks index, which asks first.
  # Perk Tickets per purchase and what that many cost in Credits.
  ticket-prices:
    1: 35
    10: 320
    25: 750
  # The level a roll lands on, I to V.
  level-chances: [0.40, 0.30, 0.18, 0.09, 0.03]
  # This many rolls in a row without a Mythical or better make the next one
  # Mythical or Divine, picked by these chances.
  pity-rolls: 100
  pity-chances:
    MYTHICAL: 0.8
    DIVINE: 0.2
  # Every perk: its rarity, the chance a roll lands on it, and what each
  # stat gives at level I and at level V (0.5 is +50%). The levels between
  # step evenly. Stats: LUCK_PERCENT, MONEY_PERCENT, COINS_PERCENT,
  # ROLL_SPEED_FLAT, ENCHANT_PROC_PERCENT. Chances are weights and need
  # not add up to 1.
  types:
    money:
      display: "Money Perk"
      rarity: COMMON
      icon: GOLD_INGOT
      chance: 0.45
      stats:
        MONEY_PERCENT: [0.10, 0.50]
    coins:
      display: "Coin Perk"
      rarity: UNCOMMON
      icon: SUNFLOWER
      chance: 0.25
      stats:
        COINS_PERCENT: [0.10, 0.50]
    speed:
      display: "Speed Perk"
      rarity: RARE
      icon: SUGAR
      chance: 0.15
      stats:
        ROLL_SPEED_FLAT: [0.05, 0.25]
        MONEY_PERCENT: [0.10, 0.50]
    enchant:
      display: "Enchant Perk"
      rarity: EPIC
      icon: ENCHANTED_BOOK
      chance: 0.09
      stats:
        ENCHANT_PROC_PERCENT: [0.10, 0.50]
        COINS_PERCENT: [0.15, 0.75]
    fortune:
      display: "Fortune Perk"
      rarity: LEGENDARY
      icon: RABBIT_FOOT
      chance: 0.045
      stats:
        LUCK_PERCENT: [0.20, 1.00]
        MONEY_PERCENT: [0.30, 1.50]
    nova:
      display: "Nova Perk"
      rarity: MYTHICAL
      icon: HEART_OF_THE_SEA
      chance: 0.012
      stats:
        MONEY_PERCENT: [0.40, 2.00]
        COINS_PERCENT: [0.40, 2.00]
        ROLL_SPEED_FLAT: [0.10, 0.50]
    universe:
      display: "Universe"
      rarity: DIVINE
      icon: NETHER_STAR
      chance: 0.003
      stats:
        MONEY_PERCENT: [0.50, 2.50]
        COINS_PERCENT: [0.50, 2.50]
        ROLL_SPEED_FLAT: [0.15, 0.75]
        ENCHANT_PROC_PERCENT: [0.30, 1.50]
        LUCK_PERCENT: [0.25, 1.25]


# Ranks. Linked comes free with a Discord link; Comet, Nova and Supernova
# are bought with Credits in /ranks, or granted from the store with
#   rngadmin rank set <rank> <player>
# A rank multiplies Money, Luck and Speed, opens private vault pages, and
# unlocks commands. Switch a command off below when another plugin already
# has it. The order of tiers is the ladder.
ranks:
  enabled: true
  keyall-cooldown-hours: 8
  commands:
    fly: true
    nick: true
    size: true
  size:
    min: 0.5
    max: 1.5
  tiers:
    linked:
      display: "Linked"
      # The two lines of pitch under the name in /ranks. Two at most: a
      # third pushes the price off the bottom of the tooltip on a small
      # screen, and Minecraft cuts a tooltip off rather than fitting it.
      blurb:
        - "Link your Discord and the server knows you."
        - "It is also what switches your aura on."
      # Discord's current blurple into the older one. The tag is a single
      # character, so it takes the first stop; the second only shapes the
      # name behind it. The old second colour was grey, which washed a
      # linked player's name out halfway across.
      colors: ["#5865F2", "#7289DA"]
      tag: "✔"
      # The badge in front of a name, in tab and in chat: [C] for Comet.
      # Leave it out and a rank wears the first letter of its own name, so
      # a new rank added here needs nothing extra to look right.
      letter: "L"
      icon: NAME_TAG
      price-credits: 0
      multiplier: 1.0
      keyall-crate: ""
      keyall-amount: 0
      vault-pages: 1
      fly: false
      nick: false
      size: false
      rgb-name: false
    comet:
      display: "Comet"
      blurb:
        - "The first step up, and the one that pays"
        - "for itself while you are away from the keyboard."
      colors: ["#81D4FA", "#0288D1"]
      tag: "★"
      letter: "C"
      icon: FIREWORK_ROCKET
      price-credits: 1200
      multiplier: 1.1
      keyall-crate: vote
      keyall-amount: 1
      vault-pages: 3
      fly: false
      nick: false
      size: false
      rgb-name: false
    nova:
      display: "Nova"
      blurb:
        - "Fly over your farm, wear whatever name you"
        - "like, and roll with a quarter more of everything."
      colors: ["#FFE082", "#FF8F00"]
      tag: "✦"
      letter: "N"
      icon: BLAZE_POWDER
      price-credits: 3200
      multiplier: 1.25
      keyall-crate: nebula
      keyall-amount: 1
      vault-pages: 5
      fly: true
      nick: true
      size: false
      rgb-name: false
    supernova:
      display: "Supernova"
      blurb:
        - "The top of the ladder. The biggest aura"
        - "on the server, and a name that drifts to match."
      colors: ["#E1BEE7", "#7C4DFF", "#40C4FF"]
      tag: "⚡"
      letter: "S"
      icon: NETHER_STAR
      price-credits: 7000
      multiplier: 1.5
      keyall-crate: nebula
      keyall-amount: 3
      vault-pages: 8
      fly: true
      nick: true
      size: true
      rgb-name: true
# ---------------------------------------------------------------------
# The tab list (V186)
#
# Names in tab already wear their rank's colours. These are the two
# blocks above and below them, which were empty until now.
#
# Tokens, filled per player: {title} {name} {rank} {luck} {rolls}
# {prestige} {online} {max} {ping}. Colour codes are "&" as everywhere
# else, and a blank string is a blank line.
#
# Switch this off if the TAB plugin is installed: it owns the same two
# blocks and would overwrite these every second.
tab:
  enabled: true
  refresh-ticks: 40
  title: "SPACERNG"
  header:
    - ""
    - "{title}"
    - "&8{online}&7/&8{max} online"
    - ""
  footer:
    - ""
    - "&7Rank &r{rank}   &8|&r   &7Luck &f{luck}   &8|&r   &7Rolls &f{rolls}"
    - "&8spacerng.minehut.gg"
    - ""

# The line in chat when somebody joins or leaves.
#
# {name} is the whole name as it reads everywhere else: the rank badge,
# the name in its own colours, and the cosmetic title behind it. {plain}
# is just the account name. Leave one empty for no line at all, which is
# what a busy server usually wants for joins.
#
# The skin face banner a brand new player gets is a different thing and
# lives under welcome:.
join:
  message: "&8[&a+&8] {name}"
  quit-message: "&8[&c-&8] {name}"

# ---------------------------------------------------------------------
# Cosmetics (/cosmetics)
#
# Things a player wears that change nothing. That is the point: a rank
# can sell them without selling an advantage, which the multipliers are
# not. Deliberately NOT the rarity tag from /index, which is a drop you
# equip and does carry Luck.
#
# TITLES are words in front of a name, in chat and in tab. They are given
# out, never bought:
#   /rngadmin cosmetic give <title> [player]
#   /rngadmin cosmetic take <title> [player]
# auto-grant hands one to everybody who logs in while it is on. Switch it
# off when beta ends and the people who have it keep it, which is the
# whole reason Beta works this way.
#
# NAME COLOURS are the gradient a name is painted in. Only a rank with
# rgb-name may pick one, which today is Supernova. Nothing picked is the
# drifting rainbow that rank always had.
cosmetics:
  titles:
    beta:
      display: "Beta"
      # Terminal green: dark phosphor into matrix green into neon. Four
      # letters over three stops, so it reads as a glow running left to
      # right rather than as one flat colour.
      colors: ["#008F11", "#00FF41", "#39FF14"]
      description: "Here before the doors opened."
      auto-grant: true
  name-colours:
    ember:
      display: "Ember"
      colors: ["#FFE082", "#FF8F00", "#E53935"]
    frost:
      display: "Frost"
      colors: ["#E0F7FA", "#4FC3F7", "#1565C0"]
    orchid:
      display: "Orchid"
      colors: ["#F6D6FF", "#C77DFF", "#7C4DFF"]
    venom:
      display: "Venom"
      colors: ["#D4FF6B", "#76FF03", "#1B5E20"]
    dusk:
      display: "Dusk"
      colors: ["#FFAB91", "#AB47BC", "#283593"]
    gold:
      display: "Gold"
      colors: ["#FFF59D", "#FFC107", "#FF6F00"]

# Rolls of this rarity or higher get broadcast to the whole server.
broadcast:
  min-rarity-to-broadcast: EPIC

# Server First 10. The first players to roll a tracked rarity each take a
# numbered spot, and the whole server is told: a banner in chat, a toast,
# the rarity's colour drifting down around every online player and a
# pillar over spawn. A player can hold one spot per rarity, and admin
# rolls never take one. Spots are kept in firsts.yml.
#   /rngadmin firsts list | reset <rarity|all> | preview <rarity>
#   placeholders: %solrng_first10% and %solrng_first10_count%
# Not a structural section, so tuning here survives a jar update.
first-ten:
  enabled: true
  slots: 5
  rarities: [LEGENDARY, MYTHICAL, DIVINE]

# Worn auras. A player wearing a /tag of Epic or rarer wears the aura set
# here for that rarity: a concept, and an optional particle accent drawn
# on top. Try any combination first with
#   /rngadmin auratest <concept> [rarity] [accent]
# Concepts: orbit, runes, halo, helix, galaxy, ripple, atom, celestial,
# seraph, nebula, cosmos, or none. Accents: none, sparkle, embers, trails,
# enchant, all. Auras step aside within farm-pause-radius blocks of a farm
# plot, and every player can hide them in /options. Not a structural
# section, so tuning here survives a jar update.
auras:
  enabled: true
  farm-pause-radius: 10
  # Auras are a Linked perk: no Discord link, no aura.
  require-linked: true
  # The shiny look of a rarity, unlocked by rolling a shiny of it and worn
  # from /aura. Leave a concept out to have no shiny look for that rarity.
  shiny:
    EPIC:
      concept: prism
      accent: sparkle
    LEGENDARY:
      concept: pyre
      accent: embers
    MYTHICAL:
      concept: rift
      accent: enchant
    DIVINE:
      concept: empyrean
      accent: all
  # How far a rank grows the aura it wears. This is the one thing a rank
  # changes about it: same look, same piece count, same cost, drawn bigger.
  # A cosmetic that scales with what you paid is the least harmful thing a
  # server can sell, which is the whole point of putting it here rather
  # than into another Luck multiplier.
  #
  # Nova is the middle, so it wears exactly what every aura looked like
  # before V184. default covers anybody with no rank at all.
  rank-scale:
    default: 0.70
    linked: 0.70
    comet: 0.85
    nova: 1.0
    supernova: 1.30
  # The heavy looks (singularity, titan, supernova, rift, empyrean) cost
  # about a hundred updates a second for each player watching. Only
  # max-nearby of them run within radius blocks of each other; whoever put
  # one on later wears the fallback look until there is room again.
  heavy:
    max-nearby: 1
    radius: 32
    fallback: ascend
  # What a tag of each rarity wears. The four below are the signature
  # looks: rings, flames and columns painted in the rarity's own colour
  # rather than star glyphs round a sea lantern. /rngadmin auratest list
  # shows every look there is, and any of them can be named here.
  tag:
    EPIC:
      concept: sigil
      accent: none
    LEGENDARY:
      concept: ember
      accent: embers
    MYTHICAL:
      concept: eclipse
      accent: trails
    DIVINE:
      concept: ascend
      accent: all

# =====================================================================
# Bosses
#
# A boss is a server event, not a mob, and everybody fights their own
# copy of it. One appears for the whole server, and from that moment
# every player has the same job: take its health down inside the window.
# Health is counted in CROPS, so 8000 health is 8000 crops, whatever
# your hoe pays for them, and a landed roll is worth its rarity below.
#
# Per player rather than shared on purpose: with one health pool the
# best farmer ends the event before anybody else has started, and the
# rest are watching a bar. This way nobody can spoil it for the others.
#
# Beat yours in time and you pull from the boss's reward table, which is
# written exactly like a crate's and paid out by the same code. Miss the
# window and you get nothing.
#
# The process that spawns them is started once with
# /rngadmin boss process start and remembered in boss.yml, so it keeps
# running across a jar update.
# =====================================================================
boss:

  enabled: true
  # Minutes between bosses, counted from the moment one starts.
  every-minutes: 120
  # The timer waits rather than burning a boss on an empty server.
  min-players: 1
  # Health taken off by one harvested crop.
  damage-per-crop: 1
  # Tell the server when somebody beats theirs.
  announce-kills: true

  # A boss can turn up on its own off the back of one crop or one roll.
  # Both chances are per event and both are tiny, and the cooldown is the
  # real safety net: without it a per-crop chance means a boss every few
  # minutes for whoever happens to be farming, and the event stops being
  # an event. Zero on both keeps the timed spawn and nothing else.
  natural:
    # Written as one in N rather than as a decimal on purpose. A per crop
    # chance small enough to be sane is 0.000004, and SnakeYAML writes
    # that back out as 4.0E-6, which getDouble then reads as a String and
    # silently answers with the default. Integers cannot go wrong that
    # way, and "one in 250,000 crops" is the number Leon actually wants
    # to think in. Zero on either turns that trigger off.
    harvest-one-in: 250000
    roll-one-in: 2500
    cooldown-minutes: 45
  # What one landed roll is worth, in crops.
  roll-damage:
    COMMON: 5
    UNCOMMON: 10
    RARE: 25
    EPIC: 100
    LEGENDARY: 400
    MYTHICAL: 1000
    DIVINE: 2500
  types:
    comet_hound:
      display: "Comet Hound"
      colors: ["#7DD3FC", "#38BDF8"]
      icon: PRISMARINE_SHARD
      health: 4000
      duration-minutes: 8
      weight: 50
      # Which crate the box is, and how many of them beating it pays.
      box: boss
      boxes: 1
    void_colossus:
      display: "Void Colossus"
      colors: ["#C77DFF", "#7C3AED"]
      icon: CRYING_OBSIDIAN
      health: 8000
      duration-minutes: 10
      weight: 35
      box: boss
      boxes: 2
    solar_wyrm:
      display: "Solar Wyrm"
      colors: ["#FFD54F", "#FF8F00"]
      icon: MAGMA_BLOCK
      health: 15000
      duration-minutes: 15
      weight: 15
      box: boss
      boxes: 3

# =====================================================================
# Pets
#
# A pet is a relic that rides in one of the three aura slots and pays a
# percentage on one stat. One stat each on purpose: a pet that gives a
# bit of everything cannot be compared against the next one, and picking
# three should be a choice.
#
# Three slots because that is the look budget. They sit at 120 degrees
# around the hips, so a player can never be surrounded by a pile of them
# and they cost about what one more aura costs.
#
# How a pet is earned is NOT decided yet. Until it is, hand them out with
# /rngadmin pet give <pet|all> [player] and /pets shows the rest locked.
#
# stat is one of LUCK, SPEED, MONEY, COINS, ENCHANT, SHINY.
# percent is a fraction: 0.05 is +5%, and it reads in /stats as 1.05x.
# =====================================================================
pets:
  enabled: true

  # How many pets a player wears before the skill tree opens more. The
  # ceiling is three whatever this says, because three is the aura's look
  # budget and a fourth orbiting piece is a frame cost on everybody who
  # can see the player, not just on the owner.
  base-slots: 1

  dust:
    # The action bar line when a dust falls. Rolling is fast and dust is
    # rare, so it is a quiet line rather than a title in the way of the
    # roll it landed on.
    announce: true

  # What rarity and tier do to a pet, what they cost, and how likely a
  # tier is to take. A fresh pet is rarity 1 tier 1 and gives exactly the
  # percent in pets.types below, so these only ever add on top.
  upgrades:
    max-rarity: 10
    max-tier: 10

    # One step, as a fraction of the base percent. A rarity 10 tier 10
    # shiny pet lands on 3.25 x 2.35 x 1.10, which is why the cap exists.
    rarity-step: 0.25
    tier-step: 0.15
    shiny-bonus: 0.10

    # The ceiling on rarity, tier and shiny together. A Starheart at 15%
    # Luck cannot pay more than 90% however long it is fed.
    max-multiplier: 6.0

    # Cosmic Dust, out of rolling.
    make-cost: 10
    rarity-base-cost: 8
    rarity-cost-growth: 1.35
    shiny-cost: 50

    # Farm Dust, out of harvesting.
    tier-base-cost: 25
    tier-cost-growth: 1.40

    # A tier attempt spends the dust whether or not it takes. The chance
    # falls off as the tier climbs and the Steady Hands skill adds back
    # onto it, but it never drops below tier-min-chance.
    tier-base-chance: 0.80
    tier-chance-falloff: 0.06
    tier-min-chance: 0.15

  # Which pet the forge makes. Weight is relative, so a weight of 8
  # against a weight of 1 turns up eight times as often. Pets already at
  # max rarity drop out of the draw.
  types:
    dust_mote:
      display: "Dust Mote"
      colors: ["#B0BEC5", "#78909C"]
      icon: PRISMARINE_CRYSTALS
      rarity: COMMON
      stat: COINS
      percent: 0.02
      weight: 10.0
      blurb: "A speck of the old nebula."
    cinder_spark:
      display: "Cinder Spark"
      colors: ["#FFAB91", "#FF7043"]
      icon: FIRE_CHARGE
      rarity: COMMON
      stat: MONEY
      percent: 0.02
      weight: 10.0
      blurb: "Still warm from something that burned out."
    glass_shard:
      display: "Glass Shard"
      colors: ["#CE93D8", "#AB47BC"]
      icon: AMETHYST_SHARD
      rarity: UNCOMMON
      stat: LUCK
      percent: 0.03
      weight: 7.0
      blurb: "Cut from a sky that cracked."
    tide_pearl:
      display: "Tide Pearl"
      colors: ["#80DEEA", "#00ACC1"]
      icon: HEART_OF_THE_SEA
      rarity: RARE
      stat: COINS
      percent: 0.05
      weight: 4.0
      blurb: "It pulls at whatever it is near."
    watcher_eye:
