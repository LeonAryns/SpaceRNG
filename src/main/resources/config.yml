# ---------------------------------------------------------------------
# The Secret Realm (V229)
#
# A place that opens on its own at a random time, stays open for a few
# minutes, and only lets in players at min-prestige or higher. /realm
# takes them there and back; everybody inside goes home when it closes.
# Every roll made inside has a 1 in find-one-in chance of a secret. A
# secret goes into /secretindex, and each one found is luck-per-secret
# of permanent Luck (0.02 is +2%).
#
#   /rngadmin realm here      stand where players should arrive
#   /rngadmin realm open      open it now, to test
#   /rngadmin realm close     close it now
#   /rngadmin realm status    where it is and when it opens next
#
# The spot and the next opening live in realm.yml.
secret-realm:
  enabled: true
  # V291: secrets as the index Luck. On, the secret picked in /secretindex
  # replaces the equipped drop's Tag Luck and gives its multiplier below;
  # off, Tag Luck works as before and each secret found adds
  # luck-per-secret.
  #
  # V312: on, Leon's call. The equipped drop is cosmetic from here and the
  # Luck lives in /secretindex. Worth knowing: while the realm itself is
  # closed nobody can find a secret, so Tag Luck is simply gone until it
  # opens. Leon asked for the change and said he keeps the realm off for
  # now, so that is deliberate rather than a bug.
  secret-luck: true
  # V291: fifteen minutes open, two hours apart at least.
  # V343: no prestige wall, Leon's call ("make secret realm not behind
  # prestige wall"). Everybody can walk in, which is also why Luck and
  # Speed are flat in there since V341: a fresh account and a maxed one
  # have the same shot at a secret. Raise this to gate it again; it is
  # printed on the Index Mode block in /index and in the opening message.
  min-prestige: 0
  # V338, Leon's numbers: open for 20 minutes, around every 3 hours. The
  # gap is still random inside the two, so nobody can set an alarm for it.
  open-seconds: 1200
  min-gap-minutes: 165
  max-gap-minutes: 195
  find-one-in: 40
  luck-per-secret: 0.02
  # How far from the spot still counts as inside.
  radius: 64
  # weight is how often a find is this secret against the others.
  secrets:
    quiet_comet:
      display: "The Quiet Comet"
      colors: ["#E1F5FE", "#4FC3F7"]
