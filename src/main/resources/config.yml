holograms:
  view-range: 1.0
  title-scale: 2.4
  text-scale: 1.1
  # How far above the admin's feet a panel starts, clear of an NPC's head.
  panel-height: 2.3
  board-refresh-seconds: 60
  crate-head-scale: 2.6
  # How far the head floats above the crate block, how fast it turns and
  # how far it bobs.
  crate-head-lift: 0.15
  crate-spin-degrees: 90
  crate-bob: 0.12
  # The podium from /rngadmin holo leader: how big the three heads are,
  # how big its text is, and how far #2 and #3 stand from #1. The podium
  # has its own text size because it is read from across the spawn
  # rather than from in front of an NPC. The spacing is a minimum: the
  # plugin widens it on its own until the name tags cannot overlap.
  podium-head-scale: 6.0
  podium-text-scale: 3.2
  podium-spacing: 6.5
  click: "<#FFD54F>→→→</#FFD54F> <white>Click Here</white> <#FFD54F>←←←</#FFD54F>"
  panels:
    prestige:
      title: "<gradient:#FFE082:#FFB300><b>PRESTIGE</b></gradient>"
      lines:
        - "<white>Spend your money and levels"
        - "<white>on prestiges for <#FFD54F>multipliers</#FFD54F>"
    skilltree:
      title: "<gradient:#E1BEE7:#AB47BC><b>SKILL TREE</b></gradient>"
      lines:
        - "<white>Unlock <#CE93D8>Auto Roll</#CE93D8>, Luck, Speed"
        - "<white>and everything after it"
    shop:
      title: "<gradient:#FFE0B2:#FF9800><b>SHOPS</b></gradient>"
      lines:
        - "<white>Armor, Starforges, potions"
        - "<white>and the <#FFD54F>Store</#FFD54F>"
    farm:
      title: "<gradient:#DCEDC8:#8BC34A><b>FARMING</b></gradient>"
      lines:
        - "<white>Harvest crops for <#FFD54F>Coins</#FFD54F>"
        - "<white>and climb the <#AED581>farm tree</#AED581>"
      # Any panel can take these two. scale multiplies its size; an empty
      # click hides the "Click Here" line.
      scale: 2.0
      click: ""
    crates:
      title: "<gradient:#B3E5FC:#29B6F6><b>CRATES</b></gradient>"
      lines:
        - "<white>Open <#FFD54F>crates</#FFD54F> for amazing"
        - "<white>and unique rewards"
    armor:
      title: "<gradient:#B2EBF2:#00ACC1><b>ARMOR</b></gradient>"
      lines:
        - "<white>Buy armor with your drops"
        - "<white>for <#80DEEA>Luck</#80DEEA> and <#FFF59D>Speed</#FFF59D> while worn"
    starforge:
      title: "<gradient:#F3E5F5:#BA68C8><b>STARFORGE</b></gradient>"
      lines:
        - "<white>Forge a better Starforge"
        - "<white>for more <#CE93D8>base Luck</#CE93D8> on every roll"
    potion:
      title: "<gradient:#E1BEE7:#8E24AA><b>BREWING</b></gradient>"
      lines:
        - "<white>Brew potions of <#80DEEA>Luck</#80DEEA> and <#FFF59D>Speed</#FFF59D>"
        - "<white>from your own drops"
    convert:
      title: "<gradient:#C8E6C9:#43A047><b>CONVERT</b></gradient>"
      lines:
        - "<white>Turn loose drops into stored ones"
        - "<white>you can <#A5D6A7>spend anywhere</#A5D6A7>"
    pass:
      title: "<gradient:#FFECB3:#FFA000><b>BATTLE PASS</b></gradient>"
      lines:
        - "<white>A season of rewards earned"
        - "<white>by <#FFD54F>rolling</#FFD54F> and <#AED581>farming</#AED581>"
    store:
      title: "<gradient:#F8BBD0:#EC407A:#AB47BC><b>STORE</b></gradient>"
      lines:
        - "<white>Spend <#F48FB1>Credits</#F48FB1> on a global"
        - "<white>Luck boost or the premium pass"
    novacore:
      title: "<gradient:#FCE4EC:#F06292:#BA68C8><b>NOVA CORE</b></gradient>"
      lines:
        - "<white>Forge <#F48FB1>Nova Cores</#F48FB1> to climb 20 tiers"
        - "<white>Every tier multiplies <#81C784>Luck</#81C784>, <#81C784>Money</#81C784> and <#FFD54F>Coins</#FFD54F>"
        - "<white>More Luck means better odds per forge"
    perks:
      title: "<gradient:#D1C4E9:#7E57C2><b>PERKS</b></gradient>"
      lines:
        - "<white>Roll a perk with <#B39DDB>Perk Tickets</#B39DDB>"
        - "<white>and chase the <#B39DDB>Universe</#B39DDB> perk"
    index:
      title: "<gradient:#B2EBF2:#26C6DA><b>INDEX</b></gradient>"
      lines:
        - "<white>Every drop you've found"
        - "<white>Equip a tag for <#80DEEA>Tag Luck</#80DEEA>"
    farmtree:
      title: "<gradient:#DCEDC8:#7CB342><b>FARM TREE</b></gradient>"
      lines:
        - "<white>New crops, hoe <#AED581>enchants</#AED581>"
        - "<white>and more <#FFD54F>Coins</#FFD54F> per harvest"
    daily:
      title: "<gradient:#FFF9C4:#FBC02D><b>DAILY REWARD</b></gradient>"
      lines:
        - "<white>Claim a reward every day"
        - "<white>and keep your <#FFD54F>streak</#FFD54F> going"
    leaderboards:
      title: "<gradient:#FFE082:#FFB300><b>LEADERBOARDS</b></gradient>"
      lines:
        - "<white>See where you stand"
        - "<white>on every board at once"
    stash:
      title: "<gradient:#FFE0B2:#FB8C00><b>STASH</b></gradient>"
      lines:
        - "<white>Items that didn't fit"
        - "<white>in your inventory wait here"
    # The welcome at spawn (V164). Place it with /rngadmin holo panel welcome.
    welcome:
      title: "<gradient:#F6D6FF:#C77DFF:#A855F7><b>WELCOME TO SPACERNG</b></gradient>"
      lines:
        - "<white>Right-click your <#E879F9>Roll</#E879F9> item to start"
        - "<white>Type <#E879F9>/guide</#E879F9> if you are new here"
        - "<white>Roll, farm and climb the <#CE93D8>skill tree</#CE93D8>"
        - "<#C77DFF>SpaceRNG.Minehut.gg"
      click: ""
  # Optional per board: title, color and unit. Boards: index, shiny, rolls,
  # coins, money, farming_total, farming, prestige.
  boards:
    prestige:
      color: "#CE93D8"
    money:
      color: "#A5D6A7"
    coins:
      color: "#FFD54F"

# Floating heads on a leaderboard. Place them in game:
#   /rngadmin tophead podium farming_total   (#1, #2, #3 around you)
#   /rngadmin tophead set farming_total 1    (one rank, at your eyes)
# Spots live in topheads.yml. The heads are never saved into the world, so
# removing the plugin can never leave any behind.
top-heads:
  refresh-seconds: 30
  spin-degrees-per-second: 90
  bob-height: 0.12
  # 1.5 is roughly a real head's size and a half.
  scale: 1.5
  # How far under the head the name and score float.
  label-drop: 1.0
  show-label: true
  # Two small sparks orbiting whoever is #1.
  sparkle-first: true
  # 1.0 is vanilla render distance for display entities.
  view-range: 1.0

consumables:

  # The Global Boss Respawn. Bought, then right clicked, and everybody
  # online gets their own copy of the boss to fight. It is the one
  # consumable whose effect lands on people who did not buy it, which is
  # the whole point of selling it. Using one while a boss is already out
  # gives the item back rather than burning it.
  boss_summoner:
    display: "Boss Summoner"
    material: DRAGON_BREATH
    colors: ["#FF8A80", "#D50000"]
    boss-summons: 1
    description: "Calls a boss for the whole server, right now."
  # ---- Draughts ----
  # Additive Luck and Speed, counted down in ROLLS rather than minutes.
  # `luck: 0.5` is +50% flat, joining the same pile the skill tree and
  # armor feed; `speed: 10` is +10 on the 100 scale. Both can go negative,
  # and the ones that do are the interesting ones: the trade IS the item.
  #
  # Only one draught runs at a time. A second replaces the first, so a
  # minus column can't be dodged by drinking something else on top of it.
  draught_steady:
    display: "Steady Draught"
    material: POTION
    colors: ["#B9F6CA", "#00C853"]
    luck: 0.50
    speed: 10
    rolls: 100
    description: "The long-haul option. Nothing spectacular, nothing lost."
    costs:
      UNCOMMON: 30
      RARE: 6
  draught_swift:
    display: "Swift Draught"
    material: POTION
    colors: ["#FFF59D", "#FFB300"]
    luck: 0.10
    speed: 50
    rolls: 60
    description: "Half again as many rolls an hour. Barely luckier."
    costs:
      UNCOMMON: 45
      RARE: 8
  draught_deep:
    display: "Deep Draught"
    material: POTION
    colors: ["#B39DDB", "#5E35B1"]
    luck: 1.00
    speed: -10
    rolls: 50
    description: "Slower, and much luckier for it."
    costs:
      RARE: 14
      EPIC: 2
  draught_surge:
    display: "Surge Draught"
    material: POTION
    colors: ["#FF8A80", "#D50000"]
    luck: 2.50
    speed: -25
    rolls: 10
    description: "Ten rolls that matter. You will feel every second of them."
    costs:
      RARE: 20
      EPIC: 5
  draught_greater:
    display: "Greater Draught"
    material: POTION
    colors: ["#A7FFEB", "#00BFA5", "#1DE9B6"]
    luck: 1.50
    speed: 25
    rolls: 25
    description: "No downside, and priced like it."
    costs:
      EPIC: 10
      LEGENDARY: 2

  # ---- Farm boosts ----
  # These stay on a clock, because a farm run isn't measured in rolls.
  coin_potion:
    display: "Coin Potion"
    material: POTION
    colors: ["#FFE082", "#FF8F00"]
    coin-multiplier: 2.0
    duration-seconds: 1800
    description: "Every crop pays double."
    costs:
      UNCOMMON: 30
      RARE: 6
  enchant_potion:
    display: "Enchant Potion"
    material: POTION
    colors: ["#E1BEE7", "#8E24AA"]
    enchant-multiplier: 1.5
    duration-seconds: 1800
    description: "Every hoe enchant fires half again as often."
    costs:
      RARE: 15
      EPIC: 2

  # ---- Milestone rewards ----
  # Plainly named on purpose. A milestone tells you what you're getting
  # before you've ever opened /potion, so "Luck Potion" has to mean what
  # it says. The shop's own draughts get the interesting names, because
  # by the time you're buying one you already know what a draught is.
  luck_potion:
    display: "Luck Potion"
    material: POTION
    colors: ["#B39DDB", "#5E35B1"]
    luck: 1.00
    rolls: 50
    description: "+100% Luck for your next 50 rolls."
  speed_potion:
    display: "Speed Potion"
    material: POTION
    colors: ["#FFF59D", "#FFB300"]
    speed: 50
    rolls: 60
    description: "+50% Speed for your next 60 rolls."

  # ---- Charges and grants ----
  roll_10x:
    display: "10x Roll"
    material: NETHER_STAR
    colors: ["#FFF9C4", "#FFD54F", "#FF8F00"]
    roll-luck-multiplier: 10.0
    charges: 1
    description: "Banks one roll at ten times your Luck."
    costs:
      EPIC: 8
      LEGENDARY: 2
  roll_100x:
    display: "100x Roll"
    material: NETHER_STAR
    colors: ["#B9F6CA", "#69F0AE", "#00B0FF"]
    roll-luck-multiplier: 100.0
    charges: 1
    description: "Banks one roll at a hundred times your Luck."
    costs:
      LEGENDARY: 8
      MYTHICAL: 2
  crate_key:
    display: "Farm Key"
    material: TRIPWIRE_HOOK
    colors: ["#FFE082", "#FF8F00"]
    description: "Opens the Farm Crate. Right click the crate with it."
  cosmic_key:
    display: "Cosmic Key"
    material: TRIPWIRE_HOOK
    colors: ["#E1BEE7", "#7C4DFF", "#40C4FF"]
    description: "Opens the Cosmic Crate. Right click the crate with it."
  vote_key:
    display: "Vote Key"
    material: TRIPWIRE_HOOK
    colors: ["#B9F6CA", "#00C853"]
    description: "Opens the Vote Crate. Right click the crate with it."
  nebula_key:
    display: "Nebula Key"
    material: TRIPWIRE_HOOK
    colors: ["#80D8FF", "#448AFF", "#B388FF"]
    description: "Opens the Nebula Crate. Right click the crate with it."
  boss_box:
    display: "Boss Box"
    material: ENDER_CHEST
    colors: ["#FF8A80", "#FF5252", "#D50000"]
    description: "Won by beating a boss. Right click it to open it."
  nova_core:
    display: "Nova Core"
    material: ENDER_PEARL
    colors: ["#7FE7FF", "#00B0FF"]
    description: "Forge it in /novacore for a shot at the next tier.\nEvery tier multiplies your Luck, Money and Coins.\nMiss and you fall back to your last checkpoint.\nThe more Luck you have, the better your odds."
  free_skill:
    display: "Skilltree Unlock Voucher"
    material: KNOWLEDGE_BOOK
    colors: ["#E1BEE7", "#8E24AA"]
    free-skills: 1
    description: "Unlocks one skill in /skilltree for free, whatever it costs."
  luck_50:
    display: "Permanent Luck +50%"
    material: RABBIT_FOOT
    colors: ["#B9F6CA", "#00C853"]
    permanent-luck: 0.5
    description: "A permanent 50% Luck. It never runs out."
  luck_250:
    display: "Permanent Luck +250%"
    material: RABBIT_FOOT
    colors: ["#FFF59D", "#00E676", "#00B0FF"]
    permanent-luck: 2.5
    description: "A permanent 250% Luck. It never runs out."

# ============================================
# Farming skill tree (/farmtree)
# ============================================
# A crop, six skills beside it, its yield, then the next crop.
#
# The general tree can afford three parallel lines because its skills
# have no order. The farm's do: wheat before carrots before nether wart,
# and a crop's yield skill is worthless before the crop. So the middle
# column IS the route, and every crop on it opens a row of six optional
# skills - three each side, getting better the further out they sit.
#
# The rows between crops carry nothing on purpose. Half the silhouette
# stays "???" the whole way up, which is what makes the tree look like
# somewhere to explore rather than a list you've already read.
#
# New enchants sit at the ends of the branches, where finding one is a
# reward for going out of your way. Coin Greed is the exception: it's
# the enchant you want on day one, so it sits right next to the wheat.
#
# Paid in Coins. The farm owns Coins and Gems outright.
#
# Families worth knowing:
#   CROP_YIELD    more Coins and Gems from ONE crop (target)
#   ENCHANT_PROC  raises every hoe enchant's chance at once
#   ENCHANT_CAP   raises the level ceiling on every hoe enchant, from
#                 the base-cap of 100 toward the hard 1000
#   HOE_TIER      walks the hoe itself up farming.hoe-tiers


farmtree:
  # Three pages on the same 24 slot frame as /skilltree. On every page:
  #   middle line  the page's first crop at the root, its yield, Golden
  #                Harvest, Growth, then the page's second crop at row 2
  #                and what hangs off it
  #   left line    the hoe: three enchants for the first crop, a tool
  #                upgrade, three enchants for the second crop, and one
  #                more off the side
  #   right line   the harvest: Coins, Gems, Growth and Proc Chance
  #
  # The second crop also needs the third enchant and the first Gems node
  # (requires-all), so a new crop means climbing half the page on all
  # three lines, not two clicks up the middle.
  #
  # Prices follow depth from the page's root: base x 1.62^depth. Enchant
  # unlocks cost 8x a skill at the same depth, because each one opens a
  # Coin sink on the hoe; the second crop costs 3x. Each page's base is 30x
  # the last: 4,000, then 120,000, then 3,600,000.
  #
  # The Speed enchant is gone at Leon's request; Growth V and VI carry
  # regrow speed instead.
  reserved: []
  pages: 4
  page-names: ["Cultivation", "Abundance", "Uncharted", "Cosmic Soil"]
  nodes:

    # ====================================================================
    #  PAGE 1 - CULTIVATION: Wheat and Carrots
    # ====================================================================

    # -- Middle line --
    crop_wheat:
      display: "Wheat Field"
      page: 1
      slot: "5,6"
      icon: "WHEAT"
      cost-money: 4000
      requires: ""
      effect: "UNLOCK_CROP"
      value: 0
      target: "WHEAT"

    yield_wheat:
      display: "Wheat Yield"
      page: 1
      slot: "5,5"
      icon: "COMPOSTER"
      cost-money: 6500
      cost-growth: 1.25
      requires: "crop_wheat"
      effect: "CROP_YIELD"
      value: 0.1
      max-level: 10
      target: "WHEAT"

    golden_crop:
      display: "Golden Harvest I"
      page: 1
      slot: "5,4"
      icon: "GOLD_NUGGET"
      cost-money: 10500
      cost-growth: 1.55
      requires: "yield_wheat"
      effect: "GOLDEN_CROP"
      value: 2
      max-level: 10

    growth_1:
