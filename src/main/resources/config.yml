# ============================================
# SolRNG configuration
# ============================================

# The sidebar's fixed text. Colour codes use "&".
scoreboard:
  title: "&5&l\u2726 SPACERNG \u2726"
  season: "SEASON I"
  footer: "SPACERNG.MINEHUT.GG"

roll-item:
  material: NETHER_STAR
  # No cooldown anymore — every roll takes this many seconds to resolve,
  # with an animation/progress bar while it's rolling. The Speed skill
  # tree branch and worn armor shorten this via the player's Speed stat.
  roll-duration-seconds: 5

# The Starforge — right-click to roll, left-click to toggle Auto Roll
# (once the Auto Roll skill is unlocked). Everyone starts on BASIC;
# better ones are bought in /starforge and give a bigger base Luck.
# luck-bonus 0.25 = 25% Luck. This is a player's BASE luck — the skill
# tree and armor add to it, and the index multiplier scales the total.
# "colors" is the same per-character gradient engine the Epic+ item names
# use: one entry = flat color, 2+ = a gradient across the name. Accepts
# "#RRGGBB" hex or "&6"-style legacy codes, plus bold/underline/
# strikethrough flags.
starforge:
  tiers:
    BASIC:
      display: "Basic Starforge"
      colors: ["#9AA0A6", "#D8DEE4"]
      luck-bonus: 0.25
      costs: {}
    INTERMEDIATE:
      display: "Intermediate Starforge"
      colors: ["#2FBF4F", "#A6F26B"]
      luck-bonus: 0.50
      costs:
        COMMON: 75
        UNCOMMON: 25
        RARE: 5
    ADVANCED:
      display: "Advanced Starforge"
      colors: ["#1FB6E8", "#5B8CFF"]
      luck-bonus: 1.00
      costs:
        COMMON: 200
        UNCOMMON: 75
        RARE: 20
        EPIC: 3
    REFINED:
      display: "Refined Starforge"
      colors: ["#8B5CF6", "#E879F9"]
      bold: true
      luck-bonus: 1.75
      costs:
        UNCOMMON: 200
        RARE: 60
        EPIC: 10
    SUPERIOR:
      display: "Superior Starforge"
      colors: ["#FF9F1C", "#FFE066"]
      bold: true
      luck-bonus: 3.00
      costs:
        RARE: 150
        EPIC: 35
        LEGENDARY: 3
    # Masterwork and up are placeholder prices — they're meant to need
    # the rarer drops, so retune these once those feel right in-game.
    MASTERWORK:
      display: "Masterwork Starforge"
      colors: ["#FF3D3D", "#FF9F1C", "#FFE066"]
      bold: true
      luck-bonus: 5.00
      costs:
        EPIC: 100
        LEGENDARY: 10
    RADIANT:
      display: "Radiant Starforge"
      colors: ["#00E5FF", "#FFFFFF", "#FFD200"]
      bold: true
      luck-bonus: 8.00
      costs:
        EPIC: 250
        LEGENDARY: 30
        MYTHICAL: 2
    CELESTIAL:
      display: "Celestial Starforge"
      colors: ["#7F00FF", "#E100FF", "#00E0FF"]
      bold: true
      luck-bonus: 12.50
      costs:
        LEGENDARY: 100
        MYTHICAL: 10

# The equipped-drop tag shown above a player's head.
#
# manage-nametag: true  - this plugin writes the nametag itself, via
#                         scoreboard team prefixes.
#                 false - hands nametags over to TAB (or any other nametag
#                         plugin) and stops writing teams entirely. Two
#                         plugins both setting team prefixes for the same
#                         player fight each other and TAB's anti-override
#                         wins, so set this to false once TAB is installed
#                         and point TAB at %solrng_tag% instead.
#
# The tag placeholders keep working either way:
#   %solrng_tag%            the nametag text (gradient + Epic+ flair)
#   %solrng_tag_plain%      same colors, no obfuscated flair - use in TAB
#   %solrng_tag_name%       uncolored item name
#   %solrng_tag_odds%       e.g. 1,700
#   %solrng_tag_multiplier% e.g. 1.14
#   %solrng_prestige%       raw number
#   %solrng_prestige_roman% I, II, III...
#   %solrng_prestige_badge% blank at 0, otherwise a star + numeral
#   %solrng_level%          the Lv/prestige badge
#   %solrng_level_number%   raw level
tag:
  manage-nametag: true

# Farm crops (a shared field everyone harvests together) — breaking a
# fully-grown crop listed here pays Tokens on top of its normal drop,
# scaled per-player by their own farmTokenMultiplier, then replants
# straight back to fully-grown after regrow-seconds instead of waiting
# on random tick growth.
farming:
  regrow-seconds: 3
  crops:
    WHEAT:
      tokens: 100
    CARROTS:
      tokens: 100
    POTATOES:
      tokens: 100
    BEETROOTS:
      tokens: 150
    NETHER_WART:
      tokens: 150

  # ---- The shared farm ----
  # Plots are real blocks placed with /rngadmin farmblock. Every player is
  # shown their OWN crop at every plot, so one field serves everybody at
  # once and nobody sees anyone else's harvests.
  #
  # "requires-node" is a skill tree node id. Blank = available from the
  # start. Set one and the crop stays locked until that node is bought, so
  # new crops can hang off new skill nodes later without a code change.
  # Until those nodes exist, /rngadmin crops can grant them for testing.
  #
  # Gems only ever pay once shards-node is unlocked (or granted).
  shards-node: "farming_shards"
  # ---- Hoe enchants ----
  # An enchant is switched on by an UNLOCK_ENCHANT node in the farming tree
  # and levelled by ENCHANT_POWER nodes pointing at the same id, so the hoe
  # itself never holds any state — its power is a read of what's been
  # bought. Nothing to lose, trade or duplicate.
  #
  # Levels are BOUGHT with Tokens by right-clicking the hoe; the farming
  # tree only decides which enchants are available at all. base-cost is the
  # first level, multiplied by cost-growth for every level after it.
  #
  # "per-level" means different things per enchant.
  enchants:
    TOKEN_GREED:
      display: "Token Greed"
      icon: GOLD_NUGGET
      base-cost: 25000
      cost-growth: 1.08
      description: "More Tokens from every crop."
      color: "&e"
      max-level: 250
      per-level: 0.02
    SHARD_GREED:
      display: "Gem Greed"
      icon: PRISMARINE_CRYSTALS
      base-cost: 60000
      cost-growth: 1.1
      description: "A chance at a bonus Gem."
      color: "&b"
      max-level: 150
      per-level: 0.002
    FORTUNE:
      display: "Fortune"
      icon: EMERALD
      base-cost: 90000
      cost-growth: 1.12
      description: "A chance to double a whole harvest."
      color: "&6"
      max-level: 100
      per-level: 0.003
    GREEN_THUMB:
      display: "Green Thumb"
      icon: BONE_MEAL
      base-cost: 40000
      cost-growth: 1.1
      description: "Your crops regrow faster."
      color: "&a"
      max-level: 100
      per-level: 0.006
    MOMENTUM:
      display: "Momentum"
      icon: FEATHER
      base-cost: 75000
      cost-growth: 1.09
      description: "The longer you farm without stopping, the more you earn."
      color: "&d"
      max-level: 200
      per-level: 0.001
    BLAST_HARVEST:
      display: "Blast Harvest"
      icon: TNT
      base-cost: 150000
      cost-growth: 1.14
      description: "A chance to blow up the crops around you."
      color: "&c"
      max-level: 80
      per-level: 0.005
    CREDIT_FINDER:
      display: "Credit Finder"
      icon: SUNFLOWER
      base-cost: 2500000
      cost-growth: 1.3
      description: "A tiny chance to turn up a store Credit."
      color: "&5"
      max-level: 25
      per-level: 4e-05
    NOVA_FINDER:
      display: "Nova Finder"
      icon: HEART_OF_THE_SEA
      base-cost: 1500000
      cost-growth: 1.28
      description: "A tiny chance at a free Nova Core forge."
      color: "&3"
      max-level: 25
      per-level: 0.00015

  crop-types:
    WHEAT:
      display: "Wheat"
      material: WHEAT
      tokens: 100
      shards: 0
      requires-node: ""
    CARROTS:
      display: "Carrots"
      material: CARROTS
      tokens: 250
      shards: 1
      requires-node: "farming_carrots"
    POTATOES:
      display: "Potatoes"
      material: POTATOES
      tokens: 600
      shards: 2
      requires-node: "farming_potatoes"
    BEETROOTS:
      display: "Beetroot"
      material: BEETROOTS
      tokens: 1500
      shards: 5
      requires-node: "farming_beetroot"
    NETHER_WART:
      display: "Nether Wart"
      material: NETHER_WART
      tokens: 4000
      shards: 12
      requires-node: "farming_netherwart"

# Levels are earned by rolling; prestiging resets your level for a
# permanent Luck *multiplier* (applied on top of every other Luck source).
prestige:
  # Points awarded per ascend, spent on the upgrades below. Points are the
  # part of prestige the player chooses how to use, which is what makes
  # prestiging a decision rather than a button.
  points-per-prestige: 1
  # Slot is "column,row", 1-indexed, in a 6x9 menu.
  upgrades:
    lucky_star:
      display: "Lucky Star"
      icon: NETHER_STAR
      slot: "3,2"
      effect: LUCK_BONUS
      per-level: 0.02
      unit: "%"
      max-level: 50
      cost-points: 1
    token_master:
      display: "Token Master"
      icon: RAW_GOLD
      slot: "5,2"
      effect: TOKEN_BONUS
      per-level: 0.005
      unit: "%"
      max-level: 60
      cost-points: 1
    gold_rush:
      display: "Gold Rush"
      icon: GOLD_INGOT
      slot: "7,2"
      effect: MONEY_BONUS
      per-level: 0.01
      unit: "%"
      max-level: 50
      cost-points: 1
    shard_seeker:
      display: "Gem Seeker"
      icon: PRISMARINE_CRYSTALS
      slot: "4,4"
      effect: SHARD_BONUS
      per-level: 0.005
      unit: "%"
      max-level: 40
      cost-points: 2
    nova_touch:
      display: "Nova Touch"
      icon: HEART_OF_THE_SEA
      slot: "6,4"
      effect: NOVA_ODDS
      per-level: 0.004
      unit: "%"
      max-level: 25
      cost-points: 3
  rolls-per-level: 50
  first-prestige-levels: 10
  levels-increment-per-prestige: 5
  luck-multiplier-per-prestige: 0.10

# /armor — sets bought with rolled drops. Each worn piece grants its
# tier's Luck bonus and a smaller Speed bonus (speed-bonus 0.01 = +1
# Speed, where 100 Speed is the baseline roll speed).
# /armor - pieces are bought ONE AT A TIME, not as a set. Each cost below
# is the price of a single piece, so a full 4-piece set costs four times
# what's listed. Every piece grants its tier's Luck and Speed while worn,
# independently - mixing tiers across slots is fine and a lone pair of
# boots still pays out.
#
# speed-bonus 0.05 = +5 Speed, where 100 Speed is the baseline roll speed.
armor:
  tiers:
    LEATHER:
      display: "Leather"
      costs:
        COMMON: 10
        UNCOMMON: 1
      luck-bonus: 0.10
      speed-bonus: 0.05
    CHAINMAIL:
      display: "Chainmail"
      costs:
        COMMON: 25
        UNCOMMON: 5
      luck-bonus: 0.18
      speed-bonus: 0.08
    IRON:
      display: "Iron"
      costs:
        UNCOMMON: 25
        RARE: 5
      luck-bonus: 0.28
      speed-bonus: 0.12
    GOLD:
      display: "Gold"
      costs:
        UNCOMMON: 50
        RARE: 10
      luck-bonus: 0.42
      speed-bonus: 0.16
    DIAMOND:
      display: "Diamond"
      costs:
        RARE: 25
        EPIC: 5
      luck-bonus: 0.65
      speed-bonus: 0.20
    NETHERITE:
      display: "Netherite"
      costs:
        RARE: 50
        EPIC: 10
      luck-bonus: 1.00
      speed-bonus: 0.25

# Rarity tiers, in ascending order. "luck-factor" controls how strongly
# the Luck stat biases rolls toward this tier. 0 = luck has no effect.
# Effective weight = base weight * (1 + luck * luck-factor)
rarities:
  # Rarities are just a plain label color now — the fancy gradients live
  # on each individual item instead (see the per-item "colors" below).
  # "symbol: true" wraps that rarity's item names in an obfuscated flair
  # character on both sides (Epic and up).
  COMMON:
    colors: ["&7"]
    luck-factor: 0.0
  UNCOMMON:
    colors: ["&a"]
    luck-factor: 0.15
  RARE:
    colors: ["&9"]
    luck-factor: 0.35
  EPIC:
    colors: ["&5"]
    symbol: true
    luck-factor: 0.6
  LEGENDARY:
    colors: ["&6"]
    symbol: true
    luck-factor: 1.0
  MYTHICAL:
    colors: ["&c"]
    symbol: true
    luck-factor: 1.6

