milestones:
  # Credits paid on top of a tier's own reward, by track and the tier's
  # threshold. Credits are what the store sells, so keep these rare.
  credit-rewards:
    # V186, Leon's call: the first Credits on a track are 100, and never
    # on its opening tier, so the first hundred takes a bit of work. The
    # tiers behind each first one were raised only as far as they had to
    # be to keep climbing; the tops are untouched.
    prestige: {10: 100, 25: 150, 50: 250, 100: 350}
    rarity: {100: 100, 120: 150, 130: 200, 140: 250, 144: 400}
    farming: {10000: 100, 100000: 200, 1000000: 500, 10000000: 1200}
