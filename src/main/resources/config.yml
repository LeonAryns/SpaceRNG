# ============================================
# SolRNG configuration
# ============================================

roll-item:
  material: NETHER_STAR
  name: "&d&lRoll"
  # No cooldown anymore — every roll takes this many seconds to resolve,
  # with an animation/progress bar while it's rolling. The Rolling Speed
  # skill tree branch (and future armor upgrades) shorten this via a
  # player's roll-speed multiplier.
  roll-duration-seconds: 5

# Farm crops (a shared field everyone harvests together) — breaking a
# fully-grown crop listed here pays Tokens on top of its normal drop,
# scaled per-player by their own farmTokenMultiplier, then replants
# straight back to fully-grown after regrow-seconds instead of waiting
# on random tick growth.
farming:
  regrow-seconds: 3
  crops:
    WHEAT:
      tokens: 100
    CARROTS:
      tokens: 100
    POTATOES:
      tokens: 100
    BEETROOTS:
      tokens: 150
    NETHER_WART:
      tokens: 150

# Levels are earned by rolling; prestiging resets your level for a
# permanent Luck *multiplier* (applied on top of every other Luck source).
prestige:
  rolls-per-level: 50
  first-prestige-levels: 10
  levels-increment-per-prestige: 5
  luck-multiplier-per-prestige: 0.10

# /armor — sets bought with rolled drops, each granting a flat Luck bonus
# while the FULL set (all 4 pieces) is actually worn.
armor:
  tiers:
    LEATHER:
      display: "Leather Set"
      costs:
        COMMON: 20
      luck-bonus: 0.05
    CHAINMAIL:
      display: "Chainmail Set"
      costs:
        COMMON: 40
        UNCOMMON: 10
      luck-bonus: 0.10
    IRON:
      display: "Iron Set"
      costs:
        UNCOMMON: 15
        RARE: 5
      luck-bonus: 0.20
    GOLD:
      display: "Gold Set"
      costs:
        RARE: 10
        EPIC: 3
      luck-bonus: 0.35
    DIAMOND:
      display: "Diamond Set"
      costs:
        EPIC: 8
        LEGENDARY: 2
      luck-bonus: 0.60
    NETHERITE:
      display: "Netherite Set"
      costs:
        LEGENDARY: 3
        MYTHICAL: 1
      luck-bonus: 1.00

# Rarity tiers, in ascending order. "luck-factor" controls how strongly
# the Luck stat biases rolls toward this tier. 0 = luck has no effect.
# Effective weight = base weight * (1 + luck * luck-factor)
rarities:
  # "colors" takes &-legacy codes or "#RRGGBB" hex. One entry = flat color;
  # two or more = a real per-character gradient across that text.
  COMMON:
    colors: ["&f"]
    luck-factor: 0.0
  UNCOMMON:
    colors: ["#55FF55", "#00AA00"]
    luck-factor: 0.15
  RARE:
    colors: ["#55FFFF", "#5555FF"]
    bold: true
    luck-factor: 0.35
  EPIC:
    colors: ["#FF55FF", "#AA00AA"]
    bold: true
    obfuscated-prefix: true
    luck-factor: 0.6
  LEGENDARY:
    colors: ["&6"]
    underline: true
    luck-factor: 1.0
  MYTHICAL:
    colors: ["&c"]
    strikethrough: true
    luck-factor: 1.6

