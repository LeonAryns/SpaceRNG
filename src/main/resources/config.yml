# Commands the console runs when a gate skill is bought. Left blank the
# skill still unlocks, it just doesn't hand out a permission - which is
# what you want while the matching plugin isn't installed yet.
#
# {player} is replaced with the player's name. The Private Vault skill
# expects a /pv-style plugin to be present; PlayerVaults X (with LuckPerms
# for the permission) is the usual pairing on Paper 1.21.
unlock-commands:
  # V267: empty. /pv is the plugin's own; these only filled staff chat
  # with LuckPerms log lines.
  private-vault: []

shiny:
  # Base 1 in 2,500. Shiny Boost nodes in /skilltree multiply this.
  chance: 0.0004
  node: "shiny_unlock"
  marker: "&b&l✦"
  broadcast: true

# The Discord link (V232, Leon's call): linking pays +100% Luck for as
# long as the account stays linked, and nothing else. No Credits, no
# Coins, no Money. luck-percent 1.00 is +100%.
#
# The broadcast fires once per player ever, so nobody can put it in chat
# on a loop by unlinking and relinking. {player} is who linked, {luck}
# the Luck bonus as a percentage.
linked-account:
  enabled: true
  # When an unlinked player is told about /link, in seconds after joining.
  # The -new list is for somebody's very first join: V339, Leon's call, a
  # new player hears it three times inside their first three minutes,
  # because +100% Luck for free is the biggest step they can take. Either
  # list stops as soon as they link.
  remind-seconds: [30, 240]
  remind-seconds-new: [20, 100, 170]
  bonus:
    money-percent: 0.0
    coins-percent: 0.0
    luck-percent: 1.00
    shiny-percent: 0.0
  first-link-gift:
    credits: 0
    coins: 0
    money: 0
  broadcast:
    enabled: true
    title: "DISCORD"
    subtitle: ""
    lines:
      - "&f{player} &7linked their Discord and now rolls with &a+{luck} Luck&7."
      - "&7Type &e/link &7to do the same."
  link-message: "&a&l✔ Linked to Discord. &7You roll with &a+{luck} Luck &7for as long as you stay linked."
  unlink-message: "&eUnlinked from Discord. &7The &a+{luck} Luck &7is gone until you link again."

# Discord announcements through a webhook. In Discord: Edit Channel,
# Integrations, Webhooks, New Webhook, Copy Webhook URL, then paste it
# below and run /rngadmin reload. Empty turns announcements off. No bot or
# DiscordSRV is needed for this part; DiscordSRV only does chat relay.
discord:
  # What /discord, the tab footer and the chat tips send people to (V248).
  invite: "https://discord.gg/E8V67kjAj"
  webhook-url: ""
  username: "SpaceRNG"
  announce:
    # Drops of these rarities are posted. Shinies are posted at any rarity
    # while shiny is true.
    drop-rarities: [MYTHICAL, DIVINE, ASTRAL]
    shiny: true
    first-ten: true
    farming-payout: true
  # The cards, posted with /rngadmin discord card <id>. Everything here
  # is text, so the wording, the IPs and the vote links change without a
  # new jar. A field's value can be one line or a list of lines.
