      costs:
        RARE: 50
        EPIC: 10
      luck-bonus: 0.60
      speed-bonus: 0.25

# Rarity tiers, in ascending order. "luck-factor" controls how strongly
# the Luck stat biases rolls toward this tier. 0 = luck has no effect.
# Effective weight = base weight * (1 + luck * luck-factor)
rarities:
  # Rarities are just a plain label color now - the fancy gradients live
  # on each individual item instead (see the per-item "colors" below).
  # "symbol: true" wraps that rarity's item names in an obfuscated flair
  # character on both sides (Epic and up).
  #
  # Common, Uncommon and Rare labels are friendly rather than literal: the
  # band as a whole lands on its `share` of all rolls, and the labels only
  # decide which item inside the band wins. Money pays on the label, so a
  # friendly label also keeps the early economy where it was. Epic and up
  # set `true-odds`, and there the number on the item is the real chance.
  #
  # luck-factor: how a rarity's weight moves with Luck. Positive grows it
  # (1 + Luck x factor), negative shrinks it (divides by 1 + Luck x -factor).
  # Common shrinks, so Luck visibly pushes rolls up the table: at 2,500%
  # Luck Commons are about a third of rolls instead of three quarters.
  COMMON:
    colors: ["&f"]
    luck-factor: -0.25
    share: 0.945
  UNCOMMON:
    colors: ["&a"]
    luck-factor: 0.15
    share: 0.050
  RARE:
    colors: ["&9"]
    luck-factor: 0.35
    share: 0.003
  EPIC:
    colors: ["&5"]
    symbol: true
    luck-factor: 0.6
    true-odds: true
  LEGENDARY:
    colors: ["&6"]
    symbol: true
    luck-factor: 1.0
    true-odds: true
  MYTHICAL:
    colors: ["&c"]
    symbol: true
    luck-factor: 1.6
    true-odds: true
  # Divine sits above everything. Its label is the palest thing in the
  # plugin without ever being pure #FFFFFF - a drop name renders beside a
  # player name in the tab list, and white-on-white is unreadable.
  DIVINE:
    colors: ["#FFFDF7", "#FFF0B8", "#FFFFFA", "#DCEFFF", "#FFFDF7"]
    symbol: true
    bold: true
    luck-factor: 2.5
    true-odds: true

