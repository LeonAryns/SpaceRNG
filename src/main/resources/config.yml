      display: "Supernova"
      blurb:
        - "The top of the ladder. The biggest aura"
        - "on the server, and a name that drifts to match."
      colors: ["#E1BEE7", "#7C4DFF", "#40C4FF"]
      tag: "⚡"
      letter: "S"
      icon: NETHER_STAR
      price-credits: 7000
      multiplier: 1.5
      keyall-crate: nebula
      keyall-amount: 3
      vault-pages: 8
      fly: true
      nick: true
      size: true
      rgb-name: true
      # Wears the best tag found so far, and swaps up on its own whenever
      # a better one is found (V227).
      auto-tag: true
    # Two ranks that are never sold (V235). hidden keeps them out of
    # /ranks and /buy; /rngadmin rank set owner|member hands them out.
    # priority puts them on the ladder: Member under everything, so a
    # linked Member shows as Linked, and Owner over everything. bold
    # draws the name in bold.
    member:
      display: "Member"
      hidden: true
      priority: -100
      # V249: every starter wears this now, so a fresh mint instead of grey.
      colors: ["#B9F6CA", "#69F0AE"]
      tag: ""
      letter: "M"
      icon: PAPER
      price-credits: 0
      multiplier: 1.0
      vault-pages: 1
    owner:
      display: "Owner"
      hidden: true
      priority: 10000
      bold: true
      # V298: red only, Leon's call (V243 ran it into a fiery gold).
      colors: ["#FF1744", "#B71C1C"]
      tag: ""
      # V288: the whole word, [Owner], Leon's call.
      letter: "Owner"
      icon: COMMAND_BLOCK
      price-credits: 0
      multiplier: 1.5
      keyall-crate: nebula
      keyall-amount: 3
      vault-pages: 8
      fly: true
      nick: true
      size: true
      rgb-name: false
      auto-tag: true
# ---------------------------------------------------------------------
# The tab list (V186)
#
# Names in tab already wear their rank's colours. These are the two
# blocks above and below them, which were empty until now.
#
# Tokens, filled per player: {title} {name} {rank} {luck} {rolls}
# {prestige} {online} {max} {ping}. Colour codes are "&" as everywhere
# else, and a blank string is a blank line.
#
# "||" splits a line into two columns side by side (V243). Every cell is
# padded to the widest cell of its column in the same block, so a label
# and the value under it stay lined up. column-gap is the spaces between
# the two columns.
#
# Switch this off if the TAB plugin is installed: it owns the same two
# blocks and would overwrite these every second.
tab:
  enabled: true
  refresh-ticks: 40
  title: "SPACERNG"
  column-gap: 16
  header:
    - ""
    - "{title}"
    - "&7ʟᴀᴛᴇɴᴄʏ &b⌚ {ping} || &7ᴏɴʟɪɴᴇ ᴘʟᴀʏᴇʀѕ &a☺ &a{online}"
    - ""
  footer:
    - ""
    - "&7ʏᴏᴜ'ʀᴇ ᴘʟᴀʏɪɴɢ ᴏɴ || &7ᴊᴏɪɴ ᴏᴜʀ ᴅɪѕᴄᴏʀᴅ"
    - "&d&lѕᴘᴀᴄᴇʀɴɢ.ᴍɪɴᴇʜᴜᴛ.ɢɢ || &9&l/ᴅɪѕᴄᴏʀᴅ"
    - ""

# Players can break farm plots and farm crops and nothing else (V251).
# Someone with solrng.admin in creative still builds. /rngadmin protect
# on|off switches it in game.
protection:
  block-break: true

# The line in chat when somebody joins or leaves.
#
# {name} is the whole name as it reads everywhere else: the rank badge,
# the name in its own colours, and the cosmetic title behind it. {plain}
# is just the account name. Leave one empty for no line at all, which is
# what a busy server usually wants for joins.
#
# The skin face banner a brand new player gets is a different thing and
# lives under welcome:.
join:
  message: "&8[&a+&8] {name}"
  quit-message: "&8[&c-&8] {name}"

# ---------------------------------------------------------------------
# Cosmetics (/cosmetics)
#
# Things a player wears that change nothing. That is the point: a rank
# can sell them without selling an advantage, which the multipliers are
# not. Deliberately NOT the rarity tag from /index, which is a drop you
# equip and does carry Luck.
#
# TITLES are words in front of a name, in chat and in tab. They are given
# out, never bought:
#   /rngadmin cosmetic give <title> [player]
#   /rngadmin cosmetic take <title> [player]
# auto-grant hands one to everybody who logs in while it is on. Switch it
# off when beta ends and the people who have it keep it, which is the
# whole reason Beta works this way.
#
# NAME COLOURS are the gradient a name is painted in. Only a rank with
# rgb-name may pick one, which today is Supernova. Nothing picked is the
# drifting rainbow that rank always had.
cosmetics:
  titles:
    beta:
      display: "Beta"
      # Terminal green: dark phosphor into matrix green into neon. Four
      # letters over three stops, so it reads as a glow running left to
      # right rather than as one flat colour.
      colors: ["#008F11", "#00FF41", "#39FF14"]
      description: "Here before the doors opened."
      auto-grant: true
  name-colours:
    ember:
      display: "Ember"
      colors: ["#FFE082", "#FF8F00", "#E53935"]
    frost:
      display: "Frost"
      colors: ["#E0F7FA", "#4FC3F7", "#1565C0"]
    orchid:
      display: "Orchid"
      colors: ["#F6D6FF", "#C77DFF", "#7C4DFF"]
    venom:
      display: "Venom"
      colors: ["#D4FF6B", "#76FF03", "#1B5E20"]
    dusk:
      display: "Dusk"
      colors: ["#FFAB91", "#AB47BC", "#283593"]
    gold:
      display: "Gold"
      colors: ["#FFF59D", "#FFC107", "#FF6F00"]

# Rolls of this rarity or higher get broadcast to the whole server.
broadcast:
  min-rarity-to-broadcast: EPIC
  # A player's first this-many drops of each rarity are announced, then
  # theirs stop (V271), Epic, Legendary, Mythical and Divine alike. A
  # shiny always is. -1 for no limit.
  announce-limit: 3
  # Past that limit one drop still comes through when nothing has been
  # announced for this many seconds (V286).
  quiet-seconds: 60
  # V293: drops are told as a digest every this many seconds, and only the
  # highest tier found in that time (a shiny just above its rarity): one
  # drop, and a count of the others of that tier (V298). 0 announces every
  # drop straight away with the limit above, as before.
  digest-seconds: 300

# Server First 10. The first players to roll a tracked rarity each take a
# numbered spot, and the whole server is told: a banner in chat, a toast,
# the rarity's colour drifting down around every online player and a
# pillar over spawn. A player can hold one spot per rarity, and admin
# rolls never take one. Spots are kept in firsts.yml.
#   /rngadmin firsts list | reset <rarity|all> | preview <rarity>
#   placeholders: %solrng_first10% and %solrng_first10_count%
# Not a structural section, so tuning here survives a jar update.
first-ten:
  # V278: a Shiny First 10 as well, the first players to roll a shiny of
  # any rarity, with its own banner and its card in /firsts.
  shiny: true
  # V300: the shiny list holds ten, like the rarity lists (V279 had five).
  shiny-slots: 10
  enabled: true
  # V280: ten, Leon's call.
  slots: 10
  rarities: [LEGENDARY, MYTHICAL, DIVINE, ASTRAL]

# /buy and /store. store-url is the web store where Credits are bought;
# set it and the store menu shows a button that sends the link in chat.
# Left empty the button is not there.
buy:
  store-url: "https://spacerng.tebex.store/"
  # V330: a line in chat when somebody buys. Nothing announced a purchase
  # before this, because the store calls /rngadmin give credits and
  # /rngadmin rank set, which are plain admin commands and say nothing to
  # anybody but the sender.
  #
  # Only a purchase announces: a give from a player in game (an op typing
  # it) is silent unless console-only is false, so testing with it does
  # not spam the server. {player} is the buyer, {what} is what they
  # bought.
  announce: true
  console-only: true
  announce-credits: "<gradient:#FFD54F:#FF8F00><b>STORE</b></gradient> <white>{player}</white> <gray>bought</gray> <#FFD54F>{what}</#FFD54F>"
  announce-rank: "<gradient:#FFD54F:#FF8F00><b>STORE</b></gradient> <white>{player}</white> <gray>is now</gray> {what}"
  thanks: "<gray>Thank you for supporting the server.</gray>"

# Worn auras. A player wearing a /tag of Epic or rarer wears the aura set
# here for that rarity: a concept, and an optional particle accent drawn
# on top. Try any combination first with
#   /rngadmin auratest <concept> [rarity] [accent]
# Concepts: orbit, runes, halo, helix, galaxy, ripple, atom, celestial,
# seraph, nebula, cosmos, or none. Accents: none, sparkle, embers, trails,
# enchant, all. Auras step aside within farm-pause-radius blocks of a farm
# plot, and every player can hide them in /options. Not a structural
# section, so tuning here survives a jar update.
auras:
  enabled: true
  farm-pause-radius: 10
  # How far above the block a piece that lies "on the ground" actually
  # sits, in blocks. It was six centimetres, which is not enough for
  # anything with a size to it: a glyph sits low inside its own line box,
  # a plate has a thickness, and both grow with the wearer's size and
  # their rank, so the rings at the feet spent most of their height inside
  # the floor. Raise it if anything still sinks, lower it if the rings
  # start to look like they are hovering.
  ground-lift: 0.45
  # Auras are a Linked perk: no Discord link, no aura.
  require-linked: true
  # The shiny look of a rarity, unlocked by rolling a shiny of it and worn
  # from /aura. Leave a concept out to have no shiny look for that rarity.
  shiny:
    EPIC:
      concept: prism
      accent: sparkle
    LEGENDARY:
      concept: pyre
      accent: embers
    MYTHICAL:
      concept: rift
      accent: enchant
    DIVINE:
      concept: empyrean
      accent: all
    # V319: armillary and zenith below, both unused until now. Sharing
    # Divine.s look would have wasted one of the two tiers: the aura skill
    # is blunt about one identity per rarity.
    ASTRAL:
      concept: armillary
      accent: all
  # How far a rank grows the aura it wears. This is the one thing a rank
  # changes about it: same look, same piece count, same cost, drawn bigger.
  # A cosmetic that scales with what you paid is the least harmful thing a
  # server can sell, which is the whole point of putting it here rather
  # than into another Luck multiplier.
  #
  # Nova is the middle, so it wears exactly what every aura looked like
  # before V184. default covers anybody with no rank at all.
  rank-scale:
    default: 0.70
    linked: 0.70
    comet: 0.85
    nova: 1.0
    supernova: 1.30
    owner: 1.30
  # The heavy looks (singularity, titan, supernova, rift, empyrean) cost
  # about a hundred updates a second for each player watching. Only
  # max-nearby of them run within radius blocks of each other; whoever put
  # one on later wears the fallback look until there is room again.
  heavy:
    max-nearby: 1
    radius: 32
    fallback: ascend
    # V321: anything with this many display entities counts as heavy too,
    # whatever it is called. The list in the comment above is hand-kept
    # and zenith was missed by it: six stacked concepts, as many pieces as
    # empyrean, and the limit above never applied to it. A piece count is
    # measured when a look is first worn, so the next one cannot be
    # missed either. 0 switches the measuring off and trusts the list.
    piece-threshold: 60
    # V321: how many players may be swapped between the heavy look and
    # the fallback in one check. A swap despawns and respawns every piece
    # of a look, so several landing on the same tick is a lag spike
    # rather than load. The next check is a second away.
    swaps-per-check: 1
  # The look a player wears is their rank's since V218, and the tag's
  # rarity only colours it: a Supernova wears the Divine look (ascend) at
  # every rarity from Epic up, each in that rarity's colour, and Linked
  # wears what Epic used to (sigil). A rank left out here, or enabled
  # false, falls back to the rarity's own look under tag: below. The
  # accent always stays the rarity's.
  #
  # V237: a ladder, each rank adding to the one below it. Linked two
  # circles and spokes; Comet two floor circles and six flames; Nova a
  # beating heart with lanterns sailing round it over star bands;
  # Supernova (and Owner) the slanted orbit, bursting floor stars and the
  # lantern atom. Try any look with /rngadmin auratest <look> <rarity>.
  by-rank:
    enabled: true
    looks:
      linked: sigil
      comet: ember
      nova: heartfall
      supernova: ascend
      owner: ascend
  # What a tag of each rarity wears. The four below are the signature
  # looks: rings, flames and columns painted in the rarity's own colour
  # rather than star glyphs round a sea lantern. /rngadmin auratest list
  # shows every look there is, and any of them can be named here.
  tag:
    EPIC:
      concept: sigil
      accent: none
    LEGENDARY:
      concept: ember
      accent: embers
    MYTHICAL:
      concept: eclipse
      accent: trails
    DIVINE:
      concept: ascend
      accent: all
    ASTRAL:
      concept: zenith
      accent: all

# =====================================================================
# Bosses
#
# A boss is a server event, not a mob, and everybody fights their own
# copy of it. One appears for the whole server, and from that moment
# every player has the same job: take its health down inside the window.
# Health is counted in CROPS, so 8000 health is 8000 crops, whatever
# your hoe pays for them, and a landed roll is worth its rarity below.
#
# Per player rather than shared on purpose: with one health pool the
# best farmer ends the event before anybody else has started, and the
# rest are watching a bar. This way nobody can spoil it for the others.
#
# Beat yours in time and you pull from the boss's reward table, which is
# written exactly like a crate's and paid out by the same code. Miss the
# window and you get nothing.
#
# The process that spawns them is started once with
# /rngadmin boss process start and remembered in boss.yml, so it keeps
# running across a jar update.
# =====================================================================
boss:

  enabled: true
  # Minutes between bosses, counted from the moment one starts.
  every-minutes: 120
  # The timer waits rather than burning a boss on an empty server.
  min-players: 1
  # Health taken off by one harvested crop.
  damage-per-crop: 1
  # Tell the server when somebody beats theirs.
  announce-kills: true

  # A boss can turn up on its own off the back of one crop or one roll.
  # Both chances are per event and both are tiny, and the cooldown is the
  # real safety net: without it a per-crop chance means a boss every few
  # minutes for whoever happens to be farming, and the event stops being
  # an event. Zero on both keeps the timed spawn and nothing else.
  natural:
    # Written as one in N rather than as a decimal on purpose. A per crop
    # chance small enough to be sane is 0.000004, and SnakeYAML writes
    # that back out as 4.0E-6, which getDouble then reads as a String and
    # silently answers with the default. Integers cannot go wrong that
    # way, and "one in 250,000 crops" is the number Leon actually wants
    # to think in. Zero on either turns that trigger off.
    harvest-one-in: 250000
    roll-one-in: 2500
    cooldown-minutes: 45
  # What one landed roll is worth, in crops.
  roll-damage:
    COMMON: 5
    UNCOMMON: 10
    RARE: 25
    EPIC: 100
    LEGENDARY: 400
    MYTHICAL: 1000
    DIVINE: 2500
    ASTRAL: 6000
  types:
    comet_hound:
      display: "Comet Hound"
      colors: ["#7DD3FC", "#38BDF8"]
      icon: PRISMARINE_SHARD
      health: 4000
      duration-minutes: 8
      weight: 50
      # Which crate the box is, and how many of them beating it pays.
      box: boss
      boxes: 1
    void_colossus:
      display: "Void Colossus"
      colors: ["#C77DFF", "#7C3AED"]
      icon: CRYING_OBSIDIAN
      health: 8000
      duration-minutes: 10
      weight: 35
      box: boss
      boxes: 2
    solar_wyrm:
      display: "Solar Wyrm"
      colors: ["#FFD54F", "#FF8F00"]
      icon: MAGMA_BLOCK
      health: 15000
      duration-minutes: 15
      weight: 15
      box: boss
      boxes: 3

# =====================================================================
# Pets
#
# A pet is a relic that rides in one of the three aura slots and pays a
# percentage on one stat. One stat each on purpose: a pet that gives a
# bit of everything cannot be compared against the next one, and picking
# three should be a choice.
#
# Three slots because that is the look budget. They sit at 120 degrees
# around the hips, so a player can never be surrounded by a pile of them
# and they cost about what one more aura costs.
#
# How a pet is earned is NOT decided yet. Until it is, hand them out with
# /rngadmin pet give <pet|all> [player] and /pets shows the rest locked.
#
# stat is one of LUCK, SPEED, MONEY, COINS, ENCHANT, SHINY.
# percent is a fraction: 0.05 is +5%, and it reads in /stats as 1.05x.
# =====================================================================
pets:
  enabled: true

  # How many pets a player wears before the skill tree opens more. The
  # ceiling is three whatever this says, because three is the aura's look
  # budget and a fourth orbiting piece is a frame cost on everybody who
  # can see the player, not just on the owner.
  base-slots: 1

  # The Prestige a player needs before any egg can be hatched. Pets
  # already owned stay worn whatever this says.
  #
  # V313: 0, because the Prestige ladder moved onto the eggs themselves
  # (0, 10 and 25) and leaving this at 10 would have locked every egg
  # away from a new player.
  min-prestige: 0

  # The eggs on the pets screen, cheapest first. Every egg draws from the
  # same forty-two pets. V324: what an egg buys is written out as the
  # chance of each rarity, one line each, and whatever is left over is
  # the egg's floor rarity. The old boost multiplied every rarity from
  # Epic up by the same number, which could not move Epic, Legendary and
  # Mythical against EACH OTHER however it was tuned, and that is why the
  # second and third eggs felt identical.
  #
  # The chances on the tooltip are these numbers, not a calculation of
  # them, so what the egg says is what the egg does.
  eggs:
    # V313: an egg hatches the moment it is bought, Leon's call. Set this
    # false to bring the V238 build-up, shake and crack back.
    instant: true
    # Divine is one of the chances below like any other rarity.
    tiers:
      stardust:
        display: "Stardust Egg"
        colors: ["#C9D6FF", "#7FDBFF"]
        icon: TURTLE_EGG
        cost: 100
        # V313: from the start, and never a Divine.
        min-prestige: 0
        min-rarity: COMMON
        max-rarity: MYTHICAL
        divine-chance: 0.0
        # V324: the chance of each rarity, written down rather than worked
        # out from a boost. Anything left over is the egg's floor rarity,
        # here Common at about 68.9%.
        chances:
          UNCOMMON: 0.25
          RARE: 0.06
          EPIC: 0.01
          LEGENDARY: 0.001
          MYTHICAL: 0.0001
      nebula:
        display: "Nebula Egg"
        colors: ["#C77DFF", "#FF7AD9"]
        icon: SNIFFER_EGG
        cost: 1500
        # V313: Prestige 10, and a very small Divine chance: 1 in 1,000.
        min-prestige: 10
        min-rarity: UNCOMMON
        max-rarity: MYTHICAL
        divine-chance: 0.001
        # V324: Mythical was running at about 1 in 4 out of this egg and
        # 1 in 3.7 out of the Supernova, which is why the two eggs felt
        # the same. A boost multiplied every rarity from Epic up by the
        # same number, so their shares against each other never moved
        # however it was tuned. These are the real chances; the rest,
        # about 66.2%, is Uncommon.
        chances:
          RARE: 0.25
          EPIC: 0.07
          LEGENDARY: 0.015
          MYTHICAL: 0.002
      supernova:
        display: "Supernova Egg"
        colors: ["#FFD54F", "#FF6F3C"]
        icon: DRAGON_EGG
        # V351: half the price and three times the Divine chance. At the
        # old numbers one Divine pet averaged 1.2 million Cosmic Dust,
        # which was 228 hours of rolling.
        cost: 6000
        # V313: Prestige 25, and ten times the Nebula's Divine chance.
        min-prestige: 25
        min-rarity: RARE
        max-rarity: MYTHICAL
        divine-chance: 0.03
        # V324: ten times the Nebula on Mythical and three and a half
        # times on Epic, so the dearest egg is clearly the one to save
        # for. The rest, about 64%, is Rare.
        chances:
          EPIC: 0.25
          LEGENDARY: 0.08
          MYTHICAL: 0.02

  # V324: what a FRESH pet of each rarity multiplies its one stat by.
  # Leon asked for multipliers rather than percentages and for every
  # rarity to be exponentially better than the one under it, so the bonus
  # doubles every step: 1%, 2%, 4%, 8%, 16%, 32%, 64%. Rarity, tier and
  # shiny in pets.upgrades below multiply that bonus on top, under
  # max-multiplier, so a fully grown Divine pet is the only thing on the
  # server worth 4.84x a stat and a Common one never passes 1.06x.
  multipliers:
    COMMON: 1.01
    UNCOMMON: 1.02
    RARE: 1.04
    EPIC: 1.08
    LEGENDARY: 1.16
    MYTHICAL: 1.32
    DIVINE: 1.64

  dust:
    # The action bar line when a dust falls. Rolling is fast and dust is
    # rare, so it is a quiet line rather than a title in the way of the
    # roll it landed on. Since V314 it holds the bar for three seconds, so
    # the level-up hint on its own timer cannot paint over it.
    announce: true
    # V314: how much one Cosmic Dust find is worth. Rolled fresh between
    # the two every time, and the Cosmic Yield skill in /skilltree adds to
    # the top, so levels buy the size of a find as well as how often one
    # lands. Leon asked for a range rather than a flat one.
    # V351: a find is 1 to 10 rather than 1 to 2. Eight hours of rolling
    # bought about a thirtieth of one Divine pet, which is not a grind,
    # it is a wall.
    cosmic-min: 1
    cosmic-max: 10

  # What rarity and tier do to a pet, what they cost, and how likely a
  # tier is to take. A fresh pet is rarity 1 tier 1 and gives exactly the
  # percent in pets.types below, so these only ever add on top.
  upgrades:
    max-rarity: 10
    max-tier: 10

    # One step, as a fraction of the base percent. A rarity 10 tier 10
    # shiny pet lands on 3.25 x 2.35 x 1.10, which is why the cap exists.
    rarity-step: 0.25
    tier-step: 0.15
    shiny-bonus: 0.10

    # The ceiling on rarity, tier and shiny together. A Starheart at 15%
    # Luck cannot pay more than 90% however long it is fed.
    max-multiplier: 6.0

    # Cosmic Dust, out of rolling. A hundred since V215, Leon's call.
    # Only the egg is paid in dust; every upgrade below is Gems.
    make-cost: 100

    # V313: Gems, and exponential, Leon's call ("pet upgrade met Gems
    # exponentieel duurder"). A growth of 2.0 is a doubling per level,
    # which is the one curve a player can read off the menu without
    # arithmetic: rarity 10 is 1,000 to 256,000 and 511,000 Gems in all,
    # tier 10 another 766,500 before a single failed attempt. Gems come
    # off the farm in the thousands an hour, so this is the long sink at
    # the end of farming rather than something bought in an evening.
    rarity-base-cost: 1000
    rarity-cost-growth: 2.0
    shiny-cost: 100000

    tier-base-cost: 1500
    tier-cost-growth: 2.0

    # A tier attempt spends the dust whether or not it takes. The chance
    # falls off as the tier climbs and the Steady Hands skill adds back
    # onto it, but it never drops below tier-min-chance.
    tier-base-chance: 0.80
    tier-chance-falloff: 0.06
    tier-min-chance: 0.15

  # V324: every stat at every rarity, Leon's call. Six stats times seven
  # rarities is forty-two pets, each one multiplying ONE stat, so the
  # rarity you hatch and the stat you wanted are two separate rolls: the
  # best pet in the game can still land on a stat you do not care about.
  #
  # An entry carries no number of its own any more. What a pet is worth
  # is pets.multipliers above, by rarity, so retuning the ladder is one
  # block rather than forty-two lines, and weight only decides which pet
  # inside a rarity you get. Equal weights means an even draw between
  # the six stats.
  types:
    # ---- Common ----
    pocket_comet:
      display: "Pocket Comet"
      colors: ["#E0F7FA", "#B2EBF2"]
      icon: SNOWBALL
      rarity: COMMON
      stat: LUCK
      weight: 1.0
      blurb: "Small, cold, and oddly lucky."
    draft_feather:
      display: "Draft Feather"
      colors: ["#E1F5FE", "#81D4FA"]
      icon: FEATHER
      rarity: COMMON
