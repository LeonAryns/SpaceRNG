  luck_10:
    display: "Permanent Luck +10%"
    material: RABBIT_FOOT
    colors: ["#B9F6CA", "#00C853"]
    permanent-luck: 0.1
    description: "A permanent 10% Luck. It never runs out."
  luck_25:
    display: "Permanent Luck +25%"
    material: RABBIT_FOOT
