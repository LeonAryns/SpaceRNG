  # ---- The golden crop ----
  # Exactly one plot in the field is worth many times the others, per
  # player, and it moves the moment it is harvested. Per player because
  # everyone already sees their own crop on every tile: a shared golden
  # plot would be a race between farmers rather than a reason to keep
  # looking around your own field.
  #
  # multiplier is the base. The Golden Harvest node in /farmtree adds to
  # it, so a maxed farmer is finding something worth 30x.
  golden-crop:
    enabled: true
    multiplier: 10.0
    # The chance a golden crop also drops one Farm Dust, once Farm Dust is
    # unlocked in /farmtree. On top of the normal per-crop chance.
    farm-dust-chance: 0.05

  # ---- What the procs actually do ----
  # Radii and counts are capped here rather than scaled off the level. A
  # percentage survives ten thousand levels; a radius does not.
  procs:
    prospector-share: 0.02
    golden-touch-multiplier: 2.0
    golden-touch-seconds: 15
    gem-rush-multiplier: 3.0
    gem-rush-seconds: 15
    echo-repeats: 8
    alchemy-share: 0.15
    alchemy-rate: 0.001
    cascade-radius: 4
    cascade-gems: 2
    storm-payout: 25
    meteor-radius: 3
    supernova-coins: 250
    # Supernova is Nova Finder several times over, which is what makes it
    # the thing you graduate to rather than a separate lottery.
    supernova-nova-attempts: 3
    supernova-gems: 40
    lightning-radius: 5
    lightning-bolts: 5
    nuke-crops: 10000
    gamba-multiplier: 3.0
    gamba-seconds: 60
    # What one Credit Finder proc pays.
    credit-finder-amount: 1
    key-finder-reward: crate_key
    # Now and then the key Key Finder turns up is the rare one instead.
    # Cosmic Keys are store only, so the rare find is a Nebula Key.
    key-finder-rare-reward: nebula_key
    key-finder-rare-chance: 0.08
    potion-finder-rewards:
      - luck_potion
      - speed_potion
      - coin_potion
      - enchant_potion

