        - { weight: 14, gems: 75 }
        - { weight: 10, consumable: luck_potion }
        - { weight: 10, consumable: speed_potion }
        - { weight: 8, drop: RARE }
        - { weight: 6, consumable: nova_core }
        - { weight: 3, consumable: free_skill }
