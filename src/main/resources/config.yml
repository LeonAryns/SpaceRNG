# Leaderboards and the daily farming payout.
#
# The plugin keeps its own player index (leaderboard.yml) because the live
# cache only holds players who are ONLINE — a board built from that would
# quietly be a board of whoever happens to be connected.
#
# The period rolls over at reset-hour in this timezone. Winners are paid
# even if they're offline at the time: their save file is credited
# directly.
#
# For a hologram, use DecentHolograms with these placeholders:
#   %solrng_top_farming_1_name%    %solrng_top_farming_1_value%
#   %solrng_top_farming_1_reward%  %solrng_farm_reset%
#   %solrng_farm_place%            %solrng_farm_value%
# Boards: farming, farming_total, rolls, prestige, index
leaderboard:
  timezone: "UTC"
  farming:
    reset-hour: 0
    credit-payouts: [150, 75, 25]

# Rotating server tips. These rotate in ORDER, not at random: random
# repeats itself and leaves some tips unseen for ages, which is exactly
# wrong for something meant to teach. Each list entry is one block of
# lines sent together under the header.
announcements:
  enabled: true
  interval-seconds: 300
  header: "&b&l\u2600 SERVER TIPS \u2600"
  messages:
    - - "&3\u258e &e\u25b8 &fLeft-click&7 your Starforge to toggle &bAuto Roll&7."
      - "&3\u258e &e\u25b8 &7Put spare drops in &e/convert&7 to buy armor and Starforges."
    - - "&3\u258e &e\u25b8 &7Every drop has its own &bIndex Luck&7 \u2014 equip the best in &e/index&7."
      - "&3\u258e &e\u25b8 &7Unlock &fIndex Luck&7 in &e/skilltree&7 before you can wear one."
    - - "&3\u258e &e\u25b8 &d/novacore&7 is a push-your-luck ladder. Every tier multiplies &feverything&7."
      - "&3\u258e &e\u25b8 &7Checkpoints at &f5&7, &f11&7 and &f18&7 catch a bad run."
    - - "&3\u258e &e\u25b8 &a/farmtree&7 has crops, hoe enchants and Token multipliers."
      - "&3\u258e &e\u25b8 &7Pick what grows for you with &e/crops&7 \u2014 the field is yours alone."
    - - "&3\u258e &e\u25b8 &7Long-run goals live in &e/milestones&7. Rewards wait there to be claimed."
      - "&3\u258e &e\u25b8 &7New here? &e/guide&7 walks you through everything."
    - - "&3\u258e &e\u25b8 &7Claim your streak every day with &e/daily&7 \u2014 miss one and it resets."
      - "&3\u258e &e\u25b8 &d/buy&7 has a &5Global Luck Boost&7 that helps the whole server."

