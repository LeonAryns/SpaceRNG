# The Nova Core ladder (/rngcookie). Each forge either climbs a tier or
# drops you to the last checkpoint, and every tier is worth a permanent
# Luck multiplier of 1 + tier * multiplier-per-tier.
#
# Odds of clearing tier T = base-chance * decay^T * (1 + luck), clamped.
# At 100% Luck that's ~95/95/95/92/78% for the first five tiers, so
# reaching checkpoint 1 is roughly a 62% run; by tier 20 the same player
# is at ~6% a step, which keeps the top of the ladder a real grind.
novacore:
  max-tier: 20
  # First checkpoint tier; each gap after it is one longer, so the
  # defaults give 5, 11, 18 across a 20-tier ladder.
  first-checkpoint: 5
  base-chance: 0.50
  # The very first forge a player ever makes always succeeds. The menu
  # still shows the real chance; only the result is guaranteed.
  first-forge-guaranteed: true
  decay: 0.85
  # How much Luck lifts the chance. At 1.0 a player with +100% Luck saw a
  # 50% forge as 95%, so the coin flip stopped being one.
  luck-weight: 0.15
  # Shown in chat whenever somebody needs to know where Nova Cores come from.
  how-to-get: "crates, /milestones (Playtime) and the /guide"
  min-chance: 0.02
  max-chance: 0.95
  # One entry per tier. This is a UNIVERSAL multiplier: it scales Luck,
  # the Money a roll pays and farm Coins together, so the ladder is worth
  # climbing whatever you're grinding. Gentle at the bottom, steep at the
  # very top.
  multipliers: [1.02, 1.05, 1.10, 1.15, 1.25, 1.40, 1.55, 1.75, 2.00, 2.25,
                2.50, 2.85, 3.25, 3.75, 4.25, 5.00, 6.00, 7.50, 9.00, 12.00]

# Shiny drops. A shiny is the same drop with a marker, an enchant glint
# and its own entry in /index - 1 in 100 rolls by default, so roughly one
# shiny per 100 of any given drop.
#
# It's gated on a skill node: until that's bought the chance simply
# doesn't exist, so a player never rolls one or sees a near-miss.
#
# Shinies are NEVER auto-converted by the normal per-rarity toggles -
# only by their own switch in /convert - and they bank separately.
# The Battle Pass (/pass). One XP bar, two reward tracks.
#
# XP comes from rolling and from farming, and a rarer roll is worth
# more, so the pass tracks how well you're playing rather than just how
# long - which is the point of tying it to this gamemode at all.
#
# Bump `season` to start a new one: every player's XP, premium status
# and claims reset the next time they open the menu. Nothing else is
# touched, so a season change is one number and a /rngadmin reload.
#
# Credits are the paid-store currency, so the FREE track never pays
# them. The premium track does - it was bought with Credits, and the
# five milestone payouts add back up to exactly the premium price, so
# finishing a season earns the next one.
pass:
  season: 1
  season-name: "Season I"
  premium-cost-credits: 1000
  # The skill that unlocks the menu at all.
  node: "pass_unlock"
  xp:
    # XP per roll, by what the roll landed on.
    per-roll:
      COMMON: 10
      UNCOMMON: 100
      RARE: 1000
      EPIC: 5000
      LEGENDARY: 25000
      MYTHICAL: 100000
      DIVINE: 500000
    per-harvest: 1
  # One entry per level, in order. `xp` is what THAT level costs, not a
  # running total. Both tracks are optional per level.
