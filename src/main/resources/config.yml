      icon: GOLD_NUGGET
      cost-money: 7500
      requires: "farm_root"
      effect: UNLOCK_ENCHANT
      target: "TOKEN_GREED"
      value: 0

    token_greed_power:         # (4,5) — ranks up the enchant above
