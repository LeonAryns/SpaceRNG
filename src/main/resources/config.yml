# ============================================
# Crop boosts (/crops, click the crop you are growing)
# ============================================
# V353, Leon's call. The farm tree carried a Yield node for every crop,
# which meant Nether Wart Yield could be bought by somebody who had
# never unlocked Nether Wart, from a menu, nowhere near a field. Those
# nodes are gone and these took their place.
#
# A level is stored against ONE crop, so Coins poured into Wheat do
# nothing for Carrots. Specialising is a real choice, and it is made on
# the crop rather than on a map of the whole farm.
#
# per-level is a fraction added to a multiplier that starts at 1.0, so
# 0.08 at level 10 is 1.80x. base-cost is in Coins and cost-growth is
# compounded per level, so level n costs base x growth^n.
crop-boosts:
  # The fallback ceiling for a stat that does not name its own.
  max-level: 25
  stats:
    COIN_FORTUNE:
      display: "Coin Fortune"
      colour: GOLD
      icon: GOLD_INGOT
      blurb: "More Coins from this crop."
      per-level: 0.08
      base-cost: 2500
      cost-growth: 1.27
      max-level: 25
    GEM_FORTUNE:
      display: "Gem Fortune"
      colour: AQUA
      icon: AMETHYST_SHARD
      blurb: "More Gems from this crop."
      per-level: 0.06
      base-cost: 6000
      cost-growth: 1.3
      max-level: 25
    ENCHANT_PROC:
      display: "Enchant Proc"
      colour: LIGHT_PURPLE
      icon: ENCHANTED_BOOK
      blurb: "Every hoe enchant fires more often here."
      per-level: 0.04
      base-cost: 12000
      cost-growth: 1.33
      max-level: 20
    GROWTH:
      display: "Growth"
      colour: GREEN
      icon: BONE_MEAL
      blurb: "This crop grows back faster."
      per-level: 0.05
      base-cost: 9000
      cost-growth: 1.31
      max-level: 20

# ============================================
# Farming skill tree (/farmtree)
# ============================================
# A crop, six skills beside it, its yield, then the next crop.
#
# The general tree can afford three parallel lines because its skills
# have no order. The farm's do: wheat before carrots before nether wart,
# and a crop's yield skill is worthless before the crop. So the middle
# column IS the route, and every crop on it opens a row of six optional
# skills - three each side, getting better the further out they sit.
#
# The rows between crops carry nothing on purpose. Half the silhouette
# stays "???" the whole way up, which is what makes the tree look like
# somewhere to explore rather than a list you've already read.
#
# New enchants sit at the ends of the branches, where finding one is a
# reward for going out of your way. Coin Greed is the exception: it's
# the enchant you want on day one, so it sits right next to the wheat.
#
# Paid in Coins. The farm owns Coins and Gems outright.
#
# Families worth knowing:
#   (CROP_YIELD was retired in V353. A crop's own multipliers live on
#   the crop now, in crop-boosts below and bought in /crops.)
#   ENCHANT_PROC  raises every hoe enchant's chance at once
#   ENCHANT_CAP   raises the level ceiling on every hoe enchant, from
#                 the base-cap of 100 toward the hard 1000
#   HOE_TIER      walks the hoe itself up farming.hoe-tiers


farmtree:
  # Three pages on the same 24 slot frame as /skilltree. On every page:
  #   middle line  the page's first crop at the root, its yield, Golden
  #                Harvest, Growth, then the page's second crop at row 2
  #                and what hangs off it
  #   left line    the hoe: three enchants for the first crop, a tool
  #                upgrade, three enchants for the second crop, and one
  #                more off the side
  #   right line   the harvest: Coins, Gems, Growth and Proc Chance
  #
  # The second crop also needs the third enchant and the first Gems node
  # (requires-all), so a new crop means climbing half the page on all
  # three lines, not two clicks up the middle.
  #
  # Prices follow depth from the page's root: base x 1.62^depth. Enchant
  # unlocks cost 8x a skill at the same depth, because each one opens a
  # Coin sink on the hoe; the second crop costs 3x. Each page's base is 30x
  # the last: 4,000, then 120,000, then 3,600,000.
  #
  # V298: the Speed enchant (walking speed, WALK_SPEED) is the second
  # thing to unlock, next to the Wheat root, at Leon's request.
  reserved: []
  pages: 4
  page-names: ["Cultivation", "Abundance", "Uncharted", "Cosmic Soil"]
  nodes:

    # ====================================================================
    #  PAGE 1 - CULTIVATION: Wheat and Carrots
    # ====================================================================

