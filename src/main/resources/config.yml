# Commands the console runs when a gate skill is bought. Left blank the
# skill still unlocks, it just doesn't hand out a permission - which is
# what you want while the matching plugin isn't installed yet.
#
# {player} is replaced with the player's name. The Private Vault skill
# expects a /pv-style plugin to be present; PlayerVaults X (with LuckPerms
# for the permission) is the usual pairing on Paper 1.21.
unlock-commands:
  private-vault:
    - "lp user {player} permission set playervaults.amount.1 true"
    - "lp user {player} permission set playervaults.use true"

shiny:
  # Base 1 in 2,500. Shiny Chance nodes in /skilltree multiply this.
  chance: 0.0004
  node: "shiny_unlock"
  marker: "&b&l✦"
  broadcast: true

# Perks are a second progression layer bought with drops, not Money.
# A roll trades a fixed number of drops of one tier for one random perk
# whose stats are drawn from that tier's chance table. Higher tiers roll
# stronger perks more often. Every perk has a random level I-V that
# scales its value linearly.
#
# Types decide WHICH stats a perk gives. Lower tiers boost one stat,
# higher tiers boost several: this is the "how many stats" table below.
# The exact stats a type can roll are hardcoded per PerkType in code -
# tune the pools by editing PerkType.java.
#
# Balance follows a shared formula:
#   effective = base * tierMult * levelMult
# So a Divine V perk is 100% of the top figure and a Common I perk is
# 1% of it. Both tier and level curves can be retuned here.
perks:
  # Maximum perks equipped at once. Rest sit in the vault, still owned.
  loadout-slots: 3
  # Per level (I to V) the roll picks. Same for every tier.
  level-chances: [0.40, 0.30, 0.20, 0.08, 0.02]
  # How much each level of a perk scales its top-tier ceiling.
  level-multipliers: [0.20, 0.40, 0.60, 0.80, 1.00]
  # How much each rarity tier scales its top-level ceiling.
  # Common at V is 5% of a Divine at V, and so on.
  tier-multipliers:
    COMMON: 0.05
    UNCOMMON: 0.10
    RARE: 0.20
    EPIC: 0.35
    LEGENDARY: 0.50
    MYTHICAL: 0.75
    DIVINE: 1.00
  # How many stats each tier's perks boost. Lower tiers focus, higher
  # tiers spread. The pool of stats depends on the PerkType.
  stat-count:
    COMMON: 1
    UNCOMMON: 1
    RARE: 2
    EPIC: 2
    LEGENDARY: 3
    MYTHICAL: 3
    DIVINE: 4
  # The Roll buttons in /perks. Each is one drop tier you trade in.
  rolls:
    EPIC:
      cost-rarity: EPIC
      cost-amount: 5
      # Chance a rolled perk lands at each tier.
      tier-chances:
        COMMON: 0.60
        UNCOMMON: 0.25
        RARE: 0.10
        EPIC: 0.04
        LEGENDARY: 0.009
        MYTHICAL: 0.001
        DIVINE: 0.0
    LEGENDARY:
      cost-rarity: LEGENDARY
      cost-amount: 5
      tier-chances:
        COMMON: 0.25
        UNCOMMON: 0.30
        RARE: 0.25
        EPIC: 0.12
        LEGENDARY: 0.06
        MYTHICAL: 0.018
        DIVINE: 0.002
    MYTHICAL:
      cost-rarity: MYTHICAL
      cost-amount: 3
      tier-chances:
        COMMON: 0.10
        UNCOMMON: 0.15
        RARE: 0.25
        EPIC: 0.25
        LEGENDARY: 0.15
        MYTHICAL: 0.08
        DIVINE: 0.02
    DIVINE:
      cost-rarity: DIVINE
      cost-amount: 1
      tier-chances:
        COMMON: 0.05
        UNCOMMON: 0.10
        RARE: 0.15
        EPIC: 0.25
        LEGENDARY: 0.25
        MYTHICAL: 0.15
        DIVINE: 0.05
  # The top-tier ceiling for each stat a perk can grant. Multiplied by
  # both the perk's tier and its level. So MONEY_PERCENT at Divine V is
  # +100%, Common I is +100% * 0.05 * 0.20 = +1%.
  stat-ceilings:
    MONEY_PERCENT: 1.00
    LUCK_PERCENT: 2.00
    COINS_PERCENT: 1.00
    SHINY_PERCENT: 3.00
    RARE_BAND_PUSH: 0.50
    ROLL_SPEED_FLAT: 1.00
    BONUS_ROLL_PERCENT: 0.30
    INSTANT_ROLL_PERCENT: 0.15
    DUPLICATE_PERCENT: 1.00
    CONVERT_PERCENT: 0.50
    GOLDEN_CROP_PERCENT: 2.00
    CROP_YIELD_PERCENT: 1.00
    ENCHANT_PROC_PERCENT: 1.00

# Rolls of this rarity or higher get broadcast to the whole server.
broadcast:
  min-rarity-to-broadcast: EPIC
