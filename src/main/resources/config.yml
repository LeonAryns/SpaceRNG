  # ---- Blast Harvest ----
  # The radius one detonation sweeps. It has to scale far more slowly than
  # the enchant's level does: at the old one-per-three-levels, a maxed hoe
  # would clear a 669-block-wide square in a single click.
  blast:
    base-radius: 1
    levels-per-radius: 150
    # V267: 4, smaller than the 7 it was.
    max-radius: 4

  # ---- Momentum ----
  # A farming RUN. Every crop you take adds to it, and the whole thing is
  # gone if you stop for longer than idle-seconds - the boss bar across the
  # top IS the run, so there's never any doubt what you're sitting on.
  #
  # It's the one farm bonus you can't buy outright: the enchant only raises
  # the ceiling, and the field is what fills it.
  momentum:
    # Added to the multiplier for every 1,000 crops in the current run.
    # V268: 0.1, ten times faster; the 5x ceiling now takes 40,000 crops.
    per-thousand-crops: 0.1
    # The ceiling, per level of the Momentum enchant. At the starting cap
    # of 100 levels that's a +5.00x ceiling.
    #
    # Reaching a +5.00x ceiling at 0.01 per thousand takes 500,000 crops in
    # one run. Set per-thousand-crops to 0.10 if you want that to be
    # 50,000 instead.
    # V267: 0.0004, so 10,000 levels top out at +4, a 5x multiplier. At
    # 0.05 the ceiling was +500.
    per-level-cap: 0.0004
    # Seconds without a harvest before the run ends.
    idle-seconds: 30
    # After you stop swinging, the multiplier slides from wherever it got
    # to down to nothing over this many seconds, with the bar still up.
    # Stopping should be a decision with a visible cost, not a switch.
    decay-seconds: 60

  # ---- Hoe tiers ----
  # The Tool Upgrade nodes in /farmtree walk the hoe up this list. A tier
  # is a flat bonus on the hoe itself rather than an enchant: it shows in
  # the Information block, not the Enchants one, because it's what the tool
  # IS rather than something bolted onto it.
  #
  # The hoe is always a wooden hoe. A tier has no name and no material of
  # its own - it is simply the Roman numeral of its position in this list,
  # so "Farmer's Hoe [IV]" is the fourth entry below and adding a seventh
  # entry gives you a [VII] with no other change. Order matters; nothing
  # else about an entry does.
  hoe-name: "Farmer's Hoe"
  # The tier ladder is generated from this shape rather than listed out.
  # Seventy hand-written entries would be seventy chances to mistype one,
  # and retuning the curve would mean editing every line.
  #
  # bands             how many rarities the ladder walks, from Common up.
  #                   5 stops at Legendary, on purpose: nothing at the top
  #                   of this ladder should need a drop nobody will see.
  # tiers-per-band    tiers bought with each of those rarities
  # cost-step         the first tier in a band costs this many drops, the
  #                   second twice that, and so on: 2, 4, 6 ... 20
  # blend-from        from this tier in a band, the price also asks for 1,
  #                   2, 3 of the NEXT rarity, so moving up a band is a
  #                   slope rather than a wall. The final band never
  #                   blends.
  # coin-bonus-step   a tier in band N is worth N times this. Common tiers
  #                   are +1% Coins each, Legendary tiers +5%. Ten of each
  #                   across five bands comes to +150% at the top.
  # coin-bonus-step   also the tier MULTIPLIER: a tier reads as 1.14x
  #                   Coins rather than +14%, so it can be compared with
  #                   every other multiplier a player owns.
  # proc-share        enchant proc per tier, as a fraction of the Coin
  #                   step. Set it to 0 for a purely Coins ladder.
  #
  # Tier I is the hoe you are handed and grants nothing, so the ladder is
  # 50 bought tiers on top of it.
  # The most any chance-based enchant can reach, however many levels it
  # has. A proc's chance is about its raw number while small and bends
  # toward this ceiling as it grows, so Blast at level 10,000 fires on
  # about half the crops instead of every one.
  proc-cap: 0.5
  # V267: every proc chance times this; 0.2 is five times less often.
  # Always on enchants (Coin Greed, Momentum, Speed) are not chances and
  # ignore it, and the listed ones keep their own number.
  proc-scale: 0.2
  proc-scale-exempt: [BLAST_HARVEST]
  hoe-ladder:
    bands: 5
    tiers-per-band: 10
    cost-step: 2
    coin-bonus-step: 0.01
    # Enchant proc climbs slower than Coins, because it lifts every
    # enchant at once: the same step would be worth many times more.
    # V186 raised it from 0.07 at Leon's request. The whole ladder is
    # +280% Coins, so this share is what the top of it is worth in proc:
    # 0.18 puts a fully walked hoe at about 1.50x.
    proc-share: 0.18
    blend-from: 8

  # ---- Sounds ----
  # Both can be switched off per player in the hoe menu.
  sounds:
    harvest: BLOCK_CROP_BREAK
    harvest-pitch: 1.4
    enchant-proc: BLOCK_AMETHYST_BLOCK_CHIME
    enchant-proc-pitch: 1.7

# Levels are earned by rolling; prestiging resets your level for a
# permanent Luck *multiplier* (applied on top of every other Luck source).
prestige:
  # Points awarded per ascend, spent on the upgrades below. Points are the
  # part of prestige the player chooses how to use, which is what makes
  # prestiging a decision rather than a button.
  points-per-prestige: 1
  # Slot is "column,row", 1-indexed, in a 6x9 menu.
  # V346, Leon's call: prestige buys the Secret Realm and nothing else.
  # The realm itself is the first purchase at 5 points, and everything
  # under it is locked until that is bought. Lucky Star, Coin Master,
  # Gold Rush, Gem Seeker and Nova Touch are gone, and the points spent
  # on them are handed back the first time a save is seen.
  upgrades:
    realm_access:
      display: "The Secret Realm"
      icon: END_PORTAL_FRAME
      slot: "5,2"
      effect: REALM_ACCESS
      per-level: 1
      unit: ""
      max-level: 1
      cost-points: 5
    realm_luck:
      display: "Realm Luck"
      icon: RABBIT_FOOT
      slot: "3,4"
      effect: REALM_LUCK
      per-level: 0.25
      unit: "x"
      max-level: 20
      cost-points: 2
      requires: realm_access
    realm_speed:
      display: "Realm Speed"
      icon: SUGAR
      slot: "4,4"
      effect: REALM_SPEED
      per-level: 0.1
      unit: "x"
      max-level: 20
      cost-points: 2
      requires: realm_access
    realm_time:
      display: "Realm Time"
      icon: CLOCK
      slot: "6,4"
      effect: REALM_TIME
      # Seconds you may stay after it closes for everybody else.
      per-level: 60
      unit: ""
      max-level: 10
      cost-points: 3
      requires: realm_access
    secret_seeker:
      display: "Secret Seeker"
      icon: ENDER_EYE
      slot: "7,4"
      effect: SECRET_CHANCE
      per-level: 0.1
      unit: "x"
      max-level: 20
      cost-points: 2
      requires: realm_access
  rolls-per-level: 70
  # Each level costs this much more than the one before it. At 1.0 the
  # ladder is flat and level 50 costs what level 2 did, which turns
  # levelling into a formality rather than a climb.
  # V351: 1.13, not 1.17. Each level costing 17% more than the last is
  # fine to level 20 and a wall at 40: level 43 wanted 118,000 rolls.
  level-cost-growth: 1.13
  # V354, Leon's call: the first prestiges harder, the late ones easier.
  #
  # It was the other way round, and for two reasons at once. The levels
  # asked for grew by one every prestige for ever, AND every level cost
  # 13% more than the one under it, so prestige 30 wanted forty levels
  # whose last few were thousands of rolls each. Two caps fix it without
  # flattening the early climb:
  #
  #   level-cost-cap-level  past this level a level costs what level 25
  #                         costs and stops compounding, so the ladder
  #                         goes from exponential to straight.
  #   max-levels-per-prestige  the levels asked for stop growing here.
  #
  # first-prestige-levels is 13 rather than 10, so the first prestige is
  # about 2,100 rolls instead of 1,290. Prestige 12 and up all ask the
  # same 25 levels, about 11,000 rolls, where before prestige 30 wanted
  # more than 70,000.
  level-cost-cap-level: 25
  max-levels-per-prestige: 25
  first-prestige-levels: 13
  # V298: each prestige asks one level more than the last, not five.
  levels-increment-per-prestige: 1
  luck-multiplier-per-prestige: 0.10

# /armor - sets bought with rolled drops. Each worn piece grants its
# tier's Luck bonus and a smaller Speed bonus (speed-bonus 0.01 = +1
# Speed, where 100 Speed is the baseline roll speed).
# /armor - pieces are bought ONE AT A TIME, not as a set. Each cost below
# is the price of a single piece, so a full 4-piece set costs four times
# what's listed. Every piece grants its tier's Luck and Speed while worn,
# independently - mixing tiers across slots is fine and a lone pair of
# boots still pays out.
#
# speed-bonus 0.05 = +5 Speed, where 100 Speed is the baseline roll speed.
armor:
  # V306: armor bought before this round is taken back once per player on
  # join. Raise it to wipe again after another rework.
  reset-version: 1
  # V306: costs are a CHESTPLATE's. The other pieces take their crafting
  # share of it, rounded up: helmet 5/8, leggings 7/8, boots 4/8.
  # V308: few drops, one rarity per set, rarer the higher it goes.
  # V351: four pieces of the same tier are worth half again as much, Luck
  # and Speed alike. Mixing tiers still pays for every piece; this is just
  # what a matching set is for.
  set-bonus: 0.5
  # V353, Leon's call: a set is levelled before the next one opens.
  #
  # Buying any piece puts that tier at level 1. From there it climbs on
  # MORE OF THE SAME drop it was bought with, never a rarer one, and the
  # tier above stays locked until this one reaches max-level.
  #
  #   first-step    level 2 costs the tier's own price x this
  #   cost-growth   and every level after that multiplies by this
  #   bonus-per-level  what one level adds, as a share of the tier's
  #                 printed Luck and Speed. 0.10 over nine levels means a
  #                 maxed set is worth 1.9x a fresh one.
  #
  # Leather at 20 Common: level 2 costs 10 Common, level 10 costs 195,
  # and the whole climb is about 600 Common. Netherite at 3 Mythical:
  # level 2 costs 2, level 10 costs 29, the climb about 90.
  levels:
    max-level: 10
    first-step: 0.5
    cost-growth: 1.45
    bonus-per-level: 0.10
  tiers:
    LEATHER:
      display: "Leather"
      # V343, Leon's call: every tier asks for two rarities, and every piece
      # of a tier costs the same. The second rarity is the one the next tier
      # runs on, so buying a set teaches you what you will need next.
      costs:
        COMMON: 20
        UNCOMMON: 1
      luck-bonus: 0.15
      speed-bonus: 0.08
    CHAINMAIL:
      display: "Chainmail"
      costs:
        UNCOMMON: 20
        RARE: 1
      luck-bonus: 0.35
      speed-bonus: 0.12
    IRON:
      display: "Iron"
      costs:
        RARE: 10
        EPIC: 1
      luck-bonus: 0.7
      speed-bonus: 0.18
    GOLD:
      display: "Gold"
      costs:
        EPIC: 4
        LEGENDARY: 1
      luck-bonus: 1.2
      speed-bonus: 0.25
    DIAMOND:
      display: "Diamond"
      costs:
        LEGENDARY: 3
        MYTHICAL: 1
      luck-bonus: 2.0
      speed-bonus: 0.35
    NETHERITE:
      display: "Netherite"
      costs:
        MYTHICAL: 3
        DIVINE: 1
      luck-bonus: 3.0
      speed-bonus: 0.5

# Rarity tiers, in ascending order. "luck-factor" controls how strongly
# the Luck stat biases rolls toward this tier. 0 = luck has no effect.
# Effective weight = base weight * (1 + luck * luck-factor)
rarities:
  # Rarities are just a plain label color now - the fancy gradients live
  # on each individual item instead (see the per-item "colors" below).
  # "symbol: true" wraps that rarity's item names in an obfuscated flair
  # character on both sides (Epic and up).
  #
  # Common, Uncommon and Rare labels are friendly rather than literal: the
  # band as a whole lands on its `share` of all rolls, and the labels only
  # decide which item inside the band wins. Money pays on the label, so a
  # friendly label also keeps the early economy where it was. Epic and up
  # set `true-odds`, and there the number on the item is the real chance.
  #
  # luck-exponent: what Luck actually does. A rarity's weight is
  # multiplied by (1 + Luck) ^ luck-exponent, where Luck is the fraction
  # /stats shows (+2,500% is 25). Common takes no exponent at all and is
  # whatever weight is left over, so the weights always add to 1.
  #
  # V348: every tier above Epic now takes a BIGGER exponent than the one
  # under it. They all shared 1.0 before, which multiplied them by the
  # same number and locked their ratios to each other for ever: past
  # about a million percent Luck the table stopped moving at Epic 91%,
  # Legendary 8%, Mythical 0.5%, Divine 0.04%, Astral 1 in 103,000. That
  # is why a deep account still rolled Epic as its base drop. With the
  # step below, more Luck keeps pushing weight up the ladder:
  #
  #   Luck        Epic   Legend  Myth    Divine        Astral
  #   +100,000%   44%    11%     0.2%    1 in 47,000   1 in 4,100,000
  #   +1,000,000% 72%    26%     0.6%    1 in 20,000   1 in 1,400,000
  #   +10m%       65%    34%     1.1%    1 in 15,000   1 in 912,000
  #   +100m%      57%    41%     1.9%    1 in 12,000   1 in 603,000
  #   +3b%        43%    53%     3.9%    1 in 9,300    1 in 349,000
  #
  # V352: Divine's exponent is BELOW Mythical's and that is deliberate.
  # Luck has to keep being worth having, so Epic, Legendary and Mythical
  # climb hard with it: Mythical goes from 1 in 140 at +100,000% to one
  # roll in seven at three billion percent, and Legendary overtakes Epic
  # as the thing you see most. Divine and Astral are pinned to the two
  # numbers asked for instead, so the trophies do not come along for the
  # ride. Raise their exponents toward Mythical's to let them.
  #
  # V354, Leon's call: the top came far too fast. Mythical is four times
  # rarer at the table, Divine ten times and Astral twenty, which is the
  # half of the dial that does not touch the tiers under it. At three
  # billion percent Luck, which is what the deepest accounts hold, a
  # Divine is one roll in 9,300 and an Astral one in 349,000. At 800
  # Speed, about 1.6 rolls a second, that is an hour and a half for a
  # Divine and about sixty hours of rolling for an Astral. The floor
  # still rises on its own: Common is gone by about +300,000% and Epic
  # carries the table from there.
  #
  # Money pays on an item's odds, so a Divine is worth ten times what it
  # was and comes a tenth as often: the same Money per roll, a rarer
  # trophy.
  #
  # The step between the exponents is what decides how fast the top tiers
  # come in; the odds on the items are the other half of the same dial.
  #
  # luck-factor: the old linear curve, only read when luck-curve is set to
  # "linear". Positive grows a weight (1 + Luck x factor), negative
  # shrinks it (divides by 1 + Luck x -factor).
  # Common shrinks, so Luck visibly pushes rolls up the table: at 2,500%
  # Luck Commons are about a third of rolls instead of three quarters.
  COMMON:
    colors: ["&f"]
    luck-factor: -0.25
    share: 0.945
  UNCOMMON:
    colors: ["&a"]
    luck-factor: 0.15
    share: 0.050
  RARE:
    colors: ["&9"]
    luck-factor: 0.35
    share: 0.003
  #
  # Epic and up also wear their name with weight on it, and more of it the
  # higher the rarity goes: Epic is bold, Legendary and Mythical are bold
  # and italic, and the Divine takes all three with underline on top.
  # Strikethrough is supported and left off, because a struck out name
  # reads as something that was cancelled.
  #
  # The weight goes on every drop of the rarity, not just its label, and
  # from Epic up the drop's own colour gets the rarity's colour woven
  # through it. `symbol: true` puts symbol-char on either side of the
  # name, everywhere: nametag, tab, chat. It used to be an obfuscated
  # flicker, which shoved the whole name about in tab and looked the same
  # on every rarity, so since V210 each rarity has a still mark of its own.
  # Any character works here, for example ◆ ✦ ✧ ❖ ✪ ✯ ✵ ❂ ★ ☆ ⚝.
  EPIC:
    colors: ["&5"]
    symbol: true
    symbol-char: "◆"
    bold: true
    luck-factor: 0.6
    luck-exponent: 1.0
    true-odds: true
  LEGENDARY:
    colors: ["&6"]
    symbol: true
    symbol-char: "✦"
    bold: true
    italic: true
    luck-factor: 1.0
    luck-exponent: 1.15
    true-odds: true
  MYTHICAL:
    colors: ["&c"]
    symbol: true
    symbol-char: "❖"
    bold: true
    italic: true
    luck-factor: 1.6
    luck-exponent: 1.3
    true-odds: true
  # Divine sits above everything. Its label is the palest thing in the
  # plugin without ever being pure #FFFFFF - a drop name renders beside a
  # player name in the tab list, and white-on-white is unreadable.
  DIVINE:
    colors: ["#FFFDF7", "#FFF0B8", "#FFFFFA", "#DCEFFF", "#FFFDF7"]
    symbol: true
    symbol-char: "★"
    bold: true
    italic: true
    underline: true
    luck-factor: 2.5
    luck-exponent: 1.16
    true-odds: true
  # V319: Astral, the tier above Divine, Leon's pick. Galaxy is
  # deliberately not used; he is keeping it for the tiers after this one.
  #
  # Divine already owns pale, so Astral goes the other way: a saturated
  # violet running through cyan, which reads as further away rather than
  # brighter. Still nothing near pure white, because a drop name renders
  # beside a player name in the tab list.
  ASTRAL:
    colors: ["#D0A2FF", "#B388FF", "#80D8FF", "#B388FF", "#D0A2FF"]
    symbol: true
    symbol-char: "✵"
    bold: true
    italic: true
    underline: true
    luck-factor: 3.5
    luck-exponent: 1.24
    true-odds: true

