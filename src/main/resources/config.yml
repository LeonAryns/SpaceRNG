# Floating heads on a leaderboard. Place them in game:
#   /rngadmin tophead podium farming_total   (#1, #2, #3 around you)
#   /rngadmin tophead set farming_total 1    (one rank, at your eyes)
# Spots live in topheads.yml. The heads are never saved into the world, so
# removing the plugin can never leave any behind.
top-heads:
  refresh-seconds: 30
  spin-degrees-per-second: 45
  bob-height: 0.12
  # 1.5 is roughly a real head's size and a half.
  scale: 1.5
  # How far under the head the name and score float.
  label-drop: 1.0
  show-label: true
  # Two small sparks orbiting whoever is #1.
  sparkle-first: true
  # 1.0 is vanilla render distance for display entities.
  view-range: 1.0

consumables:

  # The Global Boss Respawn. Bought, then right clicked, and everybody
  # online gets their own copy of the boss to fight. It is the one
  # consumable whose effect lands on people who did not buy it, which is
  # the whole point of selling it. Using one while a boss is already out
  # gives the item back rather than burning it.
  boss_summoner:
    display: "Boss Summoner"
    material: DRAGON_BREATH
    colors: ["#FF8A80", "#D50000"]
    boss-summons: 1
    description: "Calls a boss for the whole server, right now."
  # ---- Draughts ----
  # Additive Luck and Speed, counted down in ROLLS rather than minutes.
  # `luck: 0.5` is +50% flat, joining the same pile the skill tree and
  # armor feed; `speed: 10` is +10 on the 100 scale. Both can go negative,
  # and the ones that do are the interesting ones: the trade IS the item.
  #
  # V351: `luck-multi: 0.25` is +25% of everything you already have, and
  # V352 `speed-multi: 0.25` the same for Speed. That is the only shape
  # that still means anything at a million percent Luck, so the six at
  # the end of this block carry it and every other draught stays a flat
  # number. They cost Mythical, Divine and Astral drops, one each.
  #
  # Only one draught runs at a time. A second replaces the first, so a
  # minus column can't be dodged by drinking something else on top of it.
  draught_steady:
    display: "Steady Draught"
    material: POTION
    colors: ["#B9F6CA", "#00C853"]
    luck: 0.50
    speed: 10
    rolls: 100
    description: "The long-haul option. Nothing spectacular, nothing lost."
    costs:
      UNCOMMON: 30
      RARE: 6
  draught_swift:
    display: "Swift Draught"
    material: POTION
    colors: ["#FFF59D", "#FFB300"]
    luck: 0.10
    speed: 50
    rolls: 60
    description: "Half again as many rolls an hour. Barely luckier."
    costs:
      UNCOMMON: 45
      RARE: 8
  draught_deep:
    display: "Deep Draught"
    material: POTION
    colors: ["#B39DDB", "#5E35B1"]
    luck: 1.00
    speed: -10
    rolls: 50
    description: "Slower, and much luckier for it."
    costs:
      RARE: 14
      EPIC: 2
  draught_surge:
    display: "Surge Draught"
    material: POTION
    colors: ["#FF8A80", "#D50000"]
    luck: 2.50
    speed: -25
    rolls: 10
    description: "Ten rolls that matter. You will feel every second of them."
    costs:
      RARE: 20
      EPIC: 5
  # V352, Leon's ladder: the last three Luck draughts and the last three
  # Speed draughts multiply what you already have, and nothing else does.
  # 1.2x costs Mythical, 1.5x costs Divine, 2x costs Astral, so the shelf
  # ends where the drop table does.
  draught_prism:
    display: "Prism Draught"
    material: POTION
    colors: ["#CE93D8", "#8E24AA"]
    luck-multi: 0.2
    rolls: 150
    description: "A fifth more Luck than you already have, whatever that is."
    costs:
      MYTHICAL: 1
  draught_quasar:
    display: "Quasar Draught"
    material: POTION
    colors: ["#B388FF", "#651FFF"]
    luck-multi: 0.5
    rolls: 100
    description: "Half your Luck again, for a hundred rolls."
    costs:
      DIVINE: 1
  draught_singularity:
    display: "Singularity Draught"
    material: POTION
    colors: ["#FF80AB", "#C51162", "#6A1B9A"]
    luck-multi: 1.0
    rolls: 50
    description: "Twice your Luck. Fifty rolls to spend it on."
    costs:
      ASTRAL: 1
  draught_flux:
    display: "Flux Draught"
    material: POTION
    colors: ["#FFF59D", "#FBC02D"]
    speed-multi: 0.2
    rolls: 150
    description: "A fifth more Speed than you already roll at."
    costs:
      MYTHICAL: 1
  draught_warp:
    display: "Warp Draught"
    material: POTION
    colors: ["#FFE082", "#FF8F00"]
    speed-multi: 0.5
    rolls: 100
    description: "Half your Speed again, for a hundred rolls."
    costs:
      DIVINE: 1
  draught_lightspeed:
    display: "Lightspeed Draught"
    material: POTION
    colors: ["#E1F5FE", "#29B6F6", "#FFFFFF"]
    speed-multi: 1.0
    rolls: 50
    description: "Twice your Speed. Hold on to something."
    costs:
      ASTRAL: 1
  draught_greater:
    display: "Greater Draught"
    material: POTION
    colors: ["#A7FFEB", "#00BFA5", "#1DE9B6"]
    luck: 1.50
    speed: 25
    rolls: 25
    description: "No downside, and priced like it."
    costs:
      EPIC: 10
      LEGENDARY: 2

  # ---- Farm boosts ----
  # These stay on a clock, because a farm run isn't measured in rolls.
  coin_potion:
    display: "Coin Potion"
    material: POTION
    colors: ["#FFE082", "#FF8F00"]
    coin-multiplier: 2.0
    duration-seconds: 1800
    description: "Every crop pays double."
    costs:
      UNCOMMON: 30
      RARE: 6
  enchant_potion:
    display: "Enchant Potion"
