    material: HEART_OF_THE_SEA
    colors: ["#7FE7FF", "#00B0FF"]
    description: "Kept for you in /novacore, not in your inventory.\nSpend one there for a shot at the next tier.\nEvery tier multiplies your Luck, Money and Coins.\nMiss and you fall back to your last checkpoint."
