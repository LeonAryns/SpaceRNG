      cost-money: 82700
      requires: "growth_1"
      requires-all: ["enchant_momentum", "gems_1"]
      effect: "UNLOCK_CROP"
      value: 0
      target: "CARROTS"

    yield_carrots:
      display: "Carrot Yield"
      page: 1
      slot: "5,1"
      icon: "COMPOSTER"
      cost-money: 44600
      cost-growth: 1.25
      requires: "crop_carrots"
      effect: "CROP_YIELD"
      value: 0.12
      max-level: 10
      target: "CARROTS"

    yield_wheat_2:
      display: "Wheat Yield II"
      page: 1
      slot: "4,2"
      icon: "COMPOSTER"
      cost-money: 44600
