# /index — every unique item a player has ever rolled gets logged here.
# Each item carries its own Luck MULTIPLIER, derived automatically from
# its odds within its rarity: the rarest item in a tier gets the top of
# that tier's band, the most common gets the bottom, everything else
# scales linearly between them.
#
# Discovering an item adds its (multiplier - 1) to your index bonus, so
# your total is 1 + the sum of everything you've found. Rare finds move
# the needle far more than common ones.
index:
  luck-multipliers:
    COMMON: [1.0, 1.1]
    UNCOMMON: [1.1, 1.25]
    RARE: [1.25, 1.5]
    EPIC: [1.5, 2.0]
    LEGENDARY: [2.0, 3.0]
    MYTHICAL: [3.0, 5.0]

# How many points ("Credits") a single item of each rarity is worth
# when converted via /convert.
# Legacy: /convert now banks a stored drop of the item's own rarity
# instead of paying Credits, so nothing reads these any more. Kept so the
# values aren't lost if a Credit payout ever comes back.
conversion:
  points-per-rarity:
    COMMON: 1
    UNCOMMON: 5
    RARE: 25
    EPIC: 150
    LEGENDARY: 1000
    MYTHICAL: 10000

# Every roll also pays out real Coins (the Vault economy), on top of the
# item itself - coins = odds x this multiplier, so a 1-in-30 item pays 300
# at the default 10x. Requires Vault + an economy plugin to be installed.
economy:
  money-per-odds-multiplier: 10.0

# The general skill tree. Four pages, all the same shape: a root at the
# bottom of the middle column, a spine across row 5, three lines climbing
# at columns 2, 5 and 8, and a crown along row 1. Each page's capstone at
# (5,1) is the requirement for the next page's root, so the four pages are
# one ladder rather than four menus.
#
# Luck, Speed and Coins deliberately recur once or twice a page. A skill
# you already understand showing up again, stronger and further out, is
# what makes depth in the tree feel like it's worth something.
#
# "requires" is the id of the node that must be unlocked first (blank =
# no requirement). "effect" tells the plugin what the node does and
# "value" is its magnitude, per level for a leveled node. "cost-growth"
# multiplies the price after each level (1.25 = each level costs 25% more).
# "page" is which page the node is drawn on, 1-indexed. Slot is
# (column, row), both 1-indexed, in the 6x9 grid.
#
# Prices are a first pass: page base x 1.75 per step of depth, so a page
# spans roughly 480x from its root to its capstone, and each page starts
# 1000x above the last.
skilltree:
  # Slots that belong to the tree's silhouette on every page even when no
  # node sits there. Drawn as "???" so the shape of what's still to come
  # is visible from the first time the menu is opened.
  reserved: ["2,1", "3,1", "4,1", "5,1", "6,1", "7,1", "8,1",
             "2,2", "5,2", "8,2",
             "2,3", "5,3", "8,3",
             "2,4", "5,4", "8,4",
             "2,5", "3,5", "4,5", "5,5", "6,5", "7,5", "8,5",
             "5,6"]
  # One more page than there are populated ones, so there is always
  # visible room to grow.
  pages: 5
  page-names: ["Foundations", "Ascension", "Convergence", "Singularity", "Uncharted"]
  nodes:

