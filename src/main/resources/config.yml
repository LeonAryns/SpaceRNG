  # ---- Blast Harvest ----
  # The radius one detonation sweeps. It has to scale far more slowly than
  # the enchant's level does: at the old one-per-three-levels, a maxed hoe
  # would clear a 669-block-wide square in a single click.
  blast:
    base-radius: 1
    levels-per-radius: 150
    max-radius: 7

  # ---- Momentum ----
  # A farming RUN. Every crop you take adds to it, and the whole thing is
  # gone if you stop for longer than idle-seconds - the boss bar across the
  # top IS the run, so there's never any doubt what you're sitting on.
  #
  # It's the one farm bonus you can't buy outright: the enchant only raises
  # the ceiling, and the field is what fills it.
  momentum:
    # Added to the multiplier for every 1,000 crops in the current run.
    per-thousand-crops: 0.01
    # The ceiling, per level of the Momentum enchant. At the starting cap
    # of 100 levels that's a +5.00x ceiling.
    #
    # Reaching a +5.00x ceiling at 0.01 per thousand takes 500,000 crops in
    # one run. Set per-thousand-crops to 0.10 if you want that to be
    # 50,000 instead.
    per-level-cap: 0.05
    # Seconds without a harvest before the run ends.
    idle-seconds: 30
    # After you stop swinging, the multiplier slides from wherever it got
    # to down to nothing over this many seconds, with the bar still up.
    # Stopping should be a decision with a visible cost, not a switch.
    decay-seconds: 60

  # ---- Hoe tiers ----
  # The Tool Upgrade nodes in /farmtree walk the hoe up this list. A tier
  # is a flat bonus on the hoe itself rather than an enchant: it shows in
  # the Information block, not the Enchants one, because it's what the tool
  # IS rather than something bolted onto it.
  #
  # The hoe is always a wooden hoe. A tier has no name and no material of
  # its own - it is simply the Roman numeral of its position in this list,
  # so "Farmer's Hoe [IV]" is the fourth entry below and adding a seventh
  # entry gives you a [VII] with no other change. Order matters; nothing
  # else about an entry does.
  hoe-name: "Farmer's Hoe"
  # The tier ladder is generated from this shape rather than listed out.
  # Seventy hand-written entries would be seventy chances to mistype one,
  # and retuning the curve would mean editing every line.
  #
  # bands             how many rarities the ladder walks, from Common up.
  #                   5 stops at Legendary, on purpose: nothing at the top
  #                   of this ladder should need a drop nobody will see.
  # tiers-per-band    tiers bought with each of those rarities
  # cost-step         the first tier in a band costs this many drops, the
  #                   second twice that, and so on: 2, 4, 6 ... 20
  # blend-from        from this tier in a band, the price also asks for 1,
  #                   2, 3 of the NEXT rarity, so moving up a band is a
  #                   slope rather than a wall. The final band never
  #                   blends.
  # coin-bonus-step   a tier in band N is worth N times this. Common tiers
  #                   are +1% Coins each, Legendary tiers +5%. Ten of each
  #                   across five bands comes to +150% at the top.
  # coin-bonus-step   also the tier MULTIPLIER: a tier reads as 1.14x
  #                   Coins rather than +14%, so it can be compared with
  #                   every other multiplier a player owns.
  # proc-share        enchant proc per tier, as a fraction of the Coin
  #                   step. Set it to 0 for a purely Coins ladder.
  #
  # Tier I is the hoe you are handed and grants nothing, so the ladder is
  # 50 bought tiers on top of it.
  hoe-ladder:
    bands: 5
    tiers-per-band: 10
    cost-step: 2
    coin-bonus-step: 0.01
    # Enchant proc climbs far slower than Coins, because it lifts every
    # enchant at once: the same step would be worth many times more.
    proc-share: 0.04
    blend-from: 8

  # ---- Sounds ----
  # Both can be switched off per player in the hoe menu.
  sounds:
    harvest: BLOCK_CROP_BREAK
    harvest-pitch: 1.4
    enchant-proc: BLOCK_AMETHYST_BLOCK_CHIME
    enchant-proc-pitch: 1.7

# Levels are earned by rolling; prestiging resets your level for a
# permanent Luck *multiplier* (applied on top of every other Luck source).
prestige:
  # Points awarded per ascend, spent on the upgrades below. Points are the
  # part of prestige the player chooses how to use, which is what makes
  # prestiging a decision rather than a button.
  points-per-prestige: 1
  # Slot is "column,row", 1-indexed, in a 6x9 menu.
  upgrades:
    lucky_star:
      display: "Lucky Star"
      icon: NETHER_STAR
      slot: "3,2"
      effect: LUCK_BONUS
      per-level: 0.03
      unit: "x"
      max-level: 50
      cost-points: 1
    token_master:
      display: "Coin Master"
      icon: RAW_GOLD
      slot: "5,2"
      effect: TOKEN_BONUS
      per-level: 0.02
      unit: "x"
      max-level: 60
      cost-points: 1
    gold_rush:
      display: "Gold Rush"
      icon: GOLD_INGOT
      slot: "7,2"
      effect: MONEY_BONUS
      per-level: 0.025
      unit: "x"
      max-level: 50
      cost-points: 1
    shard_seeker:
      display: "Gem Seeker"
      icon: PRISMARINE_CRYSTALS
      slot: "4,4"
      effect: SHARD_BONUS
      per-level: 0.008
      unit: "%"
      max-level: 40
      cost-points: 2
    nova_touch:
      display: "Nova Touch"
      icon: HEART_OF_THE_SEA
      slot: "6,4"
      effect: NOVA_ODDS
      per-level: 0.008
      unit: "%"
      max-level: 25
      cost-points: 3
  rolls-per-level: 50
  # Each level costs this much more than the one before it. At 1.0 the
  # ladder is flat and level 50 costs what level 2 did, which turns
  # levelling into a formality rather than a climb.
  level-cost-growth: 1.15
  first-prestige-levels: 10
  levels-increment-per-prestige: 5
  luck-multiplier-per-prestige: 0.10

# /armor - sets bought with rolled drops. Each worn piece grants its
# tier's Luck bonus and a smaller Speed bonus (speed-bonus 0.01 = +1
# Speed, where 100 Speed is the baseline roll speed).
# /armor - pieces are bought ONE AT A TIME, not as a set. Each cost below
# is the price of a single piece, so a full 4-piece set costs four times
# what's listed. Every piece grants its tier's Luck and Speed while worn,
# independently - mixing tiers across slots is fine and a lone pair of
# boots still pays out.
#
# speed-bonus 0.05 = +5 Speed, where 100 Speed is the baseline roll speed.
armor:
  tiers:
    LEATHER:
      display: "Leather"
      costs:
        COMMON: 10
        UNCOMMON: 1
      luck-bonus: 0.25
      speed-bonus: 0.05
    CHAINMAIL:
      display: "Chainmail"
      costs:
        COMMON: 25
        UNCOMMON: 5
      luck-bonus: 0.45
      speed-bonus: 0.08
    IRON:
      display: "Iron"
      costs:
        UNCOMMON: 25
        RARE: 5
      luck-bonus: 0.70
      speed-bonus: 0.12
    GOLD:
      display: "Gold"
      costs:
        UNCOMMON: 50
        RARE: 10
      luck-bonus: 1.05
      speed-bonus: 0.16
    DIAMOND:
      display: "Diamond"
      costs:
        RARE: 25
        EPIC: 5
      luck-bonus: 1.60
      speed-bonus: 0.20
    NETHERITE:
      display: "Netherite"
      costs:
        RARE: 50
        EPIC: 10
      luck-bonus: 2.50
      speed-bonus: 0.25

# Rarity tiers, in ascending order. "luck-factor" controls how strongly
# the Luck stat biases rolls toward this tier. 0 = luck has no effect.
# Effective weight = base weight * (1 + luck * luck-factor)
rarities:
  # Rarities are just a plain label color now - the fancy gradients live
  # on each individual item instead (see the per-item "colors" below).
  # "symbol: true" wraps that rarity's item names in an obfuscated flair
  # character on both sides (Epic and up).
  #
  # Common, Uncommon and Rare labels are friendly rather than literal: the
  # band as a whole lands on its `share` of all rolls, and the labels only
  # decide which item inside the band wins. Money pays on the label, so a
  # friendly label also keeps the early economy where it was. Epic and up
  # set `true-odds`, and there the number on the item is the real chance.
  COMMON:
    colors: ["&7"]
    luck-factor: 0.0
    share: 0.945
  UNCOMMON:
    colors: ["&a"]
    luck-factor: 0.15
    share: 0.050
  RARE:
    colors: ["&9"]
    luck-factor: 0.35
    share: 0.003
  EPIC:
    colors: ["&5"]
    symbol: true
    luck-factor: 0.6
    true-odds: true
  LEGENDARY:
    colors: ["&6"]
    symbol: true
    luck-factor: 1.0
    true-odds: true
  MYTHICAL:
    colors: ["&c"]
    symbol: true
    luck-factor: 1.6
    true-odds: true
  # Divine sits above everything. Its label is the palest thing in the
  # plugin without ever being pure #FFFFFF - a drop name renders beside a
  # player name in the tab list, and white-on-white is unreadable.
  DIVINE:
    colors: ["#FFFDF7", "#FFF0B8", "#FFFFFA", "#DCEFFF", "#FFFDF7"]
    symbol: true
    bold: true
    luck-factor: 2.5
    true-odds: true

