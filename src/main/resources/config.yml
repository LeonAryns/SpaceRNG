    # to date with V303 to V306)
    changelog2:
      title: "Changelog, 3 October (part 2)"
      color: "#C77DFF"
      description: "More changes from today."
      fields:
        - name: "Rolling"
          value:
            - "- The big reveal only plays when a drop was really rare for you (1 in 1,000 or rarer at your Luck), so Auto Roll keeps going"
            - "- A rarity you have rolled 10 times plays a smaller, faster reveal"
            - "- Drop announcements: the best drop every 2 minutes, plus how many more of that tier were found"
            - "- Luck shows in K and M"
            - "- Shiny Firsts are now a top 10"
            - "- Rarities are 5x apart from Rare up, so every tier is a real step"
          inline: false
        - name: "Progression"
          value:
            - "- Each prestige needs 1 more level than the last, not 5"
            - "- Finishing an index tier gives 1.1x Luck for Common up to 2x for Divine, a shiny tier 3x"
            - "- Battle Pass XP lowered for rare drops"
            - "- Respec can spend shinies you have not converted, and Convert all converts shinies too"
            - "- Locked skills show their name and the page of what they need"
            - "- The Speed enchant is the second unlock in /farmtree and the second enchant on the hoe"
          inline: false
        - name: "Server"
          value:
            - "- 2x Luck for everyone when enough players are online, chat tells you how many more it takes"
            - "- Your prestige shows after your name in tab, like in chat"
            - "- A bigger announcement when someone gets a rank"
            - "- Rolled drops can no longer be worn"
            - "- Crates no longer give rolled drops"
            - "- Armor is built piece by piece and costs much more, Netherite needs Mythicals. Old armor was taken back"
            - "- /online <player> here in Discord shows if someone is playing"
          inline: false
        - name: "Fixes"
          value:
            - "- Fixed an item duplication bug in /pv"
            - "- The level card shows the right number of rolls to go"
          inline: false
      footer: "Feedback? Tell us in Discord."
    # V295: /rngadmin discord post changelog changelog
    changelog:
      title: "Changelog, 3 October"
      color: "#C77DFF"
      description: "Everything that changed since last night."
      fields:
        - name: "Rolling"
          value:
            - "- Drop announcements every 2 minutes, only the best tier found in that time"
            - "- Hover a name in chat to see their stats, click it for their /stats"
            - "- Roll sounds are for you only, people nearby hear a quiet version"
            - "- One charged roll at a time, 10x or 100x"
            - "- Finishing an index rarity gives 2x Luck, a shiny one 5x"
            - "- Shiny Firsts, the first 5 players to roll a shiny"
          inline: false
        - name: "Farming"
          value:
            - "- New Speed enchant, and every enchant and its messages can be switched off"
            - "- Enchants retuned, TNT Blast is now a round blast"
            - "- Crops open by crops farmed, free. Fern is the last crop"
            - "- Coin income lowered at the sources"
            - "- Several potions at once, see /boosters"
          inline: false
        - name: "Quality of life"
          value:
            - "- Crate keys are a count over each crate, no longer an item"
            - "- New: /trash, /discord, /boosters"
            - "- Tab in two columns, sorted by index tag and rank, with your prestige"
            - "- Crate openings are private, level ups show on the boss bar"
            - "- Armor never breaks, items can no longer be dropped"
          inline: false
        - name: "Secret Realm"
          value:
            - "- Open to everyone, for 15 minutes, at least 2 hours apart"
            - "- Every secret has its own odds, Secret Seeker in /prestige raises them"
          inline: false
        - name: "Fixes"
          value:
            - "- Levels after a prestige need new rolls"
            - "- A Mythical reveal can no longer lose the drop"
            - "- Auto Roll keeps going when the Starforge moves to the off hand"
          inline: false
      footer: "Feedback? Tell us in Discord."
    server:
      title: "SpaceRNG"
      color: "#C77DFF"
      description:
        - "**SpaceRNG** is a persistent RNG game: roll drops, farm the field,"
        - "climb the trees and keep everything you find. Nothing ever resets."
      fields:
        - name: "What you do"
          value:
            - "**Roll** for drops from Common to Divine, and hunt shinies"
            - "**Farm** the shared field with a hoe you upgrade yourself"
            - "**Bosses** every couple of hours, everyone fights their own"
          inline: false
        - name: "Java IP"
          value: "`spacerng.minehut.gg`"
          inline: true
        - name: "Bedrock"
          value: "`spacerng.bedrock.minehut.gg` port `19132`"
