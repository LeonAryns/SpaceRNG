# ============================================
# Starting guide (/guide)
# ============================================
# A single ordered run that walks a new player through every system, with
# the current step on a boss bar. Linear on purpose: a grid of optional
# objectives is a checklist, a queue of one thing is a tutorial.
#
# Progress is READ from live state, never counted here, so steps can be
# reordered or rewritten without resetting anybody - and a player who
# already did something is credited for it the moment they log in.
#
# goal is one of:
#   ROLLS DISCOVERIES SKILL_NODES HAS_NODE TAG_EQUIPPED BANKED_DROPS
#   STARFORGE_TIER ARMOR_PIECES CROPS_HARVESTED NOVA_TIER
#   MILESTONES_CLAIMED LEVEL PRESTIGE
# HAS_NODE uses "target" for the node id.
guide:
  # Handed over when the last guide step is done. A free skill node is
  # worth most to somebody who saves it for something they cannot afford,
  # so it is deliberately not tied to a particular node.
  completion-free-skills: 1
  # A drop handed over on finishing a named step. The Basic Starforge
  # costs an Uncommon, which is rare enough early that a new player can
  # stall with nothing to do about it.
  # Nova Cores handed over the moment a player REACHES a named step, so
  # the step that asks for a forge comes with the Core to forge with.
  free-nova:
    nova_core: 1
  guaranteed-drop:
    starforge_upgrade: UNCOMMON
  # Every step of the guide hands over one voucher and nothing else. The
  # guide teaches the game; paying it in Coins made it a farming route.
  free-skills-per-step: 1
  quests:
    - id: first_rolls
      display: "Roll 10 times"
      hint: "Right-click your Starforge to roll."
      goal: ROLLS
      amount: 10
    - id: first_index
      display: "Discover 5 different drops"
      hint: "Every new drop is logged in /index."
      goal: DISCOVERIES
      amount: 5
    - id: auto_roll
      display: "Unlock Auto Roll"
      hint: "Open /skilltree and buy the root skill, then left-click your Starforge."
      goal: HAS_NODE
      target: auto_roll_root
      amount: 1
    - id: first_luck
      display: "Buy your first Luck level"
      hint: "Luck sits directly above Auto Roll in /skilltree."
      goal: HAS_NODE
      target: luck_skill
      amount: 1
    - id: convert_drops
      display: "Store 25 drops in /convert"
      hint: "Drop rolled items into /convert - stored drops buy armor and Starforges."
      goal: BANKED_DROPS
      amount: 25
    - id: starforge_upgrade
      display: "Upgrade your Starforge"
      hint: "Spend stored drops in /starforge to raise your base Luck."
      goal: STARFORGE_TIER
      amount: 1
    - id: equip_tag
      display: "Equip a tag"
      hint: "Click any discovered drop in /index to wear it and take its multiplier."
      goal: TAG_EQUIPPED
      amount: 1
    - id: armor_unlock
      display: "Unlock the armor shop"
      hint: "Buy Armor in /skilltree, right after Money I."
      goal: HAS_NODE
      target: armor_unlock
      amount: 1
    - id: first_armor
      display: "Buy an armor piece"
      hint: "/armor sells pieces one at a time - every worn piece adds Luck and Speed."
      goal: ARMOR_PIECES
      amount: 1
    - id: farming_unlock
      display: "Unlock farming"
      hint: "Buy Farming in /skilltree, right after Armor, to get the Farmer's Hoe."
      goal: HAS_NODE
      target: farming_unlock
      amount: 1
    - id: first_harvest
      display: "Harvest 50 crops"
      hint: "Break crops on the farm. Pick what grows for you with /crops."
      goal: CROPS_HARVESTED
      amount: 50
    - id: farm_skills
      display: "Buy your first farming skill"
      hint: "/farmtree is a whole second tree - crops, hoe enchants and Token multipliers."
      goal: HAS_NODE
      target: growth_1
      amount: 1
    - id: nova_core
      display: "Forge a Nova Core tier"
      hint: "Right click the Nova Core you were just given, or open /novacore."
      goal: NOVA_TIER
      amount: 1
    - id: claim_milestone
      display: "Claim a milestone reward"
      hint: "/milestones tracks the long game. Rewards wait there until you collect them."
      goal: MILESTONES_CLAIMED
      amount: 1
    - id: reach_level
      display: "Reach level 5 in /prestige"
      hint: "Rolling fills your level bar. Level up in /prestige."
      goal: LEVEL
      amount: 5
    - id: first_prestige
      display: "Prestige once"
      hint: "/prestige trades your level for a permanent Luck multiplier."
      goal: PRESTIGE
      amount: 1

# ============================================
# The join banner
# ============================================
# The player's own face, drawn in chat from their real skin, with these
# lines beside it. Paper hands the skin URL straight off the profile, so
# there's no Mojang API call to rate-limit; the PNG is fetched off the
# main thread once per session and cached.
#
# Eight lines sit level with the face. A ninth and beyond continue
# underneath it, and fewer than eight is fine.
#
# {player} and {online} are replaced. Colour codes use "&".
# /rngadmin welcome replays it without rejoining.
welcome:
  enabled: true
  # A moment after joining, so it lands under the join spam rather than
  # above it where it scrolls away unread.
  delay-ticks: 20
  # Shown to somebody who has played here before.
  lines:
    - "&d&l✦ WELCOME BACK &d&l✦"
    - "&8&lBETA"
    - ""
    - "&d| &fType &d/shop &fto see every shop."
    - "&d| &fType &d/guide &fif you're new."
    - "&d| &fType &d/buy &fto support us."
    - ""
    - "&8&nSPACERNG.MINEHUT.GG"
  # Shown on somebody's very first join instead. Leave the list empty to
  # give everyone the same banner.
  first-join-lines:
    - "&d&l✦ WELCOME &d&l✦"
    - "&8&lBETA"
    - ""
    - "&d| &fRight-click your &dRoll &fitem to start."
    - "&d| &fType &d/guide &fand it'll walk you through."
    - "&d| &fType &d/shop &fwhen you've got something to spend."
    - ""
    - "&8&nSPACERNG.MINEHUT.GG"

# ============================================
# Consumables (potions, charges, permanent grants)
# ============================================
# Redeemable items handed out by /milestones, the Battle Pass, crates and
# /rngadmin. They're real items rather than an invisible balance on
# purpose: a reward you can hold and choose when to use is worth more than
# the same number applied silently, and it means a crate plugin can hand
# out the same thing this plugin does without knowing anything about it.
#
# Give one from anywhere with:
#   /rngadmin consumable <id> [amount] [player]
#
# effect:
#   LUCK            multiplies all Luck for duration-seconds
#   SPEED           multiplies roll Speed
#   TOKENS          multiplies Tokens from the farm
#   ENCHANT_PROC    multiplies every hoe enchant's chance
#   ROLL_CHARGE     banks `charges` rolls that fire at `magnitude` x Luck
#   PERMANENT_LUCK  adds `magnitude` Luck on the spot, forever
#
# Drinking a second potion of the same kind extends it if it's the same
# strength and replaces it if it's stronger - two never multiply together.
# Crates. Any block becomes one with /rngadmin crate set <crate> while you
# look at it; the coordinates live in crates.yml, not here.
#
# Left click previews, right click with a key opens, sneak and right click
# opens a whole stack at once without the spin.
#
# Rewards are weighted like the roll table. Every chance a player sees is
# worked out from these weights, so there is no percentage to keep in step
# by hand. One reward type per line:
#   coins / gems / money / credits: <amount>
#   consumable: <id>   (with amount: <n>)
#   drop: <RARITY>     (with amount: <n>; picks weighted like a real roll)
# Optional on any line: icon: <MATERIAL>, name: "&6Custom label"
#
# jackpot-below: a reward rarer than this share is announced to the whole
# server and gets the big finish.
crates:
  # V306: crates no longer give rolled drops; true puts them back.
  drop-rewards: false
  # A jackpot told to the whole server (V271: off, Leon's call).
  announce-jackpots: false
  # The reel: how many items pass, how long the QUICKEST step waits and
  # how much is added to the slowest one, both in ticks.
  #
  # fastest-gap-ticks is the one that was missing and the one that was
  # wrong. It used to be hard coded at 1, so the opening of every spin
  # pushed seventeen items past in the first second, which no eye reads
  # as a reel. At 3 it is six a second, and the cubic curve still crawls
  # to two thirds of a second on the last item. Together these are about
  # seven seconds; drop spin-steps to shorten the whole thing without
  # touching how readable it is.
  spin-steps: 24
  fastest-gap-ticks: 3
  slowest-gap-ticks: 12
  # The most keys one sneak click opens. V322: 500, Leon's call that a
  # shift click opens all of them. It is a safety ceiling on one tick of
  # work, not a feature; raise it if anybody ever sits on more.
  quick-open-max: 500
  types:
    farm:
      display: "Farm Crate"
      colors: ["#FFE082", "#FF8F00"]
      key: crate_key
      key-source: "Farm Keys are dug up by the Key Finder enchant on your hoe."
      # The text over this crate when it's placed with /rngadmin crate place.
      description:
        - "<white>Right click opens one"
        - "<white>Shift right click opens all"
        - "<gray>Left click shows the rewards"
      jackpot-below: 0.03
      rewards:
        - { weight: 30, coins: 25000 }
        - { weight: 18, gems: 50 }
        - { weight: 14, money: 50000 }
        - { weight: 12, coins: 100000 }
        - { weight: 10, consumable: coin_potion }
        - { weight: 8, consumable: enchant_potion }
        - { weight: 8, consumable: luck_potion }
        - { weight: 8, drop: UNCOMMON, amount: 3 }
        - { weight: 10, consumable: nova_core, amount: 3 }
        - { weight: 2, drop: RARE }
        - { weight: 1.5, consumable: roll_10x }
        - { weight: 0.4, consumable: luck_5 }
        # V355, Leon: perks in the crates, at half a percent. It pays a
        # perk ROLL rather than a perk, because a perk is a single worn
        # slot and handing one over would replace the one being worn
        # without asking. The roll is spent in /perks.
        - { weight: 0.613, tickets: 1 }
    cosmic:
      display: "Cosmic Crate"
      colors: ["#E1BEE7", "#7C4DFF", "#40C4FF"]
      key: cosmic_key
      key-source: "Cosmic Keys come from the store."
      description:
        - "<white>Right click opens one"
        - "<white>Shift right click opens all"
        - "<gray>Left click shows the rewards"
      jackpot-below: 0.04
      rewards:
        - { weight: 25, coins: 250000 }
        - { weight: 18, gems: 250 }
        - { weight: 14, money: 500000 }
        - { weight: 16, consumable: nova_core, amount: 10 }
        - { weight: 8, consumable: roll_10x, amount: 3 }
        - { weight: 7, drop: RARE, amount: 2 }
        - { weight: 3, drop: EPIC }
        # V315: the middle crate pays 10 percent, Leon's ladder. It was
        # two entries, a 50 and a 250, and merging them keeps one line
        # per thing a crate can give.
        - { weight: 3, consumable: luck_10 }
        # V355, Leon: perks in the crates, at half a percent. It pays a
        # perk ROLL rather than a perk, because a perk is a single worn
        # slot and handing one over would replace the one being worn
        # without asking. The roll is spent in /perks.
        - { weight: 0.472, tickets: 1 }
    # Hand these out from a voting plugin with
    #   rngadmin crate key vote 1 %player%
    vote:
      display: "Vote Crate"
      colors: ["#B9F6CA", "#00C853"]
      key: vote_key
      key-source: "Vote Keys come from voting for the server."
      description:
        - "<white>Right click opens one"
        - "<white>Shift right click opens all"
        - "<gray>Left click shows the rewards"
      jackpot-below: 0.03
      rewards:
        - { weight: 30, coins: 50000 }
        - { weight: 18, money: 100000 }
        - { weight: 14, gems: 75 }
        - { weight: 10, consumable: luck_potion }
        - { weight: 10, consumable: speed_potion }
        - { weight: 8, drop: RARE }
        - { weight: 10, consumable: nova_core, amount: 3 }
        - { weight: 2, consumable: roll_10x }
        - { weight: 0.5, consumable: luck_5 }
        # V355, Leon: perks in the crates, at half a percent. It pays a
        # perk ROLL rather than a perk, because a perk is a single worn
        # slot and handing one over would replace the one being worn
        # without asking. The roll is spent in /perks.
        - { weight: 0.515, tickets: 1 }
    # Rank key alls and events:  rngadmin crate keyall nebula 1
    # Key Finder turns one up now and then as well.
    nebula:
      display: "Nebula Crate"
      colors: ["#80D8FF", "#448AFF", "#B388FF"]
      key: nebula_key
      key-source: "Nebula Keys come from key alls, events and the rare Key Finder find."
      description:
        - "<white>Right click opens one"
        - "<white>Shift right click opens all"
        - "<gray>Left click shows the rewards"
      jackpot-below: 0.035
      rewards:
        - { weight: 25, coins: 150000 }
        - { weight: 18, money: 250000 }
        - { weight: 14, gems: 150 }
        - { weight: 16, consumable: nova_core, amount: 5 }
        - { weight: 8, consumable: roll_10x, amount: 2 }
        - { weight: 8, drop: RARE, amount: 2 }
        - { weight: 2, drop: EPIC }
        # V315: the best crate pays a quarter, Leon's ladder, merged
        # from the old 50 and 250 entries.
        - { weight: 1.7, consumable: luck_25 }
        # V355, Leon: perks in the crates, at half a percent. It pays a
        # perk ROLL rather than a perk, because a perk is a single worn
        # slot and handing one over would replace the one being worn
        # without asking. The roll is spent in /perks.
        - { weight: 0.466, tickets: 1 }

# Floating text drawn by the plugin: panels over NPCs, live leaderboards
# with player heads, and the text over crates placed with
# /rngadmin crate place <crate> (hold the head the crate should be).
#   /rngadmin holo panel <panel>    stand where the NPC stands
#   /rngadmin holo board <board>    stand in front of where it should hang
#   /rngadmin holo remove [radius]  /rngadmin holo list
# Text is MiniMessage: <gold>, <#FFD54F>, <gradient:#A:#B>, <b> and so on.
# After editing, /rngadmin reload redraws everything. Spots live in
# holograms.yml; nothing is saved into the world.
    boss:
      display: "Boss Box"
      colors: ["#FF8A80", "#FF5252", "#D50000"]
      key: boss_box
      key-source: "Boss Boxes come from beating a boss, every couple of hours."
      description:
        - "<white>Right-click the box in your hand to open it"
        - "<gray>Left-click here to see what's inside"
      jackpot-below: 0.04
      rewards:
        - { weight: 24, credits: 5 }
        - { weight: 18, tickets: 1 }
        - { weight: 14, boost: LUCK, percent: 25, minutes: 30 }
        - { weight: 12, boost: MONEY, percent: 50, minutes: 30 }
        - { weight: 10, credits: 15 }
        - { weight: 8, tickets: 3 }
        - { weight: 6, boost: LUCK, percent: 50, minutes: 30 }
        - { weight: 4, boost: ENCHANT_PROC, percent: 40, minutes: 30 }
        - { weight: 2.5, credits: 40 }
        - { weight: 1.5, tickets: 8 }
        - { weight: 0.5, boost: LUCK, percent: 100, minutes: 20 }
        # Forever. A boss runs every couple of hours, so these are the
        # slow, permanent half of the box: about one box in nine pays one.
        - { weight: 4, permanent: LUCK, percent: 10 }
        - { weight: 3, permanent: SPEED, points: 10 }

holograms:
  view-range: 1.0
  title-scale: 2.4
  text-scale: 1.1
  # How far above the admin's feet a panel starts, clear of an NPC's head.
  panel-height: 2.3
  board-refresh-seconds: 60
  crate-head-scale: 2.6
  # How far the head floats above the crate block, how fast it turns and
  # how far it bobs.
  crate-head-lift: 0.15
  crate-spin-degrees: 45
  crate-bob: 0.12
  # The podium from /rngadmin holo leader: how big the three heads are,
  # how big its text is, and how far #2 and #3 stand from #1. The podium
  # has its own text size because it is read from across the spawn
  # rather than from in front of an NPC. The spacing is a minimum: the
  # plugin widens it on its own until the name tags cannot overlap.
  podium-head-scale: 6.0
  podium-text-scale: 3.2
  podium-spacing: 6.5
  click: "<#FFD54F>→→→</#FFD54F> <white>Click Here</white> <#FFD54F>←←←</#FFD54F>"
  panels:
    realm:
      title: "<gradient:#CFD8DC:#78909C><b>SECRET REALM</b></gradient>"
      lines:
        - "<white>Roll here for a <#B0BEC5>Secret</#B0BEC5>"
        - "<white>Secrets multiply your Luck"
        - "<gray>Luck and Speed do nothing here"
        - "<white>/secretrealm takes you in"
      # Nothing to click: the realm is entered with a command, so the
      # shared "Click Here" line would be a lie (V336).
      click: ""
    prestige:
      title: "<gradient:#FFE082:#FFB300><b>PRESTIGE</b></gradient>"
      lines:
        - "<white>Spend your money and levels"
        - "<white>on prestiges for <#FFD54F>multipliers</#FFD54F>"
    skilltree:
      title: "<gradient:#E1BEE7:#AB47BC><b>SKILL TREE</b></gradient>"
      lines:
        - "<white>Unlock <#CE93D8>Auto Roll</#CE93D8>, Luck, Speed"
        - "<white>and everything after it"
    shop:
      title: "<gradient:#FFE0B2:#FF9800><b>SHOPS</b></gradient>"
      lines:
        - "<white>Armor, Starforges, potions"
        - "<white>and the <#FFD54F>Store</#FFD54F>"
    farm:
      title: "<gradient:#DCEDC8:#8BC34A><b>FARMING</b></gradient>"
      lines:
        - "<white>Harvest crops for <#FFD54F>Coins</#FFD54F>"
        - "<white>and climb the <#AED581>farm tree</#AED581>"
      # Any panel can take these two. scale multiplies its size; an empty
      # click hides the "Click Here" line.
      scale: 2.0
      click: ""
    crates:
      title: "<gradient:#B3E5FC:#29B6F6><b>CRATES</b></gradient>"
      lines:
        - "<white>Open <#FFD54F>crates</#FFD54F> for amazing"
        - "<white>and unique rewards"
    armor:
      title: "<gradient:#B2EBF2:#00ACC1><b>ARMOR</b></gradient>"
      lines:
        - "<white>Buy armor with your drops"
        - "<white>for <#80DEEA>Luck</#80DEEA> and <#FFF59D>Speed</#FFF59D> while worn"
    starforge:
      title: "<gradient:#F3E5F5:#BA68C8><b>STARFORGE</b></gradient>"
      lines:
        - "<white>Forge a better Starforge"
        - "<white>for more <#CE93D8>base Luck</#CE93D8> on every roll"
    potion:
      title: "<gradient:#E1BEE7:#8E24AA><b>BREWING</b></gradient>"
      lines:
        - "<white>Brew potions of <#80DEEA>Luck</#80DEEA> and <#FFF59D>Speed</#FFF59D>"
        - "<white>from your own drops"
    convert:
      title: "<gradient:#C8E6C9:#43A047><b>CONVERT</b></gradient>"
      lines:
        - "<white>Turn loose drops into stored ones"
