boost:

  # Free 2x Luck when enough people are on at once.
  #
  # The paid ladder above rewards one person for spending. This rewards
  # everybody for turning up, which is the half a store item cannot buy,
  # and it gives a player a reason to log in now rather than later.
  #
  # The bar moves after every hit: whatever count set it off becomes the
  # floor for the next one, 30 percent more or min-step more, whichever
  # is larger. Without that the first busy evening would pay out every
  # couple of hours forever. After reset-hours with no boost the bar
  # falls back to start-threshold, so one good night does not leave the
  # server behind a number it never reaches again.
  crowd:
    enabled: true
    start-threshold: 20
    min-step: 5
    growth: 1.3
    # V301: an hour between free boosts (was 150 minutes).
    cooldown-minutes: 60
    # V307: fifteen minutes, and the banner links to /store to upgrade it.
    duration-minutes: 15
    # V308: the raised bar after a boost holds this long, then back to
    # start-threshold. 23 on gives 2x, then 30 is the goal for two hours.
    reset-hours: 2
    # V301: within this many players of the bar, chat says how many more
    # it takes, at most once every call-every-minutes.
    call-within: 5
    call-every-minutes: 10
  duration-seconds: 900
  base-cost-credits: 250
  cost-growth: 2.5
  max-level: 5

# The Nova Core ladder (/rngcookie). Each forge either climbs a tier or
# drops you to the last checkpoint, and every tier is worth a permanent
# Luck multiplier of 1 + tier * multiplier-per-tier.
#
# Odds of clearing tier T = base-chance * decay^T * (1 + luck), clamped.
# At 100% Luck that's ~95/95/95/92/78% for the first five tiers, so
# reaching checkpoint 1 is roughly a 62% run; by tier 20 the same player
# is at ~6% a step, which keeps the top of the ladder a real grind.
novacore:
  # V322: every forge is the same coin flip, Leon's call ("make every
  # novacore 50/50"). While this is above 0 it IS the chance, and
  # base-chance, decay, luck-weight, min/max-chance, the Nova Touch
  # prestige upgrade and first-forge-guaranteed below are all skipped.
  # Set it to 0 to bring the old tier curve back.
  flat-chance: 0.5
  max-tier: 100
  # The first checkpoint, and how much further apart each one after it
  # sits. V355: the gap grows by checkpoint-gap-growth rather than by one,
  # which is Leon's "every checkpoint a bit farther". At 5 and 2 the
  # checkpoints across a hundred tiers are
  #   5, 11, 19, 29, 41, 55, 71, 89
  # so the early ones come quickly and the last stretch is a real climb.
  first-checkpoint: 5
  checkpoint-gap-growth: 2
  # V355: every account's tier is mapped onto the new ladder once, by how
  # far up the old one it was, the first time it is seen. Raise
  # rescale-version and set rescale-from-max-tier to the length the ladder
  # had before, if it is ever re-cut again.
  rescale-version: 1
  rescale-from-max-tier: 30
  base-chance: 0.50
  # The very first forge a player ever makes always succeeds. The menu
  # still shows the real chance; only the result is guaranteed.
  first-forge-guaranteed: true
  decay: 0.85
  # How much Luck lifts the chance: the base chance times (1 + Luck x
  # luck-weight), capped at max-chance. The Luck is without the Nova
  # Core's own multiplier. V285: 0.1, Leon's call; at 1.0 any real Luck
  # pinned every tier at max-chance.
  luck-weight: 0.1
  # Shown in chat whenever somebody needs to know where Nova Cores come from.
  how-to-get: "crates, the Nova Finder enchant, /milestones and the /guide"
  min-chance: 0.02
  max-chance: 0.95
  # One entry per tier. This is a UNIVERSAL multiplier: it scales Luck,
  # the Money a roll pays and farm Coins together, so the ladder is worth
  # climbing whatever you are grinding.
  #
  # V355, Leon's call: a hundred tiers, and 25x at the top rather than
  # 120x. The ladder used to be thirty rungs that ran away with
  # themselves at the end; it is a hundred now and every rung is the same
  # proportional step, about 3.3%, from 1.02x at tier 1 to 25.00x at tier
  # 100. Long to climb, and the number at the end is one the rest of the
  # game can live beside.
  multipliers: [1.02, 1.05, 1.09, 1.12, 1.16, 1.20, 1.24, 1.28, 1.32, 1.36,
                1.41, 1.46, 1.50, 1.55, 1.60, 1.66, 1.71, 1.77, 1.82, 1.88,
                1.95, 2.01, 2.08, 2.14, 2.22, 2.29, 2.36, 2.44, 2.52, 2.60,
                2.69, 2.78, 2.87, 2.96, 3.06, 3.16, 3.26, 3.37, 3.48, 3.60,
                3.71, 3.84, 3.96, 4.09, 4.23, 4.37, 4.51, 4.66, 4.81, 4.97,
                5.13, 5.30, 5.47, 5.65, 5.84, 6.03, 6.23, 6.43, 6.65, 6.86,
                7.09, 7.32, 7.56, 7.81, 8.07, 8.33, 8.61, 8.89, 9.18, 9.48,
                9.79, 10.12, 10.45, 10.79, 11.15, 11.51, 11.89, 12.28, 12.68, 13.10,
                13.53, 13.97, 14.43, 14.91, 15.40, 15.90, 16.42, 16.96, 17.52, 18.10,
                18.69, 19.31, 19.94, 20.59, 21.27, 21.97, 22.69, 23.44, 24.21, 25.00]

# Shiny drops. A shiny is the same drop with a marker, an enchant glint
# and its own entry in /index - 1 in 100 rolls by default, so roughly one
# shiny per 100 of any given drop.
#
# It's gated on a skill node: until that's bought the chance simply
# doesn't exist, so a player never rolls one or sees a near-miss.
#
# Shinies are NEVER auto-converted by the normal per-rarity toggles -
# only by their own switch in /convert - and they bank separately.
# The Battle Pass (/pass). One XP bar, two reward tracks.
#
# XP comes from rolling and from farming, and a rarer roll is worth
# more, so the pass tracks how well you're playing rather than just how
# long - which is the point of tying it to this gamemode at all.
#
# Bump `season` to start a new one: every player's XP, premium status
# and claims reset the next time they open the menu. Nothing else is
# touched, so a season change is one number and a /rngadmin reload.
#
# Credits are the paid-store currency, so the FREE track never pays
# them. The premium track does - it was bought with Credits, and the
# five milestone payouts add back up to exactly the premium price, so
# finishing a season earns the next one.
pass:
  season: 1
  season-name: "Season I"
  premium-cost-credits: 1000
  # Credits on top of a level's own reward, by level. The premium track
  # already pays 1,000 over levels 10 to 50, its whole price back.
  credit-rewards:
    free: {10: 15, 20: 20, 30: 25, 40: 30, 50: 50}
  # The skill that unlocks the menu at all.
  node: "pass_unlock"
  xp:
    # XP per roll, by what the roll landed on.
    # V298: the whole pass is 250,000 XP, and a Mythical gave 100,000 of
    # it. Now a Divine is one level and the pass is climbed by playing.
    per-roll:
      COMMON: 10
      UNCOMMON: 20
      RARE: 50
      EPIC: 250
      LEGENDARY: 1000
      MYTHICAL: 2500
      DIVINE: 5000
      ASTRAL: 10000
