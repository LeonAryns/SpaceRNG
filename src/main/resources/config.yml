index:
  # Luck for every entry discovered, before any skill. Collecting is
  # supposed to BE progression, not just a prerequisite for a skill that
  # makes collecting progression.
  luck-per-discovery: 0.01
  luck-multipliers:
    COMMON: [1.0, 1.1]
    UNCOMMON: [1.1, 1.25]
    RARE: [1.25, 1.5]
    EPIC: [1.5, 2.0]
    LEGENDARY: [2.0, 3.0]
    MYTHICAL: [3.0, 5.0]
    DIVINE: [8.0, 8.0]

  # Finishing a whole rarity is worth a Luck multiplier on its own, and
  # they MULTIPLY with each other - completing every tier is the end of
  # the collection game, so it should feel like it.
  #
  # A rarity you've completed in shiny pays the bigger number INSTEAD of
  # the smaller one, not on top of it.
  #
  # Gated behind the same Index Luck skill the tag multiplier is: until
  # that's bought, the index is a collection log and nothing more.
  completion:
    per-rarity: 2.0
    per-shiny-rarity: 5.0

# How many points ("Credits") a single item of each rarity is worth
# when converted via /convert.
# Legacy: /convert now banks a stored drop of the item's own rarity
# instead of paying Credits, so nothing reads these any more. Kept so the
# values aren't lost if a Credit payout ever comes back.
conversion:
  # How many of each rarity the vault holds. Raised by Vault Space in
  # /skilltree. A vault with no lid is a second inventory with infinite
  # slots, and there is no reason to ever spend what is in one.
  max-per-rarity: 100
  points-per-rarity:
    COMMON: 1
    UNCOMMON: 5
    RARE: 25
    EPIC: 150
    LEGENDARY: 1000
    MYTHICAL: 10000
    DIVINE: 250000

# Every roll also pays out real Money (the Vault economy), on top of the
# item itself - money = odds x this multiplier, so a 1-in-30 item pays 300
# at the default 10x. Requires Vault + an economy plugin to be installed.
economy:
  money-per-odds-multiplier: 10.0

# The general skill tree. Three pages, all the same shape: a root at the
# bottom of the middle column, a spine across row 5, three lines climbing
# at columns 2, 5 and 8, and a crown along row 1.
#
# A page's root demands the capstone of the page below AND the top of all
# three of its lines (requires-all). You can't reach a new page having
# climbed one branch and ignored the other two.
#
# Luck, Speed and Coins deliberately recur once or twice a page, and every
# recurrence of a skill keeps the same icon - a skill you already
# understand showing up again, stronger and further out, is what makes
# depth in the tree worth paying for.
#
# Anything about farming lives in the farming tree instead, and nothing
# here scales a fixed reward (daily streaks, milestones) - those pay the
# same to everyone by design.
#
# "requires" is the id of the node that must be unlocked first (blank =
# no requirement). "effect" tells the plugin what the node does and
# "value" is its magnitude, per level for a leveled node. "cost-growth"
# multiplies the price after each level (1.25 = each level costs 25% more).
# "page" is which page the node is drawn on, 1-indexed. Slot is
# (column, row), both 1-indexed, in the 6x9 grid.
#
# Prices are a first pass: page base x 1.75 per step of depth, each page
# starting 100x above the last. Paid in Money.
skilltree:
  # Three paths, one per page. No silhouette: each path has its own
  # organic shape and the page name is what tells you which one you're on.
  reserved: []
  pages: 3
  page-names: ["Money", "Speed", "Luck"]
  nodes:

