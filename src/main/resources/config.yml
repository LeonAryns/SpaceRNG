# ============================================
# SolRNG configuration
# ============================================

roll-item:
  material: NETHER_STAR
  name: "&d&lRoll"
  # No cooldown anymore — every roll takes this many seconds to resolve,
  # with an animation/progress bar while it's rolling. Skill tree /
  # armor upgrades will be able to speed this up later by raising a
  # player's roll-speed multiplier (already wired up, just nothing
  # grants it yet).
  roll-duration-seconds: 5

# Rarity tiers, in ascending order. "luck-factor" controls how strongly
# the Luck stat biases rolls toward this tier. 0 = luck has no effect.
# Effective weight = base weight * (1 + luck * luck-factor)
rarities:
  COMMON:
    color: "&f"
    luck-factor: 0.0
  UNCOMMON:
    color: "&a"
    luck-factor: 0.15
  RARE:
    color: "&9"
    luck-factor: 0.35
  EPIC:
    color: "&5"
    luck-factor: 0.6
  LEGENDARY:
    color: "&6"
    luck-factor: 1.0
  MYTHICAL:
    color: "&c"
    luck-factor: 1.6

# Every rollable item. "odds" = 1-in-X chance at 0 luck.
# Add as many items per rarity as you want.
