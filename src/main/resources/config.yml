# ============================================
# SolRNG configuration
# ============================================

roll-item:
  material: NETHER_STAR
  name: "&d&lRoll"
  # No cooldown anymore — every roll takes this many seconds to resolve,
  # with an animation/progress bar while it's rolling. Skill tree /
  # armor upgrades will be able to speed this up later by raising a
  # player's roll-speed multiplier (already wired up, just nothing
  # grants it yet).
  roll-duration-seconds: 5

# Rarity tiers, in ascending order. "luck-factor" controls how strongly
# the Luck stat biases rolls toward this tier. 0 = luck has no effect.
# Effective weight = base weight * (1 + luck * luck-factor)
rarities:
  COMMON:
    color: "&f"
    luck-factor: 0.0
  UNCOMMON:
    color: "&a"
    luck-factor: 0.15
  RARE:
    color: "&9"
    luck-factor: 0.35
  EPIC:
    color: "&5"
    luck-factor: 0.6
  LEGENDARY:
    color: "&6"
    luck-factor: 1.0
  MYTHICAL:
    color: "&c"
    luck-factor: 1.6

# Every rollable item. "odds" = 1-in-X chance at 0 luck.
# Add as many items per rarity as you want.
items:
  # --- Common ---
  - material: DIRT
    name: "Dirt"
    rarity: COMMON
    odds: 2
  - material: COBBLESTONE
    name: "Stone"
    rarity: COMMON
    odds: 4
  - material: OAK_LOG
    name: "Wood"
    rarity: COMMON
    odds: 6
  - material: GRAVEL
    name: "Gravel"
    rarity: COMMON
    odds: 8
  - material: SAND
    name: "Sand"
    rarity: COMMON
    odds: 12

  # --- Uncommon ---
  - material: COAL
    name: "Coal"
    rarity: UNCOMMON
    odds: 20
  - material: REDSTONE
    name: "Redstone"
    rarity: UNCOMMON
    odds: 35
  - material: LAPIS_LAZULI
    name: "Lapis Lazuli"
    rarity: UNCOMMON
    odds: 50
  - material: COPPER_INGOT
    name: "Copper"
    rarity: UNCOMMON
    odds: 65
  - material: IRON_INGOT
    name: "Iron"
    rarity: UNCOMMON
    odds: 80

  # --- Rare ---
  - material: GOLD_INGOT
    name: "Gold"
    rarity: RARE
    odds: 200
  - material: QUARTZ
    name: "Quartz"
    rarity: RARE
    odds: 350
  - material: AMETHYST_SHARD
    name: "Amethyst Shard"
    rarity: RARE
    odds: 500
  - material: EMERALD
    name: "Emerald"
    rarity: RARE
    odds: 650
  - material: PRISMARINE_CRYSTALS
    name: "Prismarine Crystals"
    rarity: RARE
    odds: 800

  # --- Epic ---
  - material: DIAMOND
    name: "Diamond"
    rarity: EPIC
    odds: 2000
  - material: ANCIENT_DEBRIS
    name: "Ancient Debris"
    rarity: EPIC
    odds: 3500
  - material: ENDER_EYE
    name: "Eye of Ender"
    rarity: EPIC
    odds: 5000
  - material: GOLDEN_APPLE
    name: "Enchanted Apple"
    rarity: EPIC
    odds: 6500
  - material: NAUTILUS_SHELL
    name: "Nautilus Shell"
    rarity: EPIC
    odds: 8000

  # --- Legendary ---
  - material: NETHERITE_INGOT
    name: "Netherite"
    rarity: LEGENDARY
    odds: 50000
  - material: NETHERITE_BLOCK
    name: "Netherite Block"
    rarity: LEGENDARY
    odds: 100000
  - material: BEACON
    name: "Beacon"
    rarity: LEGENDARY
    odds: 150000
  - material: TOTEM_OF_UNDYING
    name: "Totem of Undying"
    rarity: LEGENDARY
    odds: 200000
  - material: HEART_OF_THE_SEA
    name: "Heart of the Sea"
    rarity: LEGENDARY
    odds: 300000

  # --- Mythical ---
  - material: NETHER_STAR
    name: "Fallen Star"
    rarity: MYTHICAL
    odds: 1000000
  - material: DRAGON_EGG
    name: "Dragon Egg"
    rarity: MYTHICAL
    odds: 5000000
  - material: ELYTRA
    name: "Celestial Wings"
    rarity: MYTHICAL
    odds: 10000000

# /index — every unique item a player has ever rolled gets logged here.
# The first time they roll a brand new item, they get a small permanent
# Luck bonus on top of whatever the skill tree gives them.
index:
  luck-per-item: 0.01

# How many points ("Credits") a single item of each rarity is worth
# when converted via /convert.
conversion:
  points-per-rarity:
    COMMON: 1
    UNCOMMON: 5
    RARE: 25
    EPIC: 150
    LEGENDARY: 1000
    MYTHICAL: 10000

# Skill tree nodes. "requires" is the id of the node that must be
# unlocked first (blank = no requirement). "effect" tells the plugin
# what the node does; "value" is its magnitude.
skilltree:
  nodes:
    luck_1:
      display: "Luck I"
      cost: 50
      requires: ""
      effect: LUCK
      value: 0.05
    luck_2:
      display: "Luck II"
      cost: 200
      requires: "luck_1"
      effect: LUCK
      value: 0.10
    luck_3:
      display: "Luck III"
      cost: 750
      requires: "luck_2"
      effect: LUCK
      value: 0.20
    auto_convert:
      display: "Auto-Convert"
      cost: 300
      requires: "luck_1"
      effect: UNLOCK_AUTO_CONVERT
      value: 0
    auto_roll_1:
      display: "Autoroll I"
      cost: 1500
      requires: "auto_convert"
      effect: AUTO_ROLL
      value: 8
    auto_roll_2:
      display: "Autoroll II"
      cost: 5000
      requires: "auto_roll_1"
      effect: AUTO_ROLL
      value: 4

# Rolls of this rarity or higher get broadcast to the whole server.
broadcast:
  min-rarity-to-broadcast: EPIC
