    # V331: what one Nova Finder proc pays, in Nova Cores.
    nova-finder-amount: 1
    key-finder-reward: crate_key
    # Now and then the key Key Finder turns up is the rare one instead.
    # Cosmic Keys are store only, so the rare find is a Nebula Key.
    key-finder-rare-reward: nebula_key
