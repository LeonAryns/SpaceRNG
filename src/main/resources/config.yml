    prospector-share: 0.02
    golden-touch-multiplier: 2.0
    golden-touch-seconds: 15
    gem-rush-multiplier: 3.0
    gem-rush-seconds: 15
    echo-repeats: 8
    cascade-radius: 4
    cascade-gems: 2
    storm-payout: 25
    meteor-radius: 3
    supernova-coins: 250
    # Supernova is Nova Finder several times over, which is what makes it
    # the thing you graduate to rather than a separate lottery.
    supernova-nova-attempts: 3
    supernova-gems: 40
    lightning-radius: 5
    lightning-bolts: 5
    # V281: 500, a twentieth; with every Coins multiplier on top one Nuke
    # paid hundreds of trillions.
