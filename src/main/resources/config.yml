# ============================================
# Starting guide (/guide)
# ============================================
# A single ordered run that walks a new player through every system, with
# the current step on a boss bar. Linear on purpose: a grid of optional
# objectives is a checklist, a queue of one thing is a tutorial.
#
# Progress is READ from live state, never counted here, so steps can be
# reordered or rewritten without resetting anybody - and a player who
# already did something is credited for it the moment they log in.
#
# goal is one of:
#   ROLLS DISCOVERIES SKILL_NODES HAS_NODE TAG_EQUIPPED BANKED_DROPS
#   STARFORGE_TIER ARMOR_PIECES CROPS_HARVESTED NOVA_TIER
#   MILESTONES_CLAIMED LEVEL PRESTIGE
# HAS_NODE uses "target" for the node id.
guide:
  # Handed over when the last guide step is done. A free skill node is
  # worth most to somebody who saves it for something they cannot afford,
  # so it is deliberately not tied to a particular node.
  completion-free-skills: 1
  # A drop handed over on finishing a named step. The Basic Starforge
  # costs an Uncommon, which is rare enough early that a new player can
  # stall with nothing to do about it.
  # Nova Cores handed over the moment a player REACHES a named step, so
  # the step that asks for a forge comes with the Core to forge with.
  free-nova:
    nova_core: 1
  guaranteed-drop:
    starforge_upgrade: UNCOMMON
  # Every step of the guide hands over one voucher and nothing else. The
  # guide teaches the game; paying it in Coins made it a farming route.
  free-skills-per-step: 1
  quests:
    - id: first_rolls
      display: "Roll 10 times"
      hint: "Right-click your Starforge to roll."
      goal: ROLLS
      amount: 10
    - id: first_index
      display: "Discover 5 different drops"
      hint: "Every new drop is logged in /index."
      goal: DISCOVERIES
      amount: 5
    - id: auto_roll
      display: "Unlock Auto Roll"
      hint: "Open /skilltree and buy the root skill, then left-click your Starforge."
      goal: HAS_NODE
      target: auto_roll_root
      amount: 1
    - id: first_luck
      display: "Buy your first Luck level"
      hint: "Luck sits directly above Auto Roll in /skilltree."
      goal: HAS_NODE
      target: luck_skill
      amount: 1
    - id: convert_drops
      display: "Store 25 drops in /convert"
      hint: "Drop rolled items into /convert - stored drops buy armor and Starforges."
      goal: BANKED_DROPS
      amount: 25
    - id: starforge_upgrade
      display: "Upgrade your Starforge"
      hint: "Spend stored drops in /starforge to raise your base Luck."
      goal: STARFORGE_TIER
      amount: 1
    - id: index_luck
      display: "Unlock Index Luck"
      hint: "In /skilltree, right of Luck. It's what lets you equip a tag."
      goal: HAS_NODE
      target: index_luck
      amount: 1
    - id: equip_tag
      display: "Equip a tag"
      hint: "Click any discovered drop in /index to wear it and take its multiplier."
      goal: TAG_EQUIPPED
      amount: 1
    - id: armor_unlock
      display: "Unlock the armor shop"
      hint: "Buy Armor Unlocked in /skilltree, above Farming."
      goal: HAS_NODE
      target: armor_unlock
      amount: 1
    - id: first_armor
      display: "Buy an armor piece"
      hint: "/armor sells pieces one at a time - every worn piece adds Luck and Speed."
      goal: ARMOR_PIECES
      amount: 1
    - id: farming_unlock
      display: "Unlock farming"
      hint: "Buy Farming Unlocked in /skilltree to get the Farmer's Hoe."
      goal: HAS_NODE
      target: farming_unlock
      amount: 1
    - id: first_harvest
      display: "Harvest 50 crops"
      hint: "Break crops on the farm. Pick what grows for you with /crops."
      goal: CROPS_HARVESTED
      amount: 50
    - id: farm_skills
      display: "Buy your first farming skill"
      hint: "/farmtree is a whole second tree - crops, hoe enchants and Token multipliers."
      goal: HAS_NODE
      target: crop_wheat
      amount: 1
    - id: nova_core
      display: "Forge a Nova Core tier"
      hint: "Right click the Nova Core you were just given, or open /novacore."
      goal: NOVA_TIER
      amount: 1
    - id: claim_milestone
      display: "Claim a milestone reward"
      hint: "/milestones tracks the long game. Rewards wait there until you collect them."
      goal: MILESTONES_CLAIMED
      amount: 1
    - id: reach_level
      display: "Reach level 5"
      hint: "Rolling levels you up. Spend levels in /prestige."
      goal: LEVEL
      amount: 5
    - id: first_prestige
      display: "Prestige once"
      hint: "/prestige trades your level for a permanent Luck multiplier."
      goal: PRESTIGE
      amount: 1

# ============================================
# The join banner
# ============================================
# The player's own face, drawn in chat from their real skin, with these
# lines beside it. Paper hands the skin URL straight off the profile, so
# there's no Mojang API call to rate-limit; the PNG is fetched off the
# main thread once per session and cached.
#
# Eight lines sit level with the face. A ninth and beyond continue
# underneath it, and fewer than eight is fine.
#
# {player} and {online} are replaced. Colour codes use "&".
# /rngadmin welcome replays it without rejoining.
welcome:
  enabled: true
  # A moment after joining, so it lands under the join spam rather than
  # above it where it scrolls away unread.
  delay-ticks: 20
  # Shown to somebody who has played here before.
  lines:
    - "&d&l✦ WELCOME BACK &d&l✦"
    - "&8&lBETA"
    - ""
    - "&d| &fType &d/shop &fto see every shop."
    - "&d| &fType &d/guide &fif you're new."
    - "&d| &fType &d/buy &fto support us."
    - ""
    - "&8&nSPACERNG.MINEHUT.GG"
  # Shown on somebody's very first join instead. Leave the list empty to
  # give everyone the same banner.
  first-join-lines:
    - "&d&l✦ WELCOME &d&l✦"
    - "&8&lBETA"
    - ""
    - "&d| &fRight-click your &dRoll &fitem to start."
    - "&d| &fType &d/guide &fand it'll walk you through."
    - "&d| &fType &d/shop &fwhen you've got something to spend."
    - ""
    - "&8&nSPACERNG.MINEHUT.GG"

# ============================================
# Consumables (potions, charges, permanent grants)
# ============================================
# Redeemable items handed out by /milestones, the Battle Pass, crates and
# /rngadmin. They're real items rather than an invisible balance on
# purpose: a reward you can hold and choose when to use is worth more than
# the same number applied silently, and it means a crate plugin can hand
# out the same thing this plugin does without knowing anything about it.
#
# Give one from anywhere with:
#   /rngadmin consumable <id> [amount] [player]
#
# effect:
#   LUCK            multiplies all Luck for duration-seconds
#   SPEED           multiplies roll Speed
#   TOKENS          multiplies Tokens from the farm
#   ENCHANT_PROC    multiplies every hoe enchant's chance
#   ROLL_CHARGE     banks `charges` rolls that fire at `magnitude` x Luck
#   PERMANENT_LUCK  adds `magnitude` Luck on the spot, forever
#
# Drinking a second potion of the same kind extends it if it's the same
# strength and replaces it if it's stronger - two never multiply together.
# Crates. Any block becomes one with /rngadmin crate set <crate> while you
# look at it; the coordinates live in crates.yml, not here.
#
# Left click previews, right click with a key opens, sneak and right click
# opens a whole stack at once without the spin.
#
# Rewards are weighted like the roll table. Every chance a player sees is
# worked out from these weights, so there is no percentage to keep in step
# by hand. One reward type per line:
#   coins / gems / money / credits: <amount>
#   consumable: <id>   (with amount: <n>)
#   drop: <RARITY>     (with amount: <n>; picks weighted like a real roll)
# Optional on any line: icon: <MATERIAL>, name: "&6Custom label"
#
# jackpot-below: a reward rarer than this share is announced to the whole
# server and gets the big finish.
crates:
  # Steps the reel takes, and how slow the very last step is in ticks.
  spin-steps: 32
  slowest-gap-ticks: 7
  # The most keys one sneak click opens.
  quick-open-max: 25
  types:
    farm:
      display: "Farm Crate"
      colors: ["#FFE082", "#FF8F00"]
      key: crate_key
      key-source: "Farm Keys are dug up by the Key Finder enchant on your hoe."
      jackpot-below: 0.03
      rewards:
        - { weight: 30, coins: 25000 }
        - { weight: 18, gems: 50 }
        - { weight: 14, money: 50000 }
        - { weight: 12, coins: 100000 }
        - { weight: 10, consumable: coin_potion }
        - { weight: 8, consumable: enchant_potion }
        - { weight: 8, consumable: luck_potion }
        - { weight: 8, drop: UNCOMMON, amount: 3 }
        - { weight: 6, consumable: nova_core }
        - { weight: 2.5, consumable: free_skill }
        - { weight: 2, drop: RARE }
        - { weight: 1.5, consumable: roll_10x }
        - { weight: 0.4, consumable: luck_50 }
    cosmic:
      display: "Cosmic Crate"
      colors: ["#E1BEE7", "#7C4DFF", "#40C4FF"]
      key: cosmic_key
      key-source: "Cosmic Keys are the rare find from Key Finder, about one key in twelve."
      jackpot-below: 0.04
      rewards:
        - { weight: 25, coins: 250000 }
        - { weight: 18, gems: 250 }
        - { weight: 14, money: 500000 }
        - { weight: 12, consumable: nova_core, amount: 2 }
        - { weight: 8, consumable: free_skill }
        - { weight: 8, consumable: roll_10x, amount: 3 }
        - { weight: 7, drop: RARE, amount: 2 }
        - { weight: 3, drop: EPIC }
        - { weight: 2.5, consumable: luck_50 }
        - { weight: 0.5, consumable: luck_250 }

# Floating heads on a leaderboard. Place them in game:
#   /rngadmin tophead podium farming_total   (#1, #2, #3 around you)
#   /rngadmin tophead set farming_total 1    (one rank, at your eyes)
# Spots live in topheads.yml. The heads are never saved into the world, so
# removing the plugin can never leave any behind.
top-heads:
  refresh-seconds: 30
  spin-degrees-per-second: 90
  bob-height: 0.12
  # 1.5 is roughly a real head's size and a half.
  scale: 1.5
  # How far under the head the name and score float.
  label-drop: 1.0
  show-label: true
  # Two small sparks orbiting whoever is #1.
  sparkle-first: true
  # 1.0 is vanilla render distance for display entities.
  view-range: 1.0

consumables:
  # ---- Draughts ----
  # Additive Luck and Speed, counted down in ROLLS rather than minutes.
  # `luck: 0.5` is +50% flat, joining the same pile the skill tree and
  # armor feed; `speed: 10` is +10 on the 100 scale. Both can go negative,
  # and the ones that do are the interesting ones: the trade IS the item.
  #
  # Only one draught runs at a time. A second replaces the first, so a
  # minus column can't be dodged by drinking something else on top of it.
  draught_steady:
    display: "Steady Draught"
    material: POTION
    colors: ["#B9F6CA", "#00C853"]
    luck: 0.50
    speed: 10
    rolls: 100
    description: "The long-haul option. Nothing spectacular, nothing lost."
    costs:
      UNCOMMON: 30
      RARE: 6
  draught_swift:
    display: "Swift Draught"
    material: POTION
    colors: ["#FFF59D", "#FFB300"]
    luck: 0.10
    speed: 50
    rolls: 60
    description: "Half again as many rolls an hour. Barely luckier."
    costs:
      UNCOMMON: 45
      RARE: 8
  draught_deep:
    display: "Deep Draught"
    material: POTION
    colors: ["#B39DDB", "#5E35B1"]
    luck: 1.00
    speed: -10
    rolls: 50
    description: "Slower, and much luckier for it."
    costs:
      RARE: 14
      EPIC: 2
  draught_surge:
    display: "Surge Draught"
    material: POTION
    colors: ["#FF8A80", "#D50000"]
    luck: 2.50
    speed: -25
    rolls: 10
    description: "Ten rolls that matter. You will feel every second of them."
    costs:
      RARE: 20
      EPIC: 5
  draught_greater:
    display: "Greater Draught"
    material: POTION
    colors: ["#A7FFEB", "#00BFA5", "#1DE9B6"]
    luck: 1.50
    speed: 25
    rolls: 25
    description: "No downside, and priced like it."
    costs:
      EPIC: 10
      LEGENDARY: 2

  # ---- Farm boosts ----
  # These stay on a clock, because a farm run isn't measured in rolls.
  coin_potion:
    display: "Coin Potion"
    material: POTION
    colors: ["#FFE082", "#FF8F00"]
    coin-multiplier: 2.0
    duration-seconds: 1800
    description: "Every crop pays double."
    costs:
      UNCOMMON: 30
      RARE: 6
  enchant_potion:
    display: "Enchant Potion"
    material: POTION
    colors: ["#E1BEE7", "#8E24AA"]
    enchant-multiplier: 1.5
    duration-seconds: 1800
    description: "Every hoe enchant fires half again as often."
    costs:
      RARE: 15
      EPIC: 2

  # ---- Milestone rewards ----
  # Plainly named on purpose. A milestone tells you what you're getting
  # before you've ever opened /potion, so "Luck Potion" has to mean what
  # it says. The shop's own draughts get the interesting names, because
  # by the time you're buying one you already know what a draught is.
  luck_potion:
    display: "Luck Potion"
    material: POTION
    colors: ["#B39DDB", "#5E35B1"]
    luck: 1.00
    rolls: 50
    description: "+100% Luck for your next 50 rolls."
  speed_potion:
    display: "Speed Potion"
    material: POTION
    colors: ["#FFF59D", "#FFB300"]
    speed: 50
    rolls: 60
    description: "+50% Speed for your next 60 rolls."

  # ---- Charges and grants ----
  roll_10x:
    display: "10x Roll"
    material: NETHER_STAR
    colors: ["#FFF9C4", "#FFD54F", "#FF8F00"]
    roll-luck-multiplier: 10.0
    charges: 1
    description: "Banks one roll at ten times your Luck."
    costs:
      EPIC: 8
      LEGENDARY: 2
  crate_key:
    display: "Farm Key"
    material: TRIPWIRE_HOOK
    colors: ["#FFE082", "#FF8F00"]
    description: "Opens the Farm Crate. Right click the crate with it."
  cosmic_key:
    display: "Cosmic Key"
    material: TRIPWIRE_HOOK
    colors: ["#E1BEE7", "#7C4DFF", "#40C4FF"]
    description: "Opens the Cosmic Crate. Right click the crate with it."
  nova_core:
    display: "Nova Core"
    material: HEART_OF_THE_SEA
    colors: ["#7FE7FF", "#00B0FF"]
    description: "Spend it in /novacore on a shot at the next tier."
  free_skill:
    display: "Skilltree Unlock Voucher"
    material: KNOWLEDGE_BOOK
    colors: ["#E1BEE7", "#8E24AA"]
    free-skills: 1
    description: "Unlocks one skill in /skilltree for free, whatever it costs."
  luck_50:
    display: "Permanent Luck +50%"
    material: RABBIT_FOOT
    colors: ["#B9F6CA", "#00C853"]
    permanent-luck: 0.5
    description: "A permanent 50% Luck. It never runs out."
  luck_250:
    display: "Permanent Luck +250%"
    material: RABBIT_FOOT
    colors: ["#FFF59D", "#00E676", "#00B0FF"]
    permanent-luck: 2.5
    description: "A permanent 250% Luck. It never runs out."

# ============================================
# Farming skill tree (/farmtree)
# ============================================
# A crop, six skills beside it, its yield, then the next crop.
#
# The general tree can afford three parallel lines because its skills
# have no order. The farm's do: wheat before carrots before nether wart,
# and a crop's yield skill is worthless before the crop. So the middle
# column IS the route, and every crop on it opens a row of six optional
# skills - three each side, getting better the further out they sit.
#
# The rows between crops carry nothing on purpose. Half the silhouette
# stays "???" the whole way up, which is what makes the tree look like
# somewhere to explore rather than a list you've already read.
#
# New enchants sit at the ends of the branches, where finding one is a
# reward for going out of your way. Coin Greed is the exception: it's
# the enchant you want on day one, so it sits right next to the wheat.
#
# Paid in Coins. The farm owns Coins and Gems outright.
#
# Families worth knowing:
#   CROP_YIELD    more Coins and Gems from ONE crop (target)
#   ENCHANT_PROC  raises every hoe enchant's chance at once
#   ENCHANT_CAP   raises the level ceiling on every hoe enchant, from
#                 the base-cap of 100 toward the hard 1000
#   HOE_TIER      walks the hoe itself up farming.hoe-tiers
farmtree:
  reserved: ["2,1", "3,1", "4,1", "5,1", "6,1", "7,1", "8,1",
             "2,2", "3,2", "4,2", "5,2", "6,2", "7,2", "8,2",
             "2,3", "3,3", "4,3", "5,3", "6,3", "7,3", "8,3",
             "2,4", "3,4", "4,4", "5,4", "6,4", "7,4", "8,4",
             "2,5", "3,5", "4,5", "5,5", "6,5", "7,5", "8,5",
             "2,6", "3,6", "4,6", "5,6", "6,6", "7,6", "8,6"]
