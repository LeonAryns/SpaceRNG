        - { at: 25, consumable: luck_potion, consumable-amount: 3 }
        - { at: 35, consumable: roll_10x, consumable-amount: 5 }
        - { at: 50, consumable: speed_potion, consumable-amount: 5 }
        - { at: 75, consumable: roll_10x, consumable-amount: 10 }
        - { at: 100, consumable: luck_potion, consumable-amount: 10 }
    rarity:
      verb: "Discover"
      display: "Index"
      icon: END_CRYSTAL
      unit: "drops found"
