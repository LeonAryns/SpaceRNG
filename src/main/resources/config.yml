index:
  # Luck for every entry discovered, before any skill. Collecting is
  # supposed to BE progression, not just a prerequisite for a skill that
  # makes collecting progression.
  luck-per-discovery: 0.004
  luck-multipliers:
    COMMON: [1.0, 1.1]
    UNCOMMON: [1.1, 1.25]
    RARE: [1.25, 1.5]
    EPIC: [1.5, 2.0]
    LEGENDARY: [2.0, 3.0]
    MYTHICAL: [3.0, 5.0]
    DIVINE: [8.0, 8.0]

  # Finishing a whole rarity is worth a Luck multiplier on its own, and
  # they MULTIPLY with each other - completing every tier is the end of
  # the collection game, so it should feel like it.
  #
  # A rarity you've completed in shiny pays the bigger number INSTEAD of
  # the smaller one, not on top of it.
  #
  # Gated behind the same Tag Luck skill the tag multiplier is: until
  # that's bought, the index is a collection log and nothing more.
  completion:
    per-rarity: 1.25
    per-shiny-rarity: 2.0

# How many points ("Credits") a single item of each rarity is worth
# when converted via /convert.
# Legacy: /convert now banks a stored drop of the item's own rarity
# instead of paying Credits, so nothing reads these any more. Kept so the
# values aren't lost if a Credit payout ever comes back.
conversion:
  # How many of each rarity the vault holds. Raised by Vault Space in
  # /skilltree. A vault with no lid is a second inventory with infinite
  # slots, and there is no reason to ever spend what is in one.
  max-per-rarity: 100
  points-per-rarity:
    COMMON: 1
    UNCOMMON: 5
    RARE: 25
    EPIC: 150
    LEGENDARY: 1000
    MYTHICAL: 10000
    DIVINE: 250000

# Every roll also pays out real Money (the Vault economy), on top of the
# item itself - money = odds x this multiplier, so a 1-in-30 item pays 300
# at the default 10x. Requires Vault + an economy plugin to be installed.
economy:
  money-per-odds-multiplier: 10.0
  # Central price knobs for the skill trees, applied on top of every node's
  # own cost-money and cost-growth. The defaults change nothing. Per tree:
  #   multiplier    every price times this; 2.0 doubles the whole tree
  #   early-levels  how many first levels of a leveled node use early-growth
  #   early-growth  growth per level for those first levels, to make day 1
  #                 cheap (use a number below the nodes' own cost-growth)
  #   growth-scale  how steep the levels after that are: 1.5 turns a
  #                 cost-growth of 1.22 into 1.33, 0.5 turns it into 1.11
  # price = cost-money x multiplier x early-growth^min(level, early-levels)
  #         x (1 + (cost-growth - 1) x growth-scale)^max(0, level - early-levels)
  # A respec refunds at the prices these give right now, so settle them
  # before players start buying. /rngadmin reload applies a change.
  skill-prices:
    skilltree:
      multiplier: 1.0
      early-levels: 0
      early-growth: 1.15
      growth-scale: 1.0
    farmtree:
      multiplier: 1.0
      early-levels: 0
      early-growth: 1.15
      growth-scale: 1.0

# The general skill tree. Three pages, all the same shape: a root at the
# bottom of the middle column, a spine across row 5, three lines climbing
# at columns 2, 5 and 8, and a crown along row 1.
#
# A page's root demands the capstone of the page below AND the top of all
# three of its lines (requires-all). You can't reach a new page having
# climbed one branch and ignored the other two.
#
# Luck, Speed and Coins deliberately recur once or twice a page, and every
# recurrence of a skill keeps the same icon - a skill you already
# understand showing up again, stronger and further out, is what makes
# depth in the tree worth paying for.
#
# Anything about farming lives in the farming tree instead, and nothing
# here scales a fixed reward (daily streaks, milestones) - those pay the
# same to everyone by design.
#
# "requires" is the id of the node that must be unlocked first (blank =
# no requirement). "effect" tells the plugin what the node does and
# "value" is its magnitude, per level for a leveled node. "cost-growth"
# multiplies the price after each level (1.25 = each level costs 25% more).
# "page" is which page the node is drawn on, 1-indexed. Slot is
# (column, row), both 1-indexed, in the 6x9 grid.
#
# Prices are a first pass: page base x 1.75 per step of depth, each page
# starting 100x above the last. Paid in Money.
skilltree:
  # Three pages, one identical shape. Every page has the same 24-slot
  # frame Leon spec'd: three vertical spines (Speed at column 2, Luck at
  # column 5, Money at column 8) all converge on row 5, a single root at
  # (5,6), two extras at row 3 (one per side spine) and two extras at
  # row 2 that both feed the Luck spine. The three pages then differ
  # only in what those 24 nodes actually do: page 1 lays the foundations
  # every player needs, page 2 opens the mid-game power spikes, page 3
  # is the endgame with the three path capstones.
  reserved: []
  pages: 5
  page-names: ["Foundations", "Ascension", "Convergence", "Mastery", "Cosmic"]
  nodes:

    # ====================================================================
    #  PAGE 1 - FOUNDATIONS
    # ====================================================================

    # Root of the whole tree. Sits alone in the very middle of row 6.
    auto_roll_root:
      display: "Auto Roll"
      page: 1
      slot: "5,6"
      icon: CLOCK
      cost-money: 400
      requires: ""
      effect: AUTO_ROLL
      value: 0

    # -- Luck spine (col 5, rows 5 up to 1) --
    luck_skill:
      display: "Luck I"
      page: 1
      slot: "5,5"
      icon: RABBIT_FOOT
      cost-money: 700
      cost-growth: 1.22
      requires: "auto_roll_root"
      effect: LUCK
      value: 0.05
      max-level: 10

    luck_2:
      display: "Luck II"
      page: 1
      slot: "5,2"
      icon: RABBIT_FOOT
      cost-money: 28700
      cost-growth: 1.24
      requires: "index_luck"
      effect: LUCK
      value: 0.08
      max-level: 10

    # Index Luck I turns on the base Luck per discovered drop
    # (index.luck-per-discovery), and each level adds its value on top.
    curator_1:
      display: "Index Luck I"
      page: 1
      slot: "5,4"
      icon: BOOKSHELF
      cost-money: 10000
      cost-growth: 1.3
      requires: "luck_skill"
