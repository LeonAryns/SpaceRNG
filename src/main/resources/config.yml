# /index — every unique item a player has ever rolled gets logged here.
# The first time they roll a brand new item, they get a small permanent
# Luck bonus on top of whatever the skill tree gives them.
index:
  luck-per-item: 0.01

# How many points ("Credits") a single item of each rarity is worth
# when converted via /convert.
conversion:
  points-per-rarity:
    COMMON: 1
    UNCOMMON: 5
    RARE: 25
    EPIC: 150
    LEGENDARY: 1000
    MYTHICAL: 10000

# Every roll also pays out real Money (Vault), on top of the item itself —
# money = item's odds x this multiplier, so a 1-in-30 item pays 300 Money
# at the default 10x. Requires Vault + an economy plugin to be installed.
economy:
  money-per-odds-multiplier: 10.0

# Skill tree nodes. "requires" is the id of the node that must be
# unlocked first (blank = no requirement). "effect" tells the plugin
# what the node does; "value" is its magnitude.
skilltree:
  # Nodes are paid for with rolled drops (Common, Uncommon, ...), not
  # Credits — Credits are the real-money store currency, not something
  # free gameplay should be able to spend on progression.
  nodes:
    auto_roll_root:
      display: "Auto Roll"
      costs:
        COMMON: 20
      requires: ""
      effect: AUTO_ROLL
      value: 10

    # Directly above the root — gates the Farming/Armor/Potion chain on
    # the right branch and the Speed/Luck leveled skills on the left.
    luck_gate:
      display: "Luck"
      costs:
        COMMON: 50
      requires: "auto_roll_root"
      effect: LUCK
      value: 0.02

    # Right branch, bottom to top: Farming -> Armor -> Potion.
    farming_unlock:
      display: "Farming Unlocked"
      costs:
        UNCOMMON: 20
      requires: "luck_gate"
      effect: UNLOCK_FARMING
      value: 0
    armor_unlock:
      display: "Armor Unlocked"
      costs:
        UNCOMMON: 50
      requires: "farming_unlock"
      effect: UNLOCK_ARMOR
      value: 0
    potion_unlock:
      display: "Potion Unlocked"
      costs:
        RARE: 15
      requires: "armor_unlock"
      effect: UNLOCK_POTION
      value: 0

    # Left branch — leveled nodes, same cost paid per level.
    speed_skill:
      display: "Speed"
      costs:
        COMMON: 15
      requires: "luck_gate"
      effect: ROLL_SPEED
      value: 0.02
      max-level: 10
    luck_skill:
      display: "Luck"
      costs:
        COMMON: 15
      requires: "luck_gate"
      effect: LUCK
      value: 0.05
      max-level: 10

# Rolls of this rarity or higher get broadcast to the whole server.
broadcast:
  min-rarity-to-broadcast: EPIC
