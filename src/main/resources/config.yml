# Leaderboards and the daily farming payout.
#
# The plugin keeps its own player index (leaderboard.yml) because the live
# cache only holds players who are ONLINE - a board built from that would
# quietly be a board of whoever happens to be connected.
#
# The period rolls over at reset-hour in this timezone. Winners are paid
# even if they're offline at the time: their save file is credited
# directly.
#
# For a hologram, use DecentHolograms with these placeholders:
#   %solrng_top_farming_1_name%    %solrng_top_farming_1_value%
#   %solrng_top_farming_1_reward%  %solrng_farm_reset%
#   %solrng_farm_place%            %solrng_farm_value%
#   %solrng_farm_peak%             %solrng_farm_needed%
#   %solrng_farm_payout%           "unlocked" or "locked"
# Boards: farming, farming_total, rolls, prestige, index
leaderboard:
  timezone: "UTC"
  farming:
    # The daily farming board resets at this hour, in the timezone above.
    # 0 = midnight. Every player's crop count for the period zeroes and
    # the top three are paid on the way out.
    reset-hour: 0
    # Paid in Credits - the one place free play mints them. Everywhere
    # else Credits come from the store, but a daily board worth real
    # money is the reason to come back tomorrow, and that's worth more
    # than keeping the currency pure.
    credit-payouts: [150, 100, 50]
    # The payout only runs on a day the server actually filled up. This
    # is the day's PEAK concurrent count, not the count at the rollover
    # hour: the roll happens at midnight and a healthy server is empty
    # then too. 0 turns the check off and pays every day.
    min-players: 10

# Rotating server tips. These rotate in ORDER, not at random: random
# repeats itself and leaves some tips unseen for ages, which is exactly
# wrong for something meant to teach. Each list entry is one block of
# lines sent together under the header.
announcements:
  enabled: true
  interval-seconds: 300
  # Every this-many-th announcement is the Discord one (V260); 2 is every
  # other, so with 300 seconds above it comes round every ten minutes.
  # 0 keeps it in the normal rotation.
  discord-every: 2
  # Takes turns with the Discord tip in that slot (V261).
  feedback:
    - "&3▎ &e▸ &7Found a bug or have an idea? You earn &dCredits&7 for it."
    - "&3▎ &e▸ &7Post it in the &9&lDiscord&7 feedback channel. Type &e/discord&7 to join."
  # A banner frame around every announcement. Header runs above every
  # block, footer below. Two thin bars turn a short message into a
  # visible "spot" in chat instead of another grey line, and the
  # rotating messages themselves stay short.
  header: "&8&m                                                  "
  footer: "&8&m                                                  "
  messages:
    - - "&3\u258e &e\u25b8 &fLeft-click&7 your Starforge to toggle &bAuto Roll&7."
      - "&3\u258e &e\u25b8 &7Put spare drops in &e/convert&7 to buy armor and Starforges."
    - - "&3\u258e &e\u25b8 &7Wear any drop you have found as a &btag&7 from &e/index&7."
      - "&3\u258e &e\u25b8 &7The Luck multiplier is your best &dsecret&7 - see &d/secretindex&7."
    - - "&3\u258e &e\u25b8 &d/novacore&7 is the fourth way to raise your Luck, after skills, armor and prestige."
      - "&3\u258e &e\u25b8 &7Forge it a tier at a time with &6Coins&7. Every tier you hold is a permanent multiplier on &fLuck&7, &aMoney&7 and &6Coins&7 alike."
    - - "&3\u258e &e\u25b8 &a/farmtree&7 has crops, hoe enchants and Coin multipliers."
      - "&3\u258e &e\u25b8 &7Pick what grows for you with &e/crops&7. The field is yours alone."
    - - "&3\u258e &e\u25b8 &7Long-run goals live in &e/milestones&7. Rewards wait there to be claimed."
      - "&3\u258e &e\u25b8 &7New here? &e/guide&7 walks you through everything."
    - - "&3\u258e &e\u25b8 &7Claim your streak every day with &e/daily&7. Miss one and it resets."
      - "&3\u258e &e\u25b8 &d/buy&7 has a &5Global Luck Boost&7 that helps the whole server."
    - - "&3\u258e &e\u25b8 &6/pass&7 pays out for every roll and every harvest. Rarer rolls are worth more XP."
      - "&3\u258e &e\u25b8 &7The &5premium track&7 back-pays every level you already cleared."
    - - "&3\u258e &e\u25b8 &d/skilltree&7 is three paths deep. &aMoney&7, &eSpeed&7 and &aLuck&7 each carry their own capstone."
      - "&3\u258e &e\u25b8 &7Respec any time in /skilltree, &ffree&7 - spend your Money somewhere else."
    - - "&3▎ &e▸ &7Join our &9&lDiscord&7 for giveaways, news and updates."
      - "&3▎ &e▸ &7Click to join: &b&ndiscord.gg/spacerng"
    - - "&3▎ &e▸ &7Roll a perk in &d/perks&7 with Perk Tickets. Every 100 rolls promise a Mythical."
      - "&3▎ &e▸ &7Every perk you have found is listed in &d/perks index&7."

# The daily streak (/daily). No checkpoints on purpose: the whole tension
# of a streak is that there's no safety net.
#
# Days are calendar days in this timezone, not rolling 24h windows, a
# rolling window slowly punishes people for playing earlier each day.
