    enchant_speed:
      display: "Speed Enchant"
      page: 1
      slot: "4,6"
      icon: "SUGAR"
      cost-money: 6500
      requires: ""
      effect: "UNLOCK_ENCHANT"
      value: 0
      target: "WALK_SPEED"

