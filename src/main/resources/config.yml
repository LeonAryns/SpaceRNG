# ============================================
# SpaceRNG configuration
# ============================================

# Bumped when a section changes shape in a way that would leave an
# existing config.yml on a running server out of step with the code -
# every time this goes up, the sections listed in ConfigMigrator run
# their fresh defaults in on top of whatever is on disk, so a server
# owner never has to delete the whole file to pick up a structural
# change. Item table, prices and cosmetic tweaks are untouched.
config-version: 46

# One-off value changes the plugin has already made to this file, so none
# is ever made twice. Managed by the plugin; leave it alone.
applied-patches: [common-label-white]

# How every menu writes its text: classic, clean, boxed or minimal.
# /rngadmin menustyles shows each one on hover and switches live.
menu-style: classic
# The hoe's tooltip, the enchant cards in the hoe menu and consumable items
# like the Nova Core have their own styles: /rngadmin hoestyles,
# enchantstyles and novastyles show and switch them.
hoe-style: attributes
enchant-style: classic
consumable-style: card
# Your own standings card in /leaderboards: summary, list, ranked, meter or
# compact. /rngadmin standingstyles shows them side by side.
standings-style: summary

# The time of day held in every overworld, in ticks: 1000 morning, 6000
# noon, 12000 sunset, 18000 midnight. -1 lets the sun move again.
world-time:
  lock: 6000
  # No rain or thunder, ever (V234).
  clear-weather: true

# The sidebar's fixed text. Colour codes use "&".
scoreboard:
  # Game textures in front of the sidebar lines (V163). No resource pack:
  # since Minecraft 1.21.9 text can draw any sprite the client already
  # has. Written "atlas|sprite". Try one in chat first with
  #   /rngadmin icon <atlas|sprite>
  # A player on an older client just sees no icon.
  icons-enabled: true
  icons:
    luck: "minecraft:gui|minecraft:mob_effect/luck"
    speed: "minecraft:items|minecraft:item/clock_00"
    prestige: "minecraft:items|minecraft:item/nether_star"
    money: "minecraft:items|minecraft:item/emerald"
    coins: "minecraft:items|minecraft:item/gold_ingot"
    gems: "minecraft:items|minecraft:item/diamond"
    credits: "minecraft:items|minecraft:item/amethyst_shard"
  title: "&5&l\u2726 ѕᴘᴀᴄᴇʀɴɢ \u2726"
  # Paints the title as a per-character purple gradient instead of the
  # flat colour above. Turn it off to go back to the "&" codes in `title`.
  title-gradient: true
  season: "BETA"
  footer: "SPACERNG.MINEHUT.GG"

roll-item:
  # V299/V303: an Epic or rarer only gets its reveal (and stops Auto Roll)
  # when the real chance at the player's Luck was 1 in this many or rarer.
  animate-from-one-in: 1000
  material: NETHER_STAR
  # No cooldown anymore - every roll takes this many seconds to resolve,
  # with an animation/progress bar while it's rolling. The Speed skill
  # tree branch and worn armor shorten this via the player's Speed stat.
  roll-duration-seconds: 5
  # The click track under a roll. It fires several times a second, so it
  # has to sit under the music rather than on top of it.
  roll-sound-volume: 0.12
  # The tooltip layout on new drops: classic, pipe, compact, stats, card,
  # ladder or story. /rngadmin lorestyles [rarity] [shiny] gives one sample
  # of each to compare. Items already rolled keep the lore they came with.
  # V335: the shortest of the seven, Leon's call ("less lines in the
  # description of the drops"). /rngadmin lorestyles [rarity] [shiny]
  # gives one sample of each to compare. Items already rolled keep the
  # lore they came with.
  lore-style: compact
  # The Bonus Roll branch in /skilltree: a roll that chains into another
  # one for free.
  #
  # V335: the five nodes used to add up to exactly 1.00 at full, so a
  # maxed player never stopped rolling. They are half that now, and these
  # two are the hard stops: nothing can push the chance past max-chance,
  # and a run of bonus rolls ends after max-chain of them however lucky
  # it is.
  bonus-roll:
    max-chance: 0.75
    max-chain: 5
  # Once in a while a roll comes out one tier rarer than it landed. It is
  # deliberately NOT affected by Luck: this is the moment a brand new
  # player gets something they had no business getting. Capped below the
  # top rarity, so the thing everyone is chasing still has to be earned.
  lucky-strike:
    chance: 0.004
    max-rarity: MYTHICAL
  # The reveal on an Epic or better roll: a comet falling out of the sky
  # with the odds counting up in front of the roller, climbing through the
  # rarity bands one act at a time.
  #
  # IT IS ONE ACT PER BAND, each the same length. Five seconds of Epic,
  # and then either it ENDS there and the drop was an Epic, or it breaks
  # through into five seconds of Legendary, and so on. A Divine is four
  # acts and twenty seconds. Switch Epic off in /options and your shows
  # open at Legendary, so a Divine takes fifteen.
  #
  # That fixed length is the point. Every act is the same act whatever is
  # coming, so the opening five seconds of a Divine are indistinguishable
  # from the only five seconds of an Epic, and the length of the roll
  # gives nothing away until the band you are in does.
  #
  # The bands are the shortest odds in each one, read off the items list
  # rather than written here, so they follow whatever the items say:
  # Epic 33,000, Legendary 100,000, Mythical 250,000, Divine 10,000,000.
  #
  # It is drawn for the roller and for nobody else. Everyone around them
  # sees a player standing still with the aura on the ground growing and
  # changing colour at each band, which is their only tell.
  comet:
    enabled: true
    # The comet itself, falling out of the sky through each act. Off since
    # V210: the acts, the counter and the impacts run without it. true
    # brings it back.
    falling: false
    # The question mark head held in front of you during the build-up.
    # Off since V210, so the counter has the screen to itself; the drop
    # still appears the moment the counter lands.
    question-mark: false
    # How long one band lasts, in seconds. This is the whole timing of a
    # reveal: raise it and every rarity gets longer in the same steps.
    stage-seconds: 5.0
    # The odds climbing on the screen, where a roll's own name usually
    # lands. Switch this off and the normal reel keeps the screen:
    # candidates, names and all.
    counter: true
    # How big that number is. A multiplier on the per band sizes, so 1.5
    # makes every band half again as large and 0.7 pulls the lot back.
    # The only number here that cannot be judged without standing in the
    # game, so it is the one worth turning.
    counter-scale: 1.0
    # How much bigger the question mark head is drawn than an ordinary
    # drop. A skull is an eight cube inside the sixteen cube every item
    # model lives in, so at the same number it comes out half the size of
    # a sprite; 2.0 puts it at about the size a drop takes on the screen,
    # which is what was asked for. It then grows a step with every band
    # the roll survives, so by a Divine's last act it is half again as
    # big as it started.
    head-scale: 2.0
    # The head held in front of the roller while the odds climb, instead
    # of the drop itself. Any "value" field from a head site goes in here
    # as it is, and so does the plain texture URL or its hash. This one is
    # a black question mark. /rngadmin head hands you the item, which is
    # how you tell a bad texture from a bad effect.
    mystery-head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDZiYTYzMzQ0ZjQ5ZGQxYzRmNTQ4OGU5MjZiZjNkOWUyYjI5OTE2YTZjNTBkNjEwYmI0MGE1MjczZGM4YzgyIn19fQ=="
    # Where the two pieces that hang in front of you are put: the drop
    # (a question mark until the odds land on it) and the odds themselves.
    #
    # "pinned" mounts them on you and lets the client place them from its
    # own camera every frame, which is how the roll reel has always shown
    # its items and has no lag at all. "world" works the same spot out in
    # ordinary coordinates and teleports them there every tick instead:
    # one tick behind a fast head turn, but it can be moved with the three
    # numbers below, which pinned ignores.
    #
    # ahead is how far in front of your eyes they sit, item-down how far
    # the drop hangs below that line and counter-up how far the odds sit
    # above it, all in blocks and all world mode only.
    screen:
      mode: pinned
      ahead: 1.6
      item-down: 0.45
      counter-up: 0.28
    # How much room is kept clear around the roller's own eyes, in blocks.
    # Nothing in the reveal is drawn nearer than this TO THAT VIEWER, so
    # the effect is untouched for everybody watching from outside and
    # nobody is ever standing inside a cloud. It was 2.6 in V198 and that
    # took too much of the aura with it; 1.5 clears about what an arm
    # reaches. Set it to 0 to put every particle back.
    face-clear: 1.5
    # Swings the roller's view up towards the comet while it falls.
    #
    # Left off, and not because it does not work. Minecraft gives a plugin
    # no camera of its own, so the only way to aim somebody's view is to
    # write their real rotation, and their client reports that straight
    # back to the server. Everyone nearby would see them spin round, which
    # is the one thing this effect is built to avoid. The comet comes down
    # in the direction the roller is already facing instead, so it is in
    # view from the first frame without touching anything.
    steer-view: false

# The Starforge - right-click to roll, left-click to toggle Auto Roll
# (once the Auto Roll skill is unlocked). Everyone starts on BASIC;
# better ones are bought in /starforge and give a bigger base Luck.
# luck-bonus 0.25 = 25% Luck. This is a player's BASE luck - the skill
# tree and armor add to it, and the index multiplier scales the total.
# "colors" is the same per-character gradient engine the Epic+ item names
# use: one entry = flat color, 2+ = a gradient across the name. Accepts
# "#RRGGBB" hex or "&6"-style legacy codes, plus bold/underline/
# strikethrough flags.
starforge:
  # Every tier is a trade, not just a bigger number.
  #
  # Two lines run up the ladder. The DEEP ones buy Luck and pay for it in
  # Speed; the SWIFT ones roll far faster and shallower. Both are viable,
  # because rolls per hour and Luck per roll are worth the same thing in
  # the end, and picking between them is a decision rather than a queue.
  #
  # luck-bonus   base Luck, added flat before everything scales it
  # speed-bonus  added to the Speed pile, and allowed to be negative
  # ability      shift plus right-click, on the late tiers only
  tiers:
    # What everybody is handed. It rolls, and that is all it does - the
    # first real upgrade is a few minutes of Common drops away, which is
    # also what makes the guide finishable in one sitting.
    STARTER:
      display: "Starter Starforge"
      colors: ["#6B7280", "#9CA3AF"]
      luck-bonus: 0.0
      speed-bonus: 0.0
      costs: {}
    BASIC:
      display: "Basic Starforge"
      colors: ["#9AA0A6", "#D8DEE4"]
      luck-bonus: 0.25
      speed-bonus: 0.0
      costs:
        COMMON: 25
        UNCOMMON: 1
    INTERMEDIATE:
      display: "Intermediate Starforge"
      colors: ["#2FBF4F", "#A6F26B"]
      luck-bonus: 0.50
      # +50 Speed, as the sidebar counts it (V245, Leon's call; it was 5.0,
      # +500, faster than every tier above it).
      speed-bonus: 0.50
      costs:
        COMMON: 75
        UNCOMMON: 25
        RARE: 5
    # ---- The swift line ----
    ADVANCED:
      display: "Advanced Starforge"
      colors: ["#1FB6E8", "#5B8CFF"]
      luck-bonus: 1.00
      speed-bonus: 0.35
      costs:
        COMMON: 200
        UNCOMMON: 75
        RARE: 20
        EPIC: 3
    # ---- The deep line ----
    # The fork. Two Refined forges, opposite trades, and you can reach
    # either one from Advanced.
    REFINED:
      display: "Refined Luck Starforge"
      colors: ["#8B5CF6", "#E879F9"]
      bold: true
      luck-bonus: 2.00
      speed-bonus: -0.35
      costs:
        UNCOMMON: 200
        RARE: 60
        EPIC: 10
    REFINED_SPEED:
      display: "Refined Speed Starforge"
      colors: ["#22D3EE", "#A5F3FC"]
      bold: true
      luck-bonus: 0.50
      speed-bonus: 1.00
      costs:
        UNCOMMON: 240
        RARE: 45
        EPIC: 12
    SUPERIOR:
      display: "Superior Starforge"
      colors: ["#FF9F1C", "#FFE066"]
      bold: true
      luck-bonus: 2.00
      speed-bonus: 0.70
      costs:
        RARE: 150
        EPIC: 35
        LEGENDARY: 3
    # Masterwork and up are placeholder prices - they are meant to need
    # the rarer drops, so retune these once those feel right in-game.
    MASTERWORK:
      display: "Masterwork Starforge"
      colors: ["#FF3D3D", "#FF9F1C", "#FFE066"]
      bold: true
      luck-bonus: 6.00
      speed-bonus: -0.25
      ability:
        display: "Deep Focus"
        description: "Three times the Luck, while it lasts."
        duration-seconds: 30
        cooldown-seconds: 3600
        luck-multiplier: 3.0
      costs:
        EPIC: 100
        LEGENDARY: 10
    RADIANT:
      display: "Radiant Starforge"
      colors: ["#00E5FF", "#FFFFFF", "#FFD200"]
      bold: true
      luck-bonus: 4.00
      speed-bonus: 1.20
      ability:
        display: "Overcharge"
        description: "Ten times the Speed, for half a minute."
        duration-seconds: 30
        cooldown-seconds: 3600
        speed-multiplier: 10.0
      costs:
        EPIC: 250
        LEGENDARY: 30
        MYTHICAL: 2
    CELESTIAL:
      display: "Celestial Starforge"
      colors: ["#7F00FF", "#E100FF", "#00E0FF"]
      bold: true
      luck-bonus: 12.50
      speed-bonus: 0.50
      ability:
        display: "Convergence"
        description: "Double Luck and triple Speed at once."
        duration-seconds: 45
        cooldown-seconds: 3600
        luck-multiplier: 2.0
        speed-multiplier: 3.0
      costs:
        LEGENDARY: 100
        MYTHICAL: 10

# The equipped-drop tag shown above a player's head.
#
# manage-nametag: true  - this plugin writes the nametag itself, via
#                         scoreboard team prefixes.
#                 false - hands nametags over to TAB (or any other nametag
#                         plugin) and stops writing teams entirely. Two
#                         plugins both setting team prefixes for the same
#                         player fight each other and TAB's anti-override
#                         wins, so set this to false once TAB is installed
#                         and point TAB at %solrng_tag% instead.
#
# The tag placeholders keep working either way:
#   %solrng_tag%            the nametag text (gradient + Epic+ flair)
#   %solrng_tag_plain%      same colors, no obfuscated flair - use in TAB
#   %solrng_tag_name%       uncolored item name
#   %solrng_tag_odds%       e.g. 1,700
#   %solrng_tag_multiplier% e.g. 1.14
#   %solrng_prestige%       raw number
#   %solrng_prestige_roman% I, II, III...
#   %solrng_prestige_badge% blank at 0, otherwise a star + numeral
#   %solrng_level%          the Lv/prestige badge
#   %solrng_level_number%   raw level
tag:
  # V251: false. The tag floats over the head on its own; the prefix put
  # it a second time in front of the name on the same nameplate.
  manage-nametag: false
  # The longest a drop's name may be where it has to share a line: the tab
  # list and chat. A tab entry is a name, a rank badge, a tag and the odds
  # side by side, and a long drop name pushes the rest off the row. Only
  # that shortened copy is cut; the drop itself, its tooltip and the
  # nametag over somebody's head keep the whole name. 0 switches it off.
  max-name-length: 18
  # How the odds line under a tag looks: dots, squares, diamonds, compact
  # or split. /rngadmin tagstyles shows them side by side and switches live.
  odds-style: dots

# Farm crops (a shared field everyone harvests together) - breaking a
# fully-grown crop listed here pays Tokens on top of its normal drop,
# scaled per-player by their own farmTokenMultiplier, then replants
# straight back to fully-grown after regrow-seconds instead of waiting
# on random tick growth.
farming:
  regrow-seconds: 5
  # Regrow in TICKS, which is what the scheduler actually counts. A whole
  # second was the smallest value that could be written down, so the whole
  # farm was capped at one harvest per plot per second however good the
  # hoe was. Set this and regrow-seconds is ignored.
  regrow-ticks: 100
  # The fastest a plot may ever come back, however much Speed is on the
  # hoe. This used to be hard-coded at 10, which is why Speed stopped
  # being worth anything past half its ladder.
  regrow-floor-ticks: 2
  crops:
    WHEAT:
      tokens: 100
    CARROTS:
      tokens: 100
    POTATOES:
      tokens: 100
    BEETROOTS:
      tokens: 150
    NETHER_WART:
      tokens: 150

  # ---- The shared farm ----
  # Plots are real blocks placed with /rngadmin farmblock. Every player is
  # shown their OWN crop at every plot, so one field serves everybody at
  # once and nobody sees anyone else's harvests.
  #
  # "requires-node" is a skill tree node id. Blank = available from the
  # start. Set one and the crop stays locked until that node is bought, so
  # new crops can hang off new skill nodes later without a code change.
  # Until those nodes exist, /rngadmin crops can grant them for testing.
  #
  # Gems only ever pay once shards-node is unlocked (or granted).
  shards-node: "farming_shards"
  # ---- Hoe enchants ----
  # An enchant is switched on by an UNLOCK_ENCHANT node in the farming tree
  # and levelled with Tokens by right-clicking the hoe. The hoe itself
  # never holds any state - its power is a read of what's been bought.
  # Nothing to lose, trade or duplicate.
  #
  # Every enchant runs to 1000 levels and every one is a percentage, so
  # "level 400 of 1000" means the same thing whichever enchant you're
  # looking at. per-level x max-level is the value at the ceiling.
  #
  # You do NOT start with 1000 levels available: base-cap is the ceiling
  # you begin with, and the Enchant Mastery nodes in /farmtree raise it the
  # rest of the way. That's the whole point of mastery - without it, a cap
  # nobody could reach wasn't a cap at all.
  #
  # Costs are exponential (base-cost x cost-growth^level), so the last
  # hundred levels of an enchant cost more than the first nine hundred.
  # Every enchant runs to 10,000 levels and every one is a percentage, so
  # "level 4,000 of 10,000" means the same thing whichever you are looking
  # at. per-level x max-level is the value at the ceiling, and it is
  # written next to each one because that product IS the enchant.
  #
  # base-cap is what you START able to buy; the Enchant Mastery nodes in
  # /farmtree close the gap to max-level. A cap nobody can reach is not a
  # cap.
  #
  # The price is POLYNOMIAL, not exponential: base + step x level^power.
  # Compounding cannot survive ten thousand levels - even 1.0007 reaches
  # 1,100x by the end, and 1.007 reaches 2 x 10^30, which is more Coins
  # than will ever exist. A squared curve starts cheap, climbs the whole
  # way, and still lands somewhere a player can actually pay.
  #
  # Each enchant costs more than the one before it, because each one also
  # raises what you earn per minute. The first is an evening; the last is
  # a season.
  enchants:
    # ---- Always on ----
    TOKEN_GREED:
      display: "Coin Greed"
      icon: GOLD_NUGGET
      base-cost: 608
      cost-linear: 102.16216216216216
      cost-step: 0.28291022388071
      cost-power: 2.25
      description: "More Coins from every crop."
      color: "&e"
      max-level: 20000
      base-cap: 10000
      # V281: a tenth, Leon's call; it was +10,000% at level 10,000.
      per-level: 0.001
      # +1000% at the ceiling (the line below predates V159's 10,000 levels). Level 1 costs 710, level 1,000 costs 385,680,
      # 145,800,000 Coins for all of it.

    MOMENTUM:
      display: "Momentum"
      icon: POWERED_RAIL
      base-cost: 1324
      cost-linear: 222.63589587466222
      cost-step: 0.61653228581778
      cost-power: 2.25
      description: "An unbroken run of harvests builds a multiplier."
      color: "&2"
      max-level: 20000
      base-cap: 10000
      # V267: up to 5x at the ceiling, matching momentum.per-level-cap.
      per-level: 0.0004

    # ---- Procs ----
      # +400% at the ceiling. Level 1 costs 1,547, level 1,000 costs 840,492,
      # 317,733,229 Coins for all of it.

    SHARD_GREED:
      display: "Gem Greed"
      coming-soon: true
      icon: PRISMARINE_CRYSTALS
      base-cost: 738
      cost-linear: 124.12702702702701
      cost-step: 0.34373808525885
      cost-power: 2.25
      description: "A chance at a bonus Gem."
      color: "&b"
      max-level: 20000
      base-cap: 10000
      # V274: 1% of crops at the ceiling after proc-scale, Leon's call.
      per-level: 0.000005
      # 80% of crops at the ceiling. Level 1 costs 862, level 1,000 costs 468,603,
      # 177,147,000 Coins for all of it.

    KEY_FINDER:
      display: "Key Finder"
      icon: TRIPWIRE_HOOK
      base-cost: 897
      cost-linear: 150.81433783783783
      cost-step: 0.41764078210276
      cost-power: 2.25
      description: "A chance to turn up a crate key."
      color: "&6"
      max-level: 20000
      base-cap: 10000
      # V272: 0.5% at the ceiling after proc-scale (x0.2), Leon's call.
      per-level: 0.0000025
      # 2.5% before proc-scale, 0.5% after. Level 1 costs 1,048, level 1,000 costs 569,352,
      # 215,233,605 Coins for all of it.

    BLAST_HARVEST:
      display: "TNT Blast"
      icon: TNT
      base-cost: 1090
      cost-linear: 183.23942047297299
      cost-step: 0.5074331146016
      cost-power: 2.25
      description: "A chance to blow the neighbouring crops out too."
      color: "&c"
      max-level: 20000
      base-cap: 10000
      # V265: 50x lower, Leon's call; it was 0.0002 (20% at the ceiling).
      # V267: three times lower again.
      per-level: 0.0000013
      # 0.13% of crops at the ceiling. Level 1 costs 1,274, level 1,000 costs 691,763,
      # 261,508,830 Coins for all of it.

    POTION_FINDER:
      display: "Potion Finder"
      icon: BREWING_STAND
      base-cost: 1609
      cost-linear: 270.50261348771465
      cost-step: 0.74908570573681
      cost-power: 2.25
      description: "A chance to dig up a potion."
      color: "&d"
      max-level: 20000
      base-cap: 10000
      # V277: 0.1% at the ceiling after proc-scale (x0.2), Leon's call (was 1%).
      per-level: 0.0000005
      # 0.5% before proc-scale, 0.1% after (V277: ten times rarer). Level 1 costs 1,880, level 1,000 costs 1,021,197,
      # 386,045,873 Coins for all of it.

    LIGHTNING:
      display: "Lightning"
      icon: LIGHTNING_ROD
      base-cost: 1954
      cost-linear: 328.66067538757324
      cost-step: 0.91014194168264
      cost-power: 2.25
      description: "A chance to call bolts down on nearby crops."
      color: "&e"
      max-level: 20000
      base-cap: 10000
      # V274: 1% of crops at the ceiling after proc-scale, Leon's call.
      per-level: 0.000005
      # 10% of crops at the ceiling. Level 1 costs 2,284, level 1,000 costs 1,240,757,
      # 469,045,735 Coins for all of it.

    NOVA_FINDER:
      display: "Nova Finder"
      icon: HEART_OF_THE_SEA
      base-cost: 2375
      cost-linear: 399.3227205959015
      cost-step: 1.10581978513473
      cost-power: 2.25
      description: "A chance to find a Nova Core while farming."
      color: "&b"
      max-level: 20000
      base-cap: 10000
      # V331: ten times what it was, Leon's call ("increase the amount of
      # novacores you can get from crates and the enchant by quite a
      # bit"). 5% of crops at base-cap before proc-scale, about 1% after,
      # so a fully bought hoe finds roughly one Core per hundred crops.
      # It also pays a CORE now instead of forcing a free forge.
      per-level: 0.000005

    # ---- The late ones ----
      # 0.5% before proc-scale, 0.1% after. Level 1 costs 2,775, level 1,000 costs 1,507,518,
      # 569,890,568 Coins for all of it.

    NUKE:
      display: "Nuke"
      icon: FIRE_CHARGE
      base-cost: 29859
      cost-linear: 5021.29381635254958
      cost-step: 13.90517583823455
      cost-power: 2.25
      description: "A rare chance to level the whole field at once."
      color: "&4"
