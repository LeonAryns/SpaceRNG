# Leaderboards and the daily farming payout.
#
# The plugin keeps its own player index (leaderboard.yml) because the live
# cache only holds players who are ONLINE - a board built from that would
# quietly be a board of whoever happens to be connected.
#
# The period rolls over at reset-hour in this timezone. Winners are paid
# even if they're offline at the time: their save file is credited
# directly.
#
# For a hologram, use DecentHolograms with these placeholders:
#   %solrng_top_farming_1_name%    %solrng_top_farming_1_value%
#   %solrng_top_farming_1_reward%  %solrng_farm_reset%
#   %solrng_farm_place%            %solrng_farm_value%
#   %solrng_farm_peak%             %solrng_farm_needed%
#   %solrng_farm_payout%           "unlocked" or "locked"
# Boards: farming, farming_total, rolls, prestige, index
leaderboard:
  timezone: "UTC"
  farming:
    # The daily farming board resets at this hour, in the timezone above.
    # 0 = midnight. Every player's crop count for the period zeroes and
    # the top three are paid on the way out.
    reset-hour: 0
    # Paid in Credits - the one place free play mints them. Everywhere
    # else Credits come from the store, but a daily board worth real
    # money is the reason to come back tomorrow, and that's worth more
    # than keeping the currency pure.
    credit-payouts: [150, 100, 50]
    # The payout only runs on a day the server actually filled up. This
    # is the day's PEAK concurrent count, not the count at the rollover
    # hour: the roll happens at midnight and a healthy server is empty
    # then too. 0 turns the check off and pays every day.
    min-players: 10

# Rotating server tips. These rotate in ORDER, not at random: random
# repeats itself and leaves some tips unseen for ages, which is exactly
# wrong for something meant to teach. Each list entry is one block of
# lines sent together under the header.
announcements:
  enabled: true
  interval-seconds: 300
  # A banner frame around every announcement. Header runs above every
  # block, footer below. Two thin bars turn a short message into a
  # visible "spot" in chat instead of another grey line, and the
  # rotating messages themselves stay short.
  header: "&8&m                                                  "
  footer: "&8&m                                                  "
  messages:
    - - "&3\u258e &e\u25b8 &fLeft-click&7 your Starforge to toggle &bAuto Roll&7."
