    - - "&3\u258e &e\u25b8 &d/novacore&7 is the fourth way to raise your Luck, after skills, armor and prestige."
      - "&3\u258e &e\u25b8 &7Forge it a tier at a time with &6Coins&7. Every tier you hold is a permanent multiplier on &fLuck&7, &aMoney&7 and &6Coins&7 alike."
