# Long-run goals, shown in /milestones. Each track is one ladder of
# thresholds against a single number; tiers MUST be listed in ascending
# order. Rewards are optional per tier (tokens / shards / money) - the
# amounts below are a first pass, tune them freely.
#
# Progress is read from live state rather than counted separately, so it
# can't drift: prestige and index size already live on the player, and
# playtime comes straight from the vanilla statistic.
    # ====================================================================
    #  PAGE 5 - COSMIC: pets
    # ====================================================================
    #
    # This page is the roller's half of pets. Cosmic Dust falls while you
    # roll and nowhere else, and none of it falls until the root here is
    # bought, so the whole pet system has one door and this is it.
